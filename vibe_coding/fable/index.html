<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FABLE — אופנוע סילון מעופף</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0e14;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  canvas { display: block; }
  #err { display: none; position: fixed; top: 8px; left: 8px; right: 8px; z-index: 99;
    background: #8b1a1a; color: #fff; padding: 10px 14px; border-radius: 8px;
    font-family: monospace; direction: ltr; white-space: pre-wrap; }

  .hud { position: fixed; z-index: 10; color: #eef3f8; user-select: none; pointer-events: none; }
  .panel { background: rgba(10, 16, 26, 0.55); backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 10px 14px; }

  .stats { top: 14px; right: 14px; min-width: 190px; }
  .stats .row { display: flex; align-items: baseline; gap: 6px; margin: 2px 0; }
  .stats .row span:first-child { flex: 1; opacity: 0.75; font-size: 13px; }
  .stats b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .stats .u { opacity: 0.6; font-size: 12px; }
  .stats .small span { font-size: 11px; opacity: 0.6; }

  .score { top: 14px; left: 14px; min-width: 130px; }
  .score .row { display: flex; gap: 8px; align-items: baseline; margin: 2px 0; }
  .score .row span:first-child { flex: 1; opacity: 0.75; font-size: 13px; }
  .score b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .score .small span { font-size: 11px; color: #ffc36b; }

  .bars { bottom: 16px; right: 14px; min-width: 220px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 12px; }
  .bar-row > span { width: 46px; opacity: 0.8; }
  .bar { flex: 1; height: 10px; background: rgba(255,255,255,0.12); border-radius: 5px; overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 5px; transition: width 0.1s linear; }
  .fill.orange { background: linear-gradient(90deg, #d97a1e, #ffb347); }
  .fill.blue { background: linear-gradient(90deg, #2e7fc4, #7fd0ff); }

  .help { bottom: 16px; left: 14px; font-size: 12.5px; line-height: 1.75; max-width: 320px; }
  .help b { color: #ffc36b; }

  .msg { top: 22%; left: 0; right: 0; text-align: center; font-size: 30px; font-weight: 700;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6); opacity: 0; transition: opacity 0.25s; }
  .msg.show { opacity: 1; }
  .msg.crash { color: #ff6a5e; }

  .start { inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(6, 10, 18, 0.72); pointer-events: auto; }
  .start .card { text-align: center; max-width: 560px; padding: 36px 48px;
    background: rgba(12, 20, 32, 0.85); border: 1px solid rgba(255,255,255,0.15); border-radius: 18px; }
  .start h1 { margin: 0; font-size: 54px; letter-spacing: 0.35em; color: #ffb347; }
  .start h2 { margin: 4px 0 18px; font-weight: 400; font-size: 20px; opacity: 0.9; }
  .start p { font-size: 15px; line-height: 1.7; opacity: 0.9; }
  .start .orange-t { color: #ffb347; font-weight: 600; }
  .start .keys { margin: 16px 0; font-size: 14px; opacity: 0.85; line-height: 1.9;
    background: rgba(255,255,255,0.06); border-radius: 10px; padding: 8px; }
  .start .press { margin-top: 20px; font-size: 17px; color: #7fd0ff; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
</style>
<script>
  window.addEventListener('error', e => {
    const d = document.getElementById('err');
    if (!d) return;
    d.style.display = 'block';
    d.textContent = 'שגיאה: ' + (e.message || e.type) + '\n' + (e.filename || '') + ':' + (e.lineno || '');
  });
</script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="err"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
