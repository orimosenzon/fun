<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אדמאמא: מעפר לעפר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --soil:#6b4226; --soil-d:#4a2c18; --clay:#b8754a; --sand:#e2c48f; --straw:#d9b65c;
  --leaf:#5f7d3a; --leaf-d:#3e5626; --paper:#f3e6c8; --paper-d:#e3d0a6; --ink:#2b1d12;
  --sky1:#f6d9a8; --sky2:#9cc6d8; --bead1:#c0392b; --bead2:#2e86ab; --bead3:#e1a730; --bead4:#6a994e;
  --bg:#2a1a10;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Heebo",system-ui,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:1100px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 6px;color:var(--paper)}
header h1{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:clamp(26px,5vw,40px);margin:0;letter-spacing:.5px}
header h1 small{display:block;font-size:.42em;font-weight:400;opacity:.75;letter-spacing:0}
#beads{display:flex;align-items:center;gap:6px;font-size:14px}
#beadStr{display:flex;gap:2px;flex-wrap:wrap;max-width:240px;direction:ltr}
.bead{width:12px;height:12px;border-radius:50%;box-shadow:inset -2px -2px 0 rgba(0,0,0,.25),inset 2px 2px 0 rgba(255,255,255,.35);animation:pop .5s ease}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
main{width:100%;max-width:1100px;padding:0 16px 24px;display:grid;grid-template-columns:1fr;gap:14px}
#stageWrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#stage{display:block;width:100%;height:auto}
#yearBig{position:absolute;top:10px;right:16px;font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:clamp(34px,8vw,72px);color:rgba(255,255,255,.85);text-shadow:0 2px 12px rgba(0,0,0,.35);pointer-events:none;transition:opacity .4s}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%) translateY(30px);background:rgba(43,29,18,.88);color:var(--paper);padding:8px 16px;border-radius:30px;font-size:15px;opacity:0;transition:.4s;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* clipping */
#clip{background:var(--paper);background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.5),transparent 40%),radial-gradient(circle at 90% 90%,rgba(120,80,30,.15),transparent 50%);border-radius:4px;padding:18px 20px 16px;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.35);clip-path:polygon(0 1%,3% 0,20% .8%,45% 0,70% 1%,100% 0,99.4% 30%,100% 60%,99.2% 100%,60% 99.3%,30% 100%,0 99%,.6% 50%)}
#clip .meta{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:10px;font-size:13px;flex-wrap:wrap}
#clip .meta b{font-family:"Frank Ruhl Libre",serif;font-size:15px}
#clip h2{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:clamp(24px,4.5vw,36px);margin:4px 0 8px;line-height:1.1}
#clip .lead{font-size:16px;line-height:1.65;margin:0 0 10px}
#clip blockquote{font-family:"Frank Ruhl Libre",serif;font-size:19px;margin:10px 0;padding:6px 14px;border-right:5px solid var(--clay);background:rgba(184,117,74,.1)}
#clip blockquote cite{display:block;font-family:"Heebo";font-size:13px;font-style:normal;opacity:.7;margin-top:4px}
#task{margin-top:12px;border-top:1px dashed rgba(43,29,18,.4);padding-top:12px}
#task h3{margin:0 0 8px;font-size:16px;display:flex;gap:8px;align-items:center}
#task h3::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--bead3);box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
.opts{display:flex;flex-direction:column;gap:8px}
button{font-family:inherit;font-size:15px;cursor:pointer;border:2px solid var(--ink);background:var(--paper-d);color:var(--ink);border-radius:8px;padding:9px 14px;transition:transform .1s,background .2s}
button:hover{background:#fff3d6}
button:active{transform:scale(.97)}
button.good{background:#bfd8a0;border-color:var(--leaf-d)}
button.bad{background:#e8b0a0;animation:shake .35s}
button:disabled{opacity:.45;cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}
.nav .next{background:var(--ink);color:var(--paper);font-weight:600}
.nav .next:disabled{opacity:.3}
.nav .skip{border:none;background:none;text-decoration:underline;font-size:13px;opacity:.6;padding:4px}
.fb{min-height:22px;margin-top:8px;font-size:15px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}
.row label{min-width:62px;font-weight:600}
input[type=range]{flex:1;accent-color:var(--clay);min-width:140px}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk button.on{background:var(--leaf);color:#fff;border-color:var(--leaf-d)}
.meter{height:16px;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff8;flex:1;min-width:120px}
.meter i{display:block;height:100%;width:0;transition:width .4s;background:linear-gradient(90deg,var(--bead3),var(--clay))}
.scrap{font-size:42px;text-align:center;margin:6px 0;min-height:56px;animation:pop .4s}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* timeline */
#timeline{display:flex;gap:4px;justify-content:space-between;align-items:center;padding:4px 2px;direction:rtl;overflow-x:auto}
#timeline button{flex:1;min-width:44px;padding:6px 2px;font-size:12px;border:none;border-radius:6px;background:rgba(243,230,200,.12);color:var(--paper);opacity:.5}
#timeline button.seen{opacity:1;background:rgba(243,230,200,.22)}
#timeline button.cur{background:var(--clay);opacity:1;font-weight:700}
#timeline button:disabled{cursor:default}

/* svg */
.bld{opacity:0;transform:translateY(30px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,1.4,.4,1);transform-box:fill-box;transform-origin:50% 100%}
.bld.on{opacity:1;transform:none}
.bld.melt{transition:transform 1.6s ease-in,opacity 1.6s ease-in,filter 1.6s;transform:scaleY(.05) scaleX(1.3);opacity:0;filter:blur(2px)}
.clickable{cursor:pointer}
.clickable:hover{filter:brightness(1.15) drop-shadow(0 0 6px #fff8)}
#blades{transform-origin:760px 168px;transform-box:view-box}
.spin #blades{animation:rot var(--spd,2s) linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.flag{animation:wave 1.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 0}
@keyframes wave{to{transform:skewY(8deg)}}
.rocket{stroke:#ffdd99;stroke-width:2;stroke-linecap:round;stroke-dasharray:6 400;animation:fly 2.8s linear infinite}
@keyframes fly{from{stroke-dashoffset:0}to{stroke-dashoffset:-420}}
.flash{animation:flash 2.8s infinite}
@keyframes flash{0%,60%{opacity:0}63%{opacity:1}75%{opacity:0}}
#sky stop{transition:stop-color 1.4s}
#sunG{transition:transform 1.6s ease}
.mound{transition:transform 1.6s ease;transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0)}
.mound.on{transform:scaleY(1)}
.smoke{animation:smoke 3s ease-out infinite;opacity:0}
@keyframes smoke{0%{opacity:.6;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}

@media (min-width:900px){
  main{grid-template-columns:1.35fr 1fr;align-items:start}
  #stageWrap{position:sticky;top:12px}
  #timeline{grid-column:1/-1}
}
footer{color:var(--paper);opacity:.5;font-size:12px;padding:0 16px 20px;text-align:center;max-width:900px}
.endlist{font-size:14px;line-height:1.6;padding-right:18px}
</style>
</head>
<body>
<header>
  <h1>אדמאמא<small>חווה אקולוגית בניר משה, משנת 1999 עד 2018</small></h1>
  <div id="beads" title="חרוזים: המטבע המקומי של קהילת מחרוזת"><span>חרוזים:</span><span id="beadN">0</span><div id="beadStr"></div></div>
</header>

<main>
  <nav id="timeline" aria-label="פרקים"></nav>

  <div id="stageWrap">
    <svg id="stage" viewBox="0 0 1000 520" role="img" aria-label="החווה">

        <g fill="#2e86ab"><path class="flag" d="M180 245 l14 0 l-7 16z"/><path class="flag" d="M420 233 l14 0 l-7 16z"/><path class="flag" d="M660 238 l14 0 l-7 16z"/><path class="flag" d="M860 247 l14 0 l-7 16z"/></g>
        <g fill="#e1a730"><path class="flag" d="M240 242 l14 0 l-7 16z"/><path class="flag" d="M360 236 l14 0 l-7 16z"/><path class="flag" d="M500 232 l14 0 l-7 16z"/><path class="flag" d="M820 245 l14 0 l-7 16z"/></g>
      </g>

      <!-- villa (always) -->
      <g id="b_villa" class="bld on">

        <rect x="75" y="280" width="30" height="30" fill="#6e8ca0" stroke="#fff" stroke-width="3"/>

      <g id="b_tent" class="bld">

      <g id="b_mud1" class="bld">
        <path d="M530 340 V285 Q575 255 620 285 V340Z" fill="url(#mudTex)" stroke="#7a4a2a"/>

        <rect x="582" y="305" width="18" height="35" rx="9" fill="#2e86ab"/>
        <path d="M522 288 Q575 245 628 288" stroke="#d9b65c" stroke-width="6" fill="none"/>
      </g>
      <!-- tire house (Noa & Asaf) -->
      <g id="b_tire" class="bld">
        <g fill="#2b2b2b"><ellipse cx="655" cy="334" rx="16" ry="6"/><ellipse cx="687" cy="334" rx="16" ry="6"/><ellipse cx="719" cy="334" rx="16" ry="6"/></g>
        <path d="M640 330 V292 Q680 272 735 292 V330Z" fill="#c98b5e" stroke="#7a4a2a"/>
        <rect x="676" y="300" width="20" height="30" fill="#5a3a22"/>
        <path d="M632 294 L688 262 L742 294Z" fill="#d9b65c"/>

      <!-- windmill -->
      <g id="b_wind" class="bld">
        <path d="M752 340 L756 172 L764 172 L768 340Z" fill="#8a8a8a"/>
        <g id="blades">
          <rect x="756" y="96" width="8" height="72" rx="3" fill="#ececec" stroke="#888"/>
          <rect x="756" y="96" width="8" height="72" rx="3" fill="#ececec" stroke="#888" transform="rotate(120 760 168)"/>
          <rect x="756" y="96" width="8" height="72" rx="3" fill="#ececec" stroke="#888" transform="rotate(240 760 168)"/>
          <circle cx="760" cy="168" r="7" fill="#555"/>
        </g>
      </g>
      <!-- compost toilet with palm roof -->
      <g id="b_toilet" class="bld">
        <rect x="842" y="282" width="48" height="58" fill="url(#mudTex)" stroke="#7a4a2a"/>
        <rect x="858" y="300" width="16" height="40" fill="#e1a730"/>
        <path d="M826 288 L866 255 L906 288Z" fill="#9b8a4a"/>
        <path d="M826 288 l6 14 M840 288 l4 16 M856 288 l3 15 M876 288 l-2 16 M892 288 l-4 14 M904 288 l-6 12" stroke="#7d6e36" stroke-width="2"/>
      </g>
      <!-- chicken coop -->
      <g id="b_coop" class="bld">

        <g fill="#fff"><ellipse cx="935" cy="352" rx="7" ry="5"/><ellipse cx="962" cy="358" rx="7" ry="5"/></g>
        <g fill="#c0392b"><circle cx="940" cy="347" r="2"/><circle cx="967" cy="353" r="2"/></g>
      </g>
      <!-- garden beds -->

        <g fill="#6a994e"><circle cx="70" cy="463" r="7"/><circle cx="95" cy="458" r="8"/><circle cx="122" cy="462" r="6"/><circle cx="150" cy="458" r="8"/><circle cx="176" cy="465" r="6"/></g>
        <g fill="#c0392b"><circle cx="95" cy="456" r="2.5"/><circle cx="150" cy="455" r="2.5"/></g>

        <g fill="#e1a730"><path d="M240 474 v-18 M262 470 v-22 M284 470 v-20 M306 471 v-22 M330 474 v-18" stroke="#d9b65c" stroke-width="3"/></g>

        <path d="M400 470 Q440 420 480 470" fill="none" stroke="#a89068" stroke-dasharray="5 4"/>

        <circle class="smoke" style="animation-delay:1.5s" cx="446" cy="428" r="5" fill="#ddd"/>

        <path d="M505 480 V420 M595 480 V420 M505 420 H595" stroke="#5a3a22" stroke-width="5"/>

        <rect x="512" y="440" width="76" height="34" fill="#f0e2c0" opacity=".55"/>

        <path d="M615 482 Q615 395 680 395 Q745 395 745 482Z" fill="url(#mudTex)" stroke="#7a4a2a"/>
        <path d="M668 395 q12 -16 24 0" fill="#9a6240"/>
        <circle cx="648" cy="440" r="12" fill="#7fc4c9" stroke="#e1a730" stroke-width="3"/>

      <!-- seedlings for the epilogue -->

        <path d="M680 466 v-14 M680 456 q-8 -6 -12 -2 M680 454 q8 -6 12 -2"/>
        <path d="M930 482 v-14 M930 472 q-8 -6 -12 -2 M930 470 q8 -6 12 -2"/>
        <path d="M550 470 v-14 M550 460 q-8 -6 -12 -2 M550 458 q8 -6 12 -2"/>

    </svg>
    <div id="yearBig">1999</div>
    <div id="toast"></div>
  </div>

  <article id="clip" aria-live="polite"></article>
</main>

<footer>נבנה מתוך ארכיון גזירי עיתונות (הארץ, זמן הדרום, ציופציק, ספירלה, דה מרקר, מעריב, ישראל היום, גלובס) ומקורות ברשת. הציטוטים מובאים כפי שהופיעו בעיתונות.</footer>

<script>
const BEAD_COLORS=["#c0392b","#2e86ab","#e1a730","#6a994e","#8e44ad","#d35400"];

const $=s=>document.querySelector(s);
const state={i:0,max:0,solved:new Set(),beads:0,melted:new Set()};

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove("on"),2600)}
function addBeads(n){for(let k=0;k<n;k++){const b=document.createElement("span");b.className="bead";b.style.background=BEAD_COLORS[(state.beads)%BEAD_COLORS.length];b.style.animationDelay=(k*.12)+"s";$("#beadStr").appendChild(b);state.beads++}$("#beadN").textContent=state.beads}

function setSky(name){const s=SKY[name];$("#s1").setAttribute("stop-color",s[0]);$("#s2").setAttribute("stop-color",s[1]);
  $("#sunG").style.transform=`translateY(${s[2]-120}px)`;$("#stars").setAttribute("opacity",s[3]);$("#war").setAttribute("opacity",s[4])}

function renderScene(){
  const on=new Set();
  for(let k=0;k<=state.i;k++){CH[k].show.forEach(id=>on.add(id))}
  // flags only during the festival
  if(state.i>0)on.delete("b_flags");
  // the melt only exists in the last chapter; going back in time rebuilds the farm
  const last=state.i===CH.length-1,melted=id=>last&&state.melted.has(id);
  ALL_BLD.forEach(id=>{const el=document.getElementById(id);if(!el)return;
    if(melted(id)){el.classList.add("melt");return}
    el.classList.remove("melt");el.classList.toggle("on",on.has(id)||(id==="b_sprouts"&&last&&state.solved.has(state.i)))});
  document.querySelectorAll(".mound").forEach(m=>m.classList.toggle("on",melted(m.dataset.for)));
  setSky(CH[state.i].sky);
  $("#yearBig").textContent=CH[state.i].year;
}

function renderTimeline(){
  const t=$("#timeline");t.innerHTML="";
  CH.forEach((c,k)=>{const b=document.createElement("button");b.textContent=c.year;b.title=c.title;
    if(k<=state.max)b.classList.add("seen");if(k===state.i)b.classList.add("cur");
    b.disabled=k>state.max;b.onclick=()=>go(k);t.appendChild(b)});
  if(state.i===CH.length){}
}

function go(k){cleanupTask();state.i=k;renderScene();renderTimeline();renderClip()}

function renderClip(){
  const c=CH[state.i],clip=$("#clip");
  clip.innerHTML=`<div class="meta"><b>${c.paper}</b><span>${c.date}</span></div>
  <h2>${c.title}</h2><p class="lead">${c.lead}</p>
  <blockquote>${c.quote[0]}<cite>${c.quote[1]}</cite></blockquote>
  <section id="task"><h3>${c.task.q}</h3><div id="taskBody"></div><div class="fb" id="fb"></div></section>
  <div class="nav"><button class="skip" id="skip">דלגו</button><button class="next" id="next">${state.i===CH.length-1?"לסיכום":"הלאה"} ←</button></div>`;
  const done=state.solved.has(state.i);
  $("#next").disabled=!done;$("#skip").style.visibility=done?"hidden":"visible";
  $("#next").onclick=()=>{if(state.i===CH.length-1)return renderEnd();state.max=Math.max(state.max,state.i+1);go(state.i+1)};
  $("#skip").onclick=()=>{solve(0,"דילגתם. אפשר לחזור לכאן מציר הזמן.")};
  TASKS[c.task.type](c.task,$("#taskBody"),done);
  if(done)$("#fb").textContent=c.task.win;
}

function solve(beads,msg){
  if(!state.solved.has(state.i)){state.solved.add(state.i);if(beads)addBeads(beads)}
  $("#fb").textContent=msg||CH[state.i].task.win;
  $("#next").disabled=false;$("#skip").style.visibility="hidden";
  if(beads)toast(`+${beads} חרוזים`);
}

let cleanup=[];
function cleanupTask(){cleanup.forEach(f=>f());cleanup=[]}

const TASKS={
 choice(t,box,done){
  const d=document.createElement("div");d.className="opts";
  t.opts.forEach((o,k)=>{const b=document.createElement("button");b.textContent=o;
    if(done&&k===t.ok)b.classList.add("good");
    b.onclick=()=>{if(state.solved.has(state.i))return;
      if(k===t.ok){b.classList.add("good");solve(3)}else{b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad");$("#fb").textContent="לא בדיוק. נסו שוב."}};
    d.appendChild(b)});box.appendChild(d)},

  box.innerHTML=`<div class="row"><label>חרסית</label><input type="range" id="mc" min="0" max="10" value="5"><span id="mcv"></span></div>
  <div class="row"><label>חול</label><input type="range" id="ms" min="0" max="10" value="5"><span id="msv"></span></div>
  <div class="row"><label>קש</label><input type="range" id="mt" min="0" max="10" value="0"><span id="mtv"></span></div>
  <div class="row"><svg viewBox="0 0 160 70" width="160" height="70" id="brick"><rect x="10" y="15" width="140" height="45" rx="4" id="brk"/><g id="cracks" stroke="#3b2414" stroke-width="2" fill="none"></g><g id="strawL" stroke="#d9b65c" stroke-width="1.5"></g></svg>
  <button id="mtest">בדקו את הלבנה</button></div>`;
  const upd=()=>{const c=+$("#mc").value,s=+$("#ms").value,st=+$("#mt").value,tot=c+s||1;
    $("#mcv").textContent=Math.round(c/tot*100)+"%";$("#msv").textContent=Math.round(s/tot*100)+"%";$("#mtv").textContent=st?"✓":"";
    const r=c/tot;$("#brk").setAttribute("fill",`hsl(${25+ (1-r)*15},${45+r*10}%,${55-r*18}%)`);
    let l="";for(let k=0;k<st*2;k++){const x=15+((k*37)%130),y=20+((k*23)%35);l+=`<path d="M${x} ${y} l8 ${k%2?3:-3}"/>`}$("#strawL").innerHTML=l};
  ["#mc","#ms","#mt"].forEach(s=>$(s).oninput=()=>{$("#cracks").innerHTML="";upd()});upd();
  if(done){$("#mc").value=7;$("#ms").value=3;$("#mt").value=6;upd()}
  $("#mtest").onclick=()=>{const c=+$("#mc").value,s=+$("#ms").value,st=+$("#mt").value,tot=c+s||1,r=c/tot;
    if(st<3){$("#cracks").innerHTML='<path d="M40 15 l10 20 l-8 25 M110 15 l-6 18 l12 27"/>';$("#fb").textContent="בלי מספיק קש הלבנה נסדקת. הקש הוא השלד."}
    else if(r>.8){$("#cracks").innerHTML='<path d="M30 15 l8 45 M80 15 l-4 45 M125 15 l6 45"/>';$("#fb").textContent="יותר מדי חרסית: הלבנה מתכווצת ונסדקת כשהיא מתייבשת."}
    else if(r<.55){$("#cracks").innerHTML='<path d="M20 50 h120" stroke-dasharray="4 6"/>';$("#fb").textContent="יותר מדי חול: הלבנה מתפוררת. צריך יותר חרסית שתדביק."}
    else{$("#cracks").innerHTML="";solve(3)}}},

 wind(t,box,done){
  box.innerHTML=`<div class="row"><span>חשמל:</span><div class="meter"><i id="pw"></i></div><b id="pwv">0%</b></div><div class="row"><button id="spinB">סובבו את הטחנה</button></div>`;
  let p=done?15:0,spd=0;const g=$("#stage");g.classList.add("spin");g.style.setProperty("--spd","0s");
  const show=()=>{$("#pw").style.width=(p/15*100*.15)+"%";$("#pwv").textContent=Math.round(p)+"%"};show();
  const kick=()=>{if(state.solved.has(state.i)&&p>=15)return;spd=Math.min(spd+1,10);g.style.setProperty("--spd",(2.4-spd*.2)+"s");
    p=Math.min(15,p+1.6);show();if(p>=15)solve(3)};
  $("#spinB").onclick=kick;const bl=$("#b_wind");bl.classList.add("clickable");bl.addEventListener("click",kick);
  if(done)g.style.setProperty("--spd","1.2s");
  cleanup.push(()=>{bl.removeEventListener("click",kick);bl.classList.remove("clickable");g.classList.remove("spin")})},

 toilet(t,box,done){
  let n=done?3:0;let agorot=n*10;
  box.innerHTML=`<div class="row"><button id="tB">🚽 להיכנס לשירותים</button><span>בקערה שלכם: <b id="ag">${agorot}</b> אגורות</span></div><div id="tq"></div>`;
  const ask=()=>{const d=document.createElement("div");d.className="opts";d.style.marginTop="8px";
    t.opts.forEach((o,k)=>{const b=document.createElement("button");b.textContent=o;if(done&&k===t.ok)b.classList.add("good");
      b.onclick=()=>{if(state.solved.has(state.i))return;if(k===t.ok){b.classList.add("good");solve(3)}else{b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad")}};d.appendChild(b)});
    $("#tq").innerHTML="";$("#tq").appendChild(d)};
  const go1=()=>{if(n>=3)return;n++;agorot+=10;$("#ag").textContent=agorot;toast("תרמתם לאדמה. קיבלתם 10 אגורות 🪙");if(n===3)ask()};
  $("#tB").onclick=go1;const el=$("#b_toilet");el.classList.add("clickable");el.addEventListener("click",go1);
  if(n>=3)ask();
  cleanup.push(()=>{el.removeEventListener("click",go1);el.classList.remove("clickable")})},

 reasons(t,box,done){
  const sel=new Set(done?[0,1,2]:[]);
  box.innerHTML=`<div class="chk" id="rc"></div><div class="row" style="margin-top:10px"><button id="drive">🚗 לנסוע</button><span id="rcount"></span></div>`;
  t.items.forEach((s,k)=>{const b=document.createElement("button");b.textContent=s;if(sel.has(k))b.classList.add("on");
    b.onclick=()=>{sel.has(k)?sel.delete(k):sel.add(k);b.classList.toggle("on");cnt()};$("#rc").appendChild(b)});
  const cnt=()=>$("#rcount").textContent=`${sel.size} סיבות`;cnt();
  $("#drive").onclick=()=>{if(state.solved.has(state.i))return;
    const bad=[...sel].filter(k=>t.bad.includes(k));
    if(bad.length){$("#fb").textContent=`"${t.items[bad[0]]}"? זו לא סיבה שמשפחת רותם הייתה מקבלת.`;return}
    if(sel.size<3){$("#fb").textContent="פחות משלוש סיבות. הרכב נשאר בחניה, ואפשר ללכת ברגל או לחכות.";return}
    solve(3)}},

 sukkah(t,box,done){
  const total=6;let n=done?total:0;
  box.innerHTML=`<div class="row"><button id="pB">🎬 להניח כרזה</button><span id="pn"></span></div>`;
  const draw=()=>{let h="";for(let k=0;k<n;k++){h+=`<rect x="${500+k*16}" y="${408+(k%2)*4}" width="22" height="14" fill="url(#posterTex)" transform="rotate(${(k%3-1)*6} ${511+k*16} 415)"/>`}
    $("#posters").innerHTML=h;$("#pn").textContent=`${n}/${total}`};draw();
  $("#pB").onclick=()=>{if(n>=total)return;n++;draw();if(n===total)solve(3)};
  cleanup.push(()=>{if(!state.solved.has(CH.indexOf(CH.find(c=>c.task.type==="sukkah"))))$("#posters").innerHTML=""})},

 fear(t,box,done){
  const on=new Set(done?[]:[0,1,2,3]);
  box.innerHTML=`<div class="chk" id="fc"></div><div class="row" style="margin-top:10px"><span>פחד:</span><div class="meter"><i id="fm" style="background:linear-gradient(90deg,#e1a730,#c0392b)"></i></div></div>`;
  t.items.forEach((s,k)=>{const b=document.createElement("button");b.textContent=(on.has(k)?"🔊 ":"🔇 ")+s;if(on.has(k))b.classList.add("on");
    b.onclick=()=>{if(on.has(k)){on.delete(k);b.classList.remove("on");b.textContent="🔇 "+s}else{on.add(k);b.classList.add("on");b.textContent="🔊 "+s}upd()};$("#fc").appendChild(b)});
  const upd=()=>{$("#fm").style.width=(15+on.size*21)+"%";$("#war").setAttribute("opacity",on.size?1:.35);if(!on.size)solve(3)};upd()},

 sort(t,box,done){
  let k=done?t.items.length:0,miss=0;
  box.innerHTML=`<div class="scrap" id="sc"></div><div class="two"><button id="sa">🐕🐈 כלבים וחתולים</button><button id="sb">🐑🐐 כבשים ועיזים</button></div><div class="row"><span id="sp"></span></div>`;
  const show=()=>{$("#sc").textContent=k<t.items.length?t.items[k][0]:"🪣🪣";$("#sc").style.animation="none";void $("#sc").offsetWidth;$("#sc").style.animation="";$("#sp").textContent=`${Math.min(k,t.items.length)}/${t.items.length}`};show();
  const pick=w=>{if(k>=t.items.length)return;if(t.items[k][1]===w){k++;show();if(k===t.items.length)solve(miss?2:3)}else{miss++;$("#fb").textContent=t.items[k][1]==="a"?"זה מן החי: לכלבים ולחתולים.":"זה מן הצומח: לכבשים ולעיזים."}};
  $("#sa").onclick=()=>pick("a");$("#sb").onclick=()=>pick("b")},

 melt(t,box,done){
  box.innerHTML=`<div class="row"><span>חזרו לאדמה: <b id="mn"></b></span></div>`;
  const live=MUD.filter(id=>document.getElementById(id).classList.contains("on")||state.melted.has(id));
  const cnt=()=>{$("#mn").textContent=`${live.filter(id=>state.melted.has(id)).length}/${live.length}`};cnt();
  const hs=[];
  live.forEach(id=>{const el=document.getElementById(id);if(state.melted.has(id))return;el.classList.add("clickable");
    const h=()=>{if(state.melted.has(id))return;state.melted.add(id);el.classList.remove("clickable");el.classList.add("melt");
      document.querySelector(`.mound[data-for="${id}"]`).classList.add("on");cnt();
      if(live.every(x=>state.melted.has(x))){$("#b_sprouts").classList.add("on");solve(5)}};
    el.addEventListener("click",h);hs.push([el,h])});
  cleanup.push(()=>hs.forEach(([el,h])=>{el.removeEventListener("click",h);el.classList.remove("clickable")}))},
};

function renderEnd(){
  cleanupTask();setSky("dawn");$("#yearBig").textContent="";
  $("#b_sprouts").classList.add("on");
  document.querySelectorAll("#timeline button").forEach(b=>b.classList.remove("cur"));
  $("#clip").innerHTML=`<div class="meta"><b>אחרית דבר</b><span>${state.beads} חרוזים במחרוזת</span></div>
  <h2>מה נשאר באדמה</h2>
  <p class="lead">אדמאמא הייתה מהראשונות בארץ שלימדו פרמקלצ'ר ובנייה מאדמה. במשך כמעט עשרים שנה עברו בה מאות מתנדבים ואלפי מבקרים: חיילים משוחררים ומהנדסי הייטק, אנשי מחאה, גננות מיפו, דתיים, קיבוצניקים ובדואים. היא הולידה מפגשי החלפת זרעים, פסטיבלים, יערות מאכל וגינות קהילתיות. החווה עצמה חזרה לשדה. הרעיון, כמו קומפוסט, ממשיך להזין.</p>
  <blockquote>"היה בעצמך השינוי שאתה רוצה לראות." זאת אדמאמא.<cite>גילה, ספירלה, ~2004</cite></blockquote>
  <h3>הארכיון</h3>
  <ul class="endlist">
   <li>הארץ, מוסף שישי, 31.10.2003: "דון קישוט מניר משה" (מיכל גרינברג)</li>
   <li>זמן הדרום, 2.4.2004: "הצד השני" (ליעד בראל)</li>
   <li>ציופציק, מאי 2004: "אמא אדמה"</li>
   <li>ספירלה, ~2004: "אמא אדמה" (יעל אלוני)</li>
   <li>דה מרקר, 29.5.2009: "מותג זה מילת גנאי" (רונית הראל)</li>
   <li>מעריב, 22.9.2010: "החיים שלך בסוכה" (אייל לוי)</li>
   <li>ישראל היום, 23.11.2012: "אמא אדמה" (נצחיה יעקב)</li>
   <li>גלובס, מאי 2018: "איך מפרקים בית מבוץ?" (צלה קוטלר)</li>
  </ul>
  <div class="nav"><span></span><button class="next" id="again">מההתחלה ↻</button></div>`;
  $("#again").onclick=()=>location.reload();
}

renderTimeline();go(0);
</script>
