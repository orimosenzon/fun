<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מפת התמונות</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1f2328; --muted:#636c76; --accent:#1a73e8; --card:#fff; --line:#d8dee4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --accent:#4c8df6; --card:#161b22; --line:#30363d; }
  }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:17px/1.6 system-ui, "Segoe UI", Arial, sans-serif; padding:16px; box-sizing:border-box; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 24px;
          max-width:420px; width:100%; text-align:center; }
  h1 { font-size:1.3em; margin:0 0 8px; }
  p { margin:6px 0; color:var(--muted); }
  .spin { width:28px; height:28px; margin:14px auto; border:3px solid var(--line); border-top-color:var(--accent);
          border-radius:50%; animation:s 0.9s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  button { margin-top:14px; font:inherit; padding:8px 18px; border-radius:8px; border:1px solid var(--line);
           background:var(--card); color:var(--fg); cursor:pointer; }
</style>
</head>
<body>
<div class="card">
  <h1>🗺️ מפת התמונות</h1>
  <div id="state"><div class="spin"></div><p>מתחבר…</p></div>
</div>
<script>
// The map runs on Ori's computer and is reached through a Cloudflare tunnel
// whose address changes on every start. go_live.py writes the current address
// to a gist; this page reads it, checks the map answers, and forwards.
const GIST = "https://api.github.com/gists/635f409c8f70b93c2b0e37e32eacf356";
const state = document.getElementById("state");

function offline(since) {
  const when = since ? new Date(since).toLocaleString("he-IL", { dateStyle: "short", timeStyle: "short" }) : "";
  state.innerHTML =
    "<p>המפה פועלת מהמחשב של אורי, והוא כבוי או לא מחובר כרגע.</p>" +
    (when ? `<p style="font-size:0.85em">הפעם האחרונה שהמפה עלתה: ${when}</p>` : "") +
    '<button onclick="location.reload()">לנסות שוב</button>';
}

async function go() {
  let info;
  try {
    const r = await fetch(GIST, { cache: "no-store" });
    info = JSON.parse((await r.json()).files["live.json"].content);
  } catch (e) { return offline(); }
  if (!info.url) return offline(info.since);
  try {
    const ctl = new AbortController();
    setTimeout(() => ctl.abort(), 8000);
    const r = await fetch(info.url + "/ping", { cache: "no-store", signal: ctl.signal });
    if (r.ok) return location.replace(info.url + "/");
  } catch (e) {}
  offline(info.since);
}
go();
</script>
</body>
</html>
