    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Heebo', sans-serif;
            overflow: hidden;
        }
        #map { height: 100%; width: 100%; }

        /* Controls panel */
        #controls-wrapper {
            transition: transform 0.3s ease-in-out;
            transform: translateY(100%);
        }
        #controls-wrapper.is-open {
            transform: translateY(0);
        }

        /* Custom checkboxes */
        .empire-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 4px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .empire-item:hover { background: #f3f4f6; }

        .custom-checkbox {
            appearance: none; -webkit-appearance: none;
            height: 22px; width: 22px; min-width: 22px;
            border: 2px solid #ccc;
            border-radius: 5px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            outline: none; transition: all 0.2s ease;
        }
        .custom-checkbox:after {
            content: '✔'; font-size: 14px; color: white; display: none;
        }
        .custom-checkbox:checked {
            background-color: var(--empire-color, #666);
            border-color: var(--empire-color, #666);
        }
        .custom-checkbox:checked:after { display: block; }

        .empire-info {
            display: flex;
            flex-direction: column;
            line-height: 1.3;
        }
        .empire-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #1f2937;
        }
        .empire-dates {
            font-size: 0.75rem;
            color: #6b7280;
        }

        /* Map type toggle */
        .map-type-button {
            background-color: white; color: #333; padding: 8px 12px;
            border: 1px solid #ccc; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease; font-size: 0.85rem;
        }
        .map-type-button.active {
            background-color: #4285F4; color: white; border-color: #4285F4;
        }
        .map-type-button:first-of-type { border-radius: 0 6px 6px 0; }
        .map-type-button:last-of-type { border-radius: 6px 0 0 6px; }

        /* AI Panel */
        #ai-panel {
            transition: transform 0.3s ease-in-out;
            transform: translateX(105%);
        }
        #ai-panel.is-visible {
            transform: translateX(0);
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px; height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Map markers */
        .custom-marker {
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 5px rgba(0,0,0,0.4);
            transition: transform 0.1s ease-in-out;
            cursor: pointer;
        }
        .custom-marker:hover { transform: scale(1.2); }
        .regular-marker { width: 14px; height: 14px; }
        .capital-marker { width: 22px; height: 22px; }

        /* AI content formatting */
        #ai-panel-content { line-height: 1.7; font-size: 0.92rem; }
        #ai-panel-content strong { color: #1f2937; }

        /* Scrollbar styling */
        #controls-container::-webkit-scrollbar,
        #ai-panel-content::-webkit-scrollbar {
            width: 6px;
        }
        #controls-container::-webkit-scrollbar-thumb,
        #ai-panel-content::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        /* Mobile toggle button pulse */
        @keyframes pulse {
            0%, 100% { box-shadow: 0 4px 14px rgba(59,130,246,0.4); }
            50% { box-shadow: 0 4px 20px rgba(59,130,246,0.7); }
        }
        #toggle-controls-btn { animation: pulse 2s infinite; }
        #toggle-controls-btn.has-selection { animation: none; }
    </style>
</head>

        async function initMap() {
            const { Map } = await google.maps.importLibrary("maps");
            await google.maps.importLibrary("marker");

            map = new Map(document.getElementById("map"), {
                center: { lat: 30, lng: 40 },
                zoom: 3,
                mapTypeId: 'terrain',
                disableDefaultUI: true,
                zoomControl: true,
                zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_TOP },
                mapId: 'EMPIRES_MAP_V2'
            });

            infoWindow = new google.maps.InfoWindow();

            // Build empire checkboxes
            const container = document.getElementById('empire-checkboxes');
            Object.keys(empiresData).forEach(key => {
                const data = empiresData[key];
                const div = document.createElement('div');
                div.className = 'empire-item';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = key;
                checkbox.value = key;
                checkbox.className = 'custom-checkbox';
                checkbox.style.borderColor = data.color;
                checkbox.style.setProperty('--empire-color', data.color);

                const info = document.createElement('div');
                info.className = 'empire-info';

                const nameEl = document.createElement('span');
                nameEl.className = 'empire-name';
                nameEl.textContent = data.name;

                const datesEl = document.createElement('span');
                datesEl.className = 'empire-dates';
                datesEl.textContent = data.period + ' · ' + data.area;

                info.appendChild(nameEl);
                info.appendChild(datesEl);

                const label = document.createElement('label');
                label.htmlFor = key;
                label.className = 'empire-item';
                label.style.margin = '0';
                label.style.padding = '0';
                label.style.gap = '10px';
                label.appendChild(checkbox);
                label.appendChild(info);

                div.innerHTML = '';
                div.appendChild(label);
                container.appendChild(div);

                checkbox.addEventListener('change', (event) => {
                    handleEmpireSelection(event.target.value, event.target.checked);
                });
            });

            // Map type toggle
            const mapBtn = document.getElementById('map-btn');
            const satelliteBtn = document.getElementById('satellite-btn');
            mapBtn.addEventListener('click', () => {
                map.setMapTypeId('terrain');
                mapBtn.classList.add('active');
                satelliteBtn.classList.remove('active');
            });
            satelliteBtn.addEventListener('click', () => {
                map.setMapTypeId('satellite');
                satelliteBtn.classList.add('active');
                mapBtn.classList.remove('active');
            });

            // Mobile controls
            const toggleBtn = document.getElementById('toggle-controls-btn');
            const controlsWrapper = document.getElementById('controls-wrapper');
            toggleBtn.addEventListener('click', () => {
                controlsWrapper.classList.toggle('is-open');
            });

            // AI Panel controls
            const aiPanel = document.getElementById('ai-panel');
            const openAiBtn = document.getElementById('open-ai-btn');
            const closeAiBtn = document.getElementById('close-ai-btn');

            closeAiBtn.addEventListener('click', () => {
                aiPanel.classList.remove('is-visible');
                if (selectedEmpires.size > 0) {
                    openAiBtn.classList.remove('hidden');
                }
            });
            openAiBtn.addEventListener('click', () => {
                aiPanel.classList.add('is-visible');
                openAiBtn.classList.add('hidden');
            });

            map.addListener('click', () => {
                controlsWrapper.classList.remove('is-open');
            });
        }

        function handleEmpireSelection(empireKey, isChecked) {
            toggleEmpireOnMap(empireKey, isChecked);
            if (isChecked) { selectedEmpires.add(empireKey); } else { selectedEmpires.delete(empireKey); }
            updateAiPanel();

            // Update mobile button style
            const toggleBtn = document.getElementById('toggle-controls-btn');
            if (selectedEmpires.size > 0) {
                toggleBtn.classList.add('has-selection');
            } else {
                toggleBtn.classList.remove('has-selection');
            }
        }

        async function toggleEmpireOnMap(empireKey, isVisible) {
            const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

            if (isVisible) {
                const data = empiresData[empireKey];
                activeElements[empireKey] = { polygons: [], markers: [] };

                data.polygons.forEach(path => {
                    const polygon = new google.maps.Polygon({
                        paths: path,
                        strokeColor: data.color,
                        strokeOpacity: 0.9,
                        strokeWeight: 2,
                        fillColor: data.color,
                        fillOpacity: 0.25,
                        map: map
                    });
                    activeElements[empireKey].polygons.push(polygon);
                });

                data.cities.forEach(city => {
                    const markerEl = document.createElement('div');
                    markerEl.className = city.isCapital ? 'custom-marker capital-marker' : 'custom-marker regular-marker';
                    markerEl.style.backgroundColor = data.color;
                    const marker = new AdvancedMarkerElement({
                        position: { lat: city.lat, lng: city.lng },
                        map: map,
                        title: city.name,
                        content: markerEl
                    });
                    marker.addListener('click', () => {
                        infoWindow.setContent(`<div style="font-family:Heebo,sans-serif;direction:rtl;padding:4px">
                            <strong style="color:${data.color}">${city.name}</strong><br>
                            <span style="font-size:0.85em;color:#666">${data.name}</span>
                        </div>`);
                        infoWindow.open({ anchor: marker, map });
                    });
                    activeElements[empireKey].markers.push(marker);
                });
            } else {
                if (activeElements[empireKey]) {
                    activeElements[empireKey].polygons.forEach(p => p.setMap(null));
                    activeElements[empireKey].markers.forEach(m => { m.map = null; });
                    delete activeElements[empireKey];
                }
            }
        }

        function updateAiPanel() {
            const aiPanel = document.getElementById('ai-panel');
            const openAiBtn = document.getElementById('open-ai-btn');
            const aiTitle = document.getElementById('ai-panel-title');
            const aiContent = document.getElementById('ai-panel-content');
            const aiButtons = document.getElementById('ai-buttons');
            aiButtons.innerHTML = '';

            if (selectedEmpires.size === 0) {
                aiPanel.classList.remove('is-visible');
                openAiBtn.classList.add('hidden');
                aiContent.innerHTML = 'בחר אימפריה כדי ללמוד עליה.';
                return;
            }

            if (!aiPanel.classList.contains('is-visible')) {
                openAiBtn.classList.remove('hidden');
            } else {
                openAiBtn.classList.add('hidden');
            }
            aiContent.innerHTML = 'בחר פעולה מלמטה כדי לקבל מידע.';

            const btnClass = 'font-bold py-2.5 px-4 rounded-lg transition-colors text-white text-sm';

            if (selectedEmpires.size === 1) {
                const empireKey = selectedEmpires.values().next().value;
                const data = empiresData[empireKey];

                // Show basic info immediately
                aiContent.innerHTML = `

                const d = empiresData[k];
                return `${d.name} (${d.period}, שטח: ${d.area})`;
            }).join(', ');
            await generateAiContent(`דרג את האימפריות הבאות לפי עוצמתן הכוללת: ${details}. השתמש בקריטריונים: שטח, משך קיום, כוח צבאי, הישגים תרבותיים, והשפעה על ההיסטוריה. הצג דירוג מ-1 ומטה עם הסבר קצר לכל מקום. כתוב בעברית.`);
        }

        async function generateAiContent(prompt) {
            const loader = document.getElementById('ai-loader');
            const contentArea = document.getElementById('ai-panel-content');
            const buttonsArea = document.getElementById('ai-buttons');
            const aiPanel = document.getElementById('ai-panel');

            // Ensure panel is visible
            aiPanel.classList.add('is-visible');
            document.getElementById('open-ai-btn').classList.add('hidden');

            if (!GEMINI_API_KEY || GEMINI_API_KEY === "YOUR_API_KEY") {
                contentArea.innerHTML = `<span class="text-red-500">מפתח ה-API של Gemini אינו מוגדר.</span>`;
                return;
            }

            loader.style.display = 'block';
            contentArea.innerHTML = '';
            buttonsArea.style.display = 'none';

            try {
                const payload = {
                    contents: [{ role: "user", parts: [{ text: prompt }] }]
                };
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const result = await response.json();

                if (result.candidates && result.candidates.length > 0) {
                    let text = result.candidates[0].content.parts[0].text;
                    // Convert markdown-like formatting to HTML
                    text = text
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\*(.*?)\*/g, '<em>$1</em>')
                        .replace(/^### (.*$)/gm, '<h4 style="font-size:1rem;font-weight:700;margin:12px 0 4px;color:#1f2937">$1</h4>')
                        .replace(/^## (.*$)/gm, '<h3 style="font-size:1.1rem;font-weight:700;margin:14px 0 6px;color:#1f2937">$1</h3>')
                        .replace(/\n/g, '<br>');
                    contentArea.innerHTML = text;
                } else {
                    throw new Error("No content from API.");
                }

            } catch (error) {
                console.error("Gemini API error:", error);
                contentArea.innerHTML = `<span class="text-red-500">אירעה שגיאה בקבלת המידע. נסה שוב.</span>`;
            } finally {
                loader.style.display = 'none';
                buttonsArea.style.display = 'flex';
            }
        }

        // Initialize
        (async () => {
            if (!GOOGLE_MAPS_API_KEY || GOOGLE_MAPS_API_KEY === "YOUR_API_KEY") {
                document.getElementById('map').innerHTML = `<div class='w-full h-full flex items-center justify-center bg-gray-200'><div class='text-center p-8 bg-white rounded-lg shadow-md'><h2 class='text-2xl font-bold text-red-600 mb-2'>שגיאת תצורה</h2><p class='text-gray-700'>אנא הגדר מפתח API של מפות גוגל.</p></div></div>`;
                return;
            }
            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=marker&callback=initMap&language=he`;
            script.async = true;
            script.defer = true;
            script.onerror = () => {
                document.getElementById('map').innerHTML = `<div class='w-full h-full flex items-center justify-center bg-gray-200'><div class='text-center p-8 bg-white rounded-lg shadow-md'><h2 class='text-2xl font-bold text-red-600 mb-2'>שגיאה בטעינת המפה</h2><p class='text-gray-700'>לא ניתן לטעון את המפה. בדוק את מפתח ה-API.</p></div></div>`;
            };
            document.head.appendChild(script);
        })();
    </script>
</body>
</html>
