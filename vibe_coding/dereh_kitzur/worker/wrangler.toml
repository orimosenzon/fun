name = "derech-kitzur"
main = "src/index.js"
compatibility_date = "2026-01-01"

# The repo this worker is allowed to write to. Nothing else is reachable: the
# path allowlist in src/index.js is checked before any request reaches GitHub.
[vars]
OWNER = "orimosenzon"
REPO = "derech-kitzur-data"
BRANCH = "main"

# The kill switch. Flip to "true" and redeploy, and the app becomes read-only
# for everyone without touching the token, the data or the app itself.
READ_ONLY = "false"

# Per-IP rate limiting, for writes and for password guesses alike. Without this
# binding the worker still runs, but both budgets become unlimited - and the
# password check is an oracle anyone can hammer. Created 28/8/2026 with
#   wrangler kv namespace create RATE
[[kv_namespaces]]
binding = "RATE"
id = "3e525627ec39406083b5dc59e12a9a2a"
