<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>דרך קיצור · שבילי פרדס חנה-כרכור</title>
<meta name="description" content="מדריך שבילי ההליכה וקיצורי הדרך של פרדס חנה-כרכור, עם תמונות וסטריט ויו לכל כניסה.">
<meta name="theme-color" content="#1b5e20">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🥾</text></svg>">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="map" role="application" aria-label="מפת השבילים"></div>

<button id="locate" class="fab" title="איפה אני" aria-label="איפה אני">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm8.94 3A9 9 0 0013 3.06V1h-2v2.06A9 9 0 003.06 11H1v2h2.06A9 9 0 0011 20.94V23h2v-2.06A9 9 0 0020.94 13H23v-2h-2.06zM12 19a7 7 0 110-14 7 7 0 010 14z"/></svg>
</button>

<!-- A globe rather than the usual stack of sheets: the stack now belongs to the
     layer manager below, and two near-identical buttons in one column is worse
     than an icon that is merely less conventional. -->
<button id="basemap" class="fab fab-2" title="החלף רקע מפה" aria-label="החלף רקע מפה">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm6.9 6h-2.9a15.6 15.6 0 00-1.4-3.6A8 8 0 0118.9 8zM12 4c.8 1.2 1.4 2.5 1.8 4h-3.6c.4-1.5 1-2.8 1.8-4zM4.3 14a7.9 7.9 0 010-4h3.3a16.5 16.5 0 000 4H4.3zm.8 2H8a15.6 15.6 0 001.4 3.6A8 8 0 015.1 16zm2.9-8H5.1a8 8 0 014.3-3.6A15.6 15.6 0 008 8zm4 12c-.8-1.2-1.4-2.5-1.8-4h3.6c-.4 1.5-1 2.8-1.8 4zm2.2-6H9.8a14.7 14.7 0 010-4h4.4a14.7 14.7 0 010 4zm.4 5.6A15.6 15.6 0 0016 16h2.9a8 8 0 01-4.3 3.6zm1.8-5.6a16.5 16.5 0 000-4h3.3a7.9 7.9 0 010 4h-3.3z"/></svg>
</button>

<button id="tilt" class="fab fab-3" title="מבט מהצד" aria-label="מבט מהצד">
  <span class="fab-3d">3D</span>
</button>

<button id="layers" class="fab fab-4" title="שכבות" aria-label="שכבות">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5zm0 7.9l6.2-3.4L21 9l-9 5-9-5 2.8-1.5L12 10.9zm0 4.2l6.2-3.4L21 13.2l-9 5-9-5 2.8-1.6 6.2 3.5z"/></svg>
</button>

<!-- Live readout while a trail is being recorded or drawn. -->
<div id="draft-bar" class="nav draft-bar" hidden role="status" aria-live="polite">
  <div class="draft-dot"></div>
  <div class="nav-txt">
    <strong id="draft-len">0 מ׳</strong>
    <span id="draft-state">מחפש מיקום…</span>
  </div>
  <button id="draft-undo" class="draft-btn" hidden>בטל נקודה</button>
  <button id="draft-pause" class="draft-btn" hidden>השהה</button>
  <button id="draft-done" class="draft-btn strong">סיום</button>
  <button id="draft-cancel" aria-label="ביטול">&times;</button>
</div>

<!-- Dropping a pardespedia place onto the map. The wiki has no coordinates, so
     for a good half of the places this bar is the only way one ever gets a
     position, and it wants to be as close to one tap as possible. -->
<div id="pin-bar" class="nav pin-bar" hidden role="status" aria-live="polite">
  <div class="pin-dot">📌</div>
  <div class="nav-txt">
    <strong id="pin-name">—</strong>
    <span id="pin-state">לחץ על המפה במקום המדויק</span>
  </div>
  <button id="pin-save" class="draft-btn strong" disabled>שמור כאן</button>
  <button id="pin-cancel" aria-label="ביטול">&times;</button>
</div>

<div id="nav" class="nav" hidden role="status" aria-live="polite">
  <div class="nav-arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l7 19-7-4-7 4z"/></svg></div>
  <div class="nav-txt">
    <strong id="nav-dist">—</strong>
    <span id="nav-state">מחפש מיקום…</span>
  </div>
  <button id="nav-stop" aria-label="עצור ניווט">&times;</button>
</div>

<section id="panel" class="panel" aria-label="רשימת השבילים">
  <div class="grip" id="grip" role="button" tabindex="0" aria-label="הרחב או כווץ את הרשימה"></div>

  <!-- List view -->
  <div id="list-view">
    <header class="panel-head">
      <div class="title-row">
        <h1>דרך קיצור</h1>
        <button id="editor-btn" class="editor-btn">מצב עורך</button>
      </div>
      <p id="stats" class="stats">טוען…</p>
      <div class="controls">
        <input id="search" type="search" placeholder="חיפוש שביל או רחוב…" autocomplete="off" aria-label="חיפוש">
        <div class="sorts" role="group" aria-label="מיון">
          <button class="sort on" data-sort="length">הארוכים</button>
          <button class="sort" data-sort="near">הקרובים</button>
          <button class="sort" data-sort="photos">עם תמונות</button>
          <button class="sort" data-sort="unplaced" id="sort-unplaced" hidden>לא ממוקמים</button>
          <button id="add" class="sort add">+ שביל חדש</button>
        </div>
      </div>
    </header>
    <ul id="list" class="list"></ul>
  </div>

  <!-- Detail view -->
  <div id="detail-view" hidden>
    <header class="detail-head">
      <button id="back" class="back" aria-label="חזרה לרשימה">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6L4 12l6 6 1.4-1.4L7.8 13H20v-2H7.8l3.6-3.6z"/></svg>
        <span>לרשימה</span>
      </button>
      <span class="tip">או פשוט לחץ על שביל אחר במפה</span>
    </header>
    <div id="detail" class="detail"></div>
  </div>
</section>

<div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="תמונה בגודל מלא">
  <button class="lb-close" aria-label="סגירה">&times;</button>
  <button class="lb-nav lb-prev" aria-label="הקודמת">&rsaquo;</button>
  <button class="lb-nav lb-next" aria-label="הבאה">&lsaquo;</button>
  <div class="lb-stage">
    <div class="lb-spin" id="lb-spin"></div>
    <img id="lb-img" alt="">
  </div>
  <p class="lb-cap"><span id="lb-cap-text"></span> <span id="lb-count" class="lb-count"></span></p>
</div>

<div id="layer-sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-label="שכבות">
  <div class="sheet-card">
    <header class="sheet-head">
      <h2>שכבות</h2>
      <button class="sheet-x" data-act="close" aria-label="סגירה">&times;</button>
    </header>
    <p class="sheet-lead">מה מוצג על המפה וברשימה.</p>
    <div id="layer-list"></div>
    <p id="layer-credit" class="sheet-credit"></p>
  </div>
</div>

<div id="draft-sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-label="הוספת שביל">
  <div class="sheet-card" id="draft-card"></div>
</div>

<div id="editor-sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-label="מצב עורך">
  <div class="sheet-card" id="editor-card"></div>
</div>

<!-- Shared by the small editor forms: links, a new layer, moving a trail. -->
<div id="form-sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-label="טופס">
  <div class="sheet-card" id="form-card"></div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<!-- Plain scripts sharing one global scope, no bundler. store.js, layers.js and
     draft.js define their modules; app.js is loaded last and drives all three. -->
<script src="store.js"></script>
<script src="layers.js"></script>
<script src="draft.js"></script>
<script src="app.js"></script>
</body>
</html>
