<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>דרך קיצור · שבילי פרדס חנה-כרכור</title>
<meta name="description" content="מדריך שבילי ההליכה וקיצורי הדרך של פרדס חנה-כרכור, עם תמונות וסטריט ויו לכל כניסה.">
<meta name="theme-color" content="#1b5e20">

<!-- The card WhatsApp, Telegram and Facebook show when the link is pasted.
     Without these the preview is the bare domain, which reads as a dead link
     rather than an invitation. og.jpg is built by build_og.py and is a JPEG on
     purpose: the preview crawlers do not decode the webp that everything else
     here uses. Absolute URLs are required - a relative og:image is ignored.
     The same block is repeated in ../index.html, because a crawler handed the
     short URL will not follow that page's meta refresh to get here. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="דרך קיצור">
<meta property="og:locale" content="he_IL">
<meta property="og:title" content="דרך קיצור · שבילי ההליכה של פרדס חנה-כרכור">
<meta property="og:description" content="רוב קיצורי הדרך שכאן לא מופיעים בשום מפה אחרת. הם כאן כי מישהו מהמושבה הלך בהם עם הטלפון. מכיר עוד אחד? אפשר להוסיף בלי הרשמה ובלי סיסמה.">
<meta property="og:url" content="https://orimosenzon.github.io/fun/vibe_coding/dereh_kitzur/web/">
<meta property="og:image" content="https://orimosenzon.github.io/fun/vibe_coding/dereh_kitzur/web/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="שביל עפר בין עצי ג'קרנדה פורחים בפרדס חנה-כרכור">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🥾</text></svg>">
<!-- Installable: a home-screen icon and a window of its own on a phone or a
     desktop. The manifest names the app and its icons, sw.js exists only to
     satisfy Chrome's install criteria and caches nothing (see the file), and
     the apple-* tags are what iOS reads instead of the manifest. The icons are
     built by build_icons.py. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="דרך קיצור">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="craft-balloon">

<div id="map" role="application" aria-label="מפת השבילים"></div>

<button id="locate" class="fab" title="איפה אני" aria-label="איפה אני">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm8.94 3A9 9 0 0013 3.06V1h-2v2.06A9 9 0 003.06 11H1v2h2.06A9 9 0 0011 20.94V23h2v-2.06A9 9 0 0020.94 13H23v-2h-2.06zM12 19a7 7 0 110-14 7 7 0 010 14z"/></svg>
</button>

<!-- A globe rather than the usual stack of sheets: the stack now belongs to the
     layer manager below, and two near-identical buttons in one column is worse
     than an icon that is merely less conventional. -->
<button id="basemap" class="fab fab-2" title="החלף רקע מפה" aria-label="החלף רקע מפה">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm6.9 6h-2.9a15.6 15.6 0 00-1.4-3.6A8 8 0 0118.9 8zM12 4c.8 1.2 1.4 2.5 1.8 4h-3.6c.4-1.5 1-2.8 1.8-4zM4.3 14a7.9 7.9 0 010-4h3.3a16.5 16.5 0 000 4H4.3zm.8 2H8a15.6 15.6 0 001.4 3.6A8 8 0 015.1 16zm2.9-8H5.1a8 8 0 014.3-3.6A15.6 15.6 0 008 8zm4 12c-.8-1.2-1.4-2.5-1.8-4h3.6c-.4 1.5-1 2.8-1.8 4zm2.2-6H9.8a14.7 14.7 0 010-4h4.4a14.7 14.7 0 010 4zm.4 5.6A15.6 15.6 0 0016 16h2.9a8 8 0 01-4.3 3.6zm1.8-5.6a16.5 16.5 0 000-4h3.3a7.9 7.9 0 010 4h-3.3z"/></svg>
</button>

<button id="tilt" class="fab fab-3" title="מבט מהצד" aria-label="מבט מהצד">
  <span class="fab-3d">3D</span>
</button>

<button id="layers" class="fab fab-4" title="שכבות" aria-label="שכבות">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5zm0 7.9l6.2-3.4L21 9l-9 5-9-5 2.8-1.5L12 10.9zm0 4.2l6.2-3.4L21 13.2l-9 5-9-5 2.8-1.6 6.2 3.5z"/></svg>
</button>

<!-- Take off. The rest of the app answers "where is the trail I came for"; this
     answers "what is out there", by making you go and look. -->
<button id="explore" class="fab fab-5" title="מצב תעופה: כדור פורח" aria-label="מצב תעופה: כדור פורח">
  <!-- The one button with a picture rather than a glyph on it. The balloon
       is the first visit's aircraft (since 16/9/2026); the other picture,
       img/f16.svg, is Ori's own artwork, an F-16 from above on a green
       roundel, vectorised from the drawing, and each is its own file
       because the traced outline is a few kilobytes. The green is the
       button's background, showing through. app.js swaps the picture to
       whichever aircraft is chosen. -->
  <img src="img/balloon.svg" alt="" width="56" height="56">
</button>
<!-- The next aircraft, on the big button's shoulder. Pressing it steps
     through the three - balloon, jet, bike, and round again - and the
     picture on the big button is the one you will fly, the small one the
     one a press would bring. app.js keeps the two in step and Explore
     remembers the choice. -->
<button id="craft" title="מעבר למטוס קרב F-16" aria-label="מעבר למטוס קרב F-16">
  <svg class="craft-bal" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 1.5a7.5 7.5 0 0 0-7.5 7.5c0 4.2 3.4 6.6 5.6 9.2.4.5.6 1 .8 1.6h2.2c.2-.6.4-1.1.8-1.6C16.1 15.6 19.5 13.2 19.5 9A7.5 7.5 0 0 0 12 1.5zM9.8 20.8h4.4l.4 2.2H9.4z"/>
  </svg>
  <svg class="craft-jet" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 1.5l1.6 2.8.6 5.2L22 13v2.2l-7.6-1.6-.2 3.6 2.6 1.9v1.6L12 19.6l-4.8 1.1v-1.6l2.6-1.9-.2-3.6L2 15.2V13l7.8-3.5.6-5.2z"/>
  </svg>
  <!-- A motorcycle from the side, nose to the left, with the jet's flame
       behind it. -->
  <svg class="craft-bike" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M6.2 7.6l1.6-2.4h2.4l-.3 1.2H8.6L7.4 8.2 9 9.6h6.4l1-2.2h-1.8l.5-1.4h3.3l-1.2 3.6h1.2c1.4 0 2.6 1.1 2.6 2.5v1.3H24l-.9 1.6h-3.5a3.1 3.1 0 0 1-6.1 0H10a3.1 3.1 0 0 1-6.1 0H0v-1.6h3.9c.5-.8 1.3-1.4 2.3-1.6l.6-1.9zM6.9 17.3a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2zm9.7 0a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2z"/>
  </svg>
</button>

<!-- What the colours on the map mean. Each places layer paints its points by the
     group its source sorted them into - seven narratives in the conservation
     appendix, eight kinds of place in pardespedia - and until this existed the
     map was a scatter of colours with nothing to read them by.

     Collapsed to a chip by default: the map is the point, and a legend is
     something you consult once and then stop looking at. The choice is kept per
     browser. It sits under the top bars rather than beside them, so recording a
     trail or navigating simply covers it. -->
<div id="legend" class="legend" hidden>
  <button id="legend-btn" class="legend-btn" aria-expanded="false" aria-controls="legend-body">
    <span class="legend-ic" aria-hidden="true"></span>
    <span>מקרא</span>
  </button>
  <div id="legend-body" class="legend-body" hidden></div>
</div>

<!-- The way back. Switching the האוטן layer on flies the map to the Netherlands,
     and from there every other control on the screen is about a map of somewhere
     else - the shortcut list, "where am I", the whole panel. This appears only
     once the map has genuinely left the area, so it costs nothing the rest of
     the time, and it is deliberately a word and not another round icon: the
     column of icons is what somebody is lost among when they need this. -->
<button id="go-home" class="go-home" hidden>חזרה לפרדס חנה־כרכור</button>

<!-- Live readout while a trail is being recorded or drawn. -->
<div id="draft-bar" class="nav draft-bar" hidden role="status" aria-live="polite">
  <div class="draft-dot"></div>
  <div class="nav-txt">
    <strong id="draft-len">0 מ׳</strong>
    <span id="draft-state">מחפש מיקום…</span>
  </div>
  <button id="draft-undo" class="draft-btn" hidden>בטל נקודה</button>
  <button id="draft-pause" class="draft-btn" hidden>השהה</button>
  <button id="draft-done" class="draft-btn strong">סיום</button>
  <button id="draft-cancel" aria-label="ביטול">&times;</button>
</div>

<!-- Correcting where the pardespedia places sit. The wiki has no coordinates at
     all, so most of these positions were guessed and a lot of them are wrong.
     This bar belongs to a session of fixing many of them, not one. -->
<div id="arrange-bar" class="nav arrange-bar" hidden role="status" aria-live="polite">
  <div class="arrange-row">
    <div class="pin-dot">📌</div>
    <div class="nav-txt">
      <strong id="arrange-name">גרור סיכה למקום הנכון</strong>
      <span id="arrange-links" class="arrange-links"></span>
    </div>
    <button id="arrange-save" class="draft-btn strong" disabled>שמור</button>
    <button id="arrange-done" aria-label="סיום">&times;</button>
  </div>
  <div class="arrange-row second">
    <button id="arrange-next" class="draft-btn" hidden>הנח מקום חסר</button>
    <span id="arrange-count" class="arrange-count"></span>
  </div>
</div>

<div id="nav" class="nav" hidden role="status" aria-live="polite">
  <div class="nav-arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l7 19-7-4-7 4z"/></svg></div>
  <div class="nav-txt">
    <strong id="nav-dist">—</strong>
    <span id="nav-state">מחפש מיקום…</span>
  </div>
  <button id="nav-stop" aria-label="עצור ניווט">&times;</button>
</div>

<section id="panel" class="panel" aria-label="רשימת השבילים">
  <div class="grip" id="grip" role="button" tabindex="0" aria-label="הרחב או כווץ את הרשימה"></div>

  <!-- List view -->
  <div id="list-view">
    <header class="panel-head">
      <div class="title-row">
        <h1>דרך קיצור</h1>
        <span class="title-btns">
          <!-- Put an icon on the home screen. Hidden once the app is running
               as one (display-mode: standalone), see Install in app.js. -->
          <button id="install-btn" class="editor-btn install" hidden>📲 למסך הבית</button>
          <button id="editor-btn" class="editor-btn">מצב עורך</button>
        </span>
      </div>
      <p id="stats" class="stats">טוען…</p>

      <!-- The invitation, and it is the whole point of the app rather than one
           more control: 83% of what is on this map is not on any other map,
           which is only true because somebody walked it and sent it in. It was
           a chip among the sort chips until 10/9/2026, indistinguishable from
           "הארוכים", and a chip is not an invitation.

           Deliberately says what it costs - nothing, no account, no password -
           because the reason a resident does not add a shortcut is almost never
           that they do not know one. -->
      <button id="add" class="invite">
        <span class="invite-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
        </span>
        <span class="invite-txt">
          <b>הוסף דרך קיצור שאתה מכיר</b>
          <span>לך בה עם הטלפון והיא תיכנס למפה. בלי הרשמה ובלי סיסמה.</span>
        </span>
      </button>

      <!-- Only while there is something unsent on this device. A trail that has
           been recorded and not sent is the one thing in this app that is
           waiting on its owner, and until this existed it waited quietly at row
           sixty of a list sorted by length. -->
      <button id="unsent" class="unsent" hidden></button>

      <!-- What is being planned around here, and the one window in a plan's
           life when a resident can say anything about it. The banner is filled
           live from the planning administration on load, and stays hidden when
           nothing is open - a row that says "0 plans" every day is a row nobody
           reads on the day it says 4. See plan_here.js and refreshObjections. -->
      <button id="plan-banner" class="plan-banner" hidden></button>

      <button id="plan-ask" class="invite invite-quiet">
        <span class="invite-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 00-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 00-7-7zm0 4a3 3 0 011.7 5.5V13h-1.4v-1.5A3 3 0 0112 6z"/></svg>
        </span>
        <span class="invite-txt">
          <b>מה מתוכנן כאן?</b>
          <span>לחץ, ואז בחר נקודה במפה. כל התכניות שחלות עליה, הייעוד, הגוש והחלקה.</span>
        </span>
      </button>

      <div class="controls">
        <input id="search" type="search" placeholder="חיפוש שביל או רחוב…" autocomplete="off" aria-label="חיפוש">
        <div class="sorts" role="group" aria-label="מיון">
          <button class="sort on" data-sort="length">הארוכים</button>
          <button class="sort" data-sort="near">הקרובים</button>
          <button class="sort" data-sort="photos">עם תמונות</button>
          <button class="sort" data-sort="unplaced" id="sort-unplaced" hidden>לא ממוקמים</button>
        </div>
      </div>
    </header>
    <ul id="list" class="list"></ul>
  </div>

  <!-- Detail view -->
  <div id="detail-view" hidden>
    <header class="detail-head">
      <button id="back" class="back" aria-label="חזרה לרשימה">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6L4 12l6 6 1.4-1.4L7.8 13H20v-2H7.8l3.6-3.6z"/></svg>
        <span>לרשימה</span>
      </button>
      <span class="tip">או פשוט לחץ על שביל אחר במפה</span>
    </header>
    <div id="detail" class="detail"></div>
  </div>
</section>

<!-- The panel's edge, on wide screens only. Drag it to set the width, or use
     the tab to fold the list away and leave the map on its own. It sits beside
     the panel rather than inside it so that folding can clip the panel's
     contents without clipping the handle that brings them back. -->
<div id="grip-v" class="grip-v" role="separator" aria-orientation="vertical"
     aria-label="רוחב הרשימה" tabindex="0">
  <button id="panel-fold" class="grip-btn" aria-label="הסתרת הרשימה"></button>
</div>

<div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="תמונה בגודל מלא">
  <button class="lb-close" aria-label="סגירה">&times;</button>
  <button class="lb-nav lb-prev" aria-label="הקודמת">&rsaquo;</button>
  <button class="lb-nav lb-next" aria-label="הבאה">&lsaquo;</button>
  <div class="lb-stage">
    <div class="lb-spin" id="lb-spin"></div>
    <img id="lb-img" alt="" referrerpolicy="no-referrer">
    <!-- A video sits in the same stage as the photos and takes its turn in the
         same browsing order. The src is set only while it is showing and blanked
         on the way out, or the sound carries on after the lightbox is closed. -->
    <iframe id="lb-video" class="lb-video" hidden title="סרטון"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>
  <p class="lb-cap"><span id="lb-cap-text"></span> <span id="lb-count" class="lb-count"></span></p>
</div>

<div id="layer-sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-label="שכבות">
  <div class="sheet-card">
    <header class="sheet-head">
      <h2>שכבות</h2>
      <button class="sheet-x" data-act="close" aria-label="סגירה">&times;</button>
    </header>
    <p class="sheet-lead">מה מוצג על המפה וברשימה.</p>
    <!-- One status line for the whole sheet, the way the detail pane has one:
         attaching a video to a layer happens inside a row, and a second line
         per row would be fifteen elements that are silent all but once. -->
    <p id="lay-msg" class="pub-msg" hidden></p>
    <div id="layer-list"></div>
    <p id="layer-credit" class="sheet-credit"></p>
  </div>
</div>

<div id="draft-sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-label="הוספת שביל">
  <div class="sheet-card" id="draft-card"></div>
</div>

<div id="editor-sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-label="מצב עורך">
  <div class="sheet-card" id="editor-card"></div>
</div>

<!-- Shown once, on a first visit, and then never again on this browser. It is
     here because the app looks finished: a map with fifty trails on it reads as
     something somebody else made and you came to consult, and nothing about it
     says the next trail is yours to add. -->
<div id="welcome-sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-label="ברוך הבא">
  <div class="sheet-card" id="welcome-card"></div>
</div>

<!-- Shared by the small editor forms: links, a new layer, moving a trail. -->
<div id="form-sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-label="טופס">
  <div class="sheet-card" id="form-card"></div>
</div>

<!-- "מה מתוכנן כאן?" - filled live from the planning administration at the
     moment somebody taps a point. See plan_here.js for why it is live and not
     built into a layer. -->
<div id="plan-sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-label="מה מתוכנן כאן">
  <div class="sheet-card" id="plan-card"></div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<!-- Plain scripts sharing one global scope, no bundler. store.js, layers.js and
     draft.js define their modules; app.js is loaded last and drives all three. -->
<script src="store.js"></script>
<script src="layers.js"></script>
<script src="draft.js"></script>
<script src="arrange.js"></script>
<!-- bike.js is the jet bike's physics and mesh (fable's), and it fetches
     Three.js itself, only when the bike is first flown. -->
<script src="bike.js"></script>
<script src="cockpit.js"></script>
<script src="plan_here.js"></script>
<script src="explore.js"></script>
<script src="app.js"></script>
</body>
</html>
