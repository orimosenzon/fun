<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- The jet bike from the side, nose to the left, for the flight button when
     the bike is the aircraft: the same yellow on the same green roundel as
     the balloon and the F-16, with the green showing through the gaps - the
     intake, the visor, the headlight's glass, the daylight under the frame.
     The flame is the one thing in another colour, as the balloon's basket
     is. -->
<!-- the flame -->
<path fill="#e0491f" d="M70 55c9-4 18-2 26 8-8 10-17 12-26 8 4-4 4-12 0-16z"/>
<path fill="#ffb347" d="M72 58c6-2 11-1 16 5-5 6-10 7-16 5 2.5-3 2.5-7 0-10z"/>
<!-- the turbojet, slung under everything -->
<rect fill="#fdcd01" x="13" y="54" width="59" height="18" rx="9"/>
<circle fill="#009f67" cx="23" cy="63" r="5"/>
<path fill="#009f67" d="M59 55.5h2.4v15H59zM52 55.5h1.4v15H52z"/>
<!-- skids, their legs, the lift pod -->
<path fill="#fdcd01" d="M21 80h50v3.5H21zM29 72h3.5v8.5H29zM60 72h3.5v8.5H60zM40 72h12v7.5H40z"/>
<!-- the frame: tank up front, the seat stepping down behind it -->
<path fill="#fdcd01" d="M26 54c1-8 6-13 14-14h12c4 0 6.5 3.5 8 6h10c2 2 3 5 3 8H26z"/>
<path fill="#009f67" d="M40 43h10v2.6H40zM30 52.2h42v2.2H30z"/>
<!-- the front end: fork, bars, headlight -->
<path fill="none" stroke="#fdcd01" stroke-width="3.4" stroke-linecap="round" d="M33 39l-5 13M31 36l10 2.2"/>
<circle fill="#fdcd01" cx="23" cy="44" r="5.5"/>
<circle fill="#009f67" cx="23" cy="44" r="2.2"/>
<!-- the rider, hunched over the bars, with the pack on their back -->
<path fill="#fdcd01" d="M61 30c5-1 8 3 7 9l-3 5-6-8z"/>
<circle fill="#fdcd01" cx="49" cy="22" r="7.5"/>
<path fill="#009f67" d="M42 20h7.5v3.4H42z"/>
<path fill="#fdcd01" d="M43 31c6-4 14-2 18 4l8 11H55l-6-7c-5-2-7-5-6-8z"/>
<path fill="none" stroke="#fdcd01" stroke-width="4" stroke-linecap="round" d="M46 33l-8 5.5M62 43l3 8"/>
</svg>
