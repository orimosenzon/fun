<!-- A hot-air balloon from the side, for the flight button when the balloon
     is the aircraft. Drawn to sit on the same green roundel as the F-16 and
     in the same yellow, so the two read as one button in two moods. The
     gores are gaps in the envelope, the way the canopy is a gap in the jet:
     the disc shows through. -->
