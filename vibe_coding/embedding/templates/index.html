<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Analogy Explorer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* ---- Header ---- */
    .header {
      padding: 2rem 1rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid #1e293b;
    }
    .header h1 { font-size: 1.9rem; color: #a78bfa; letter-spacing: 0.03em; }
    .header p  { color: #64748b; margin-top: 0.4rem; font-size: 0.9rem; }

    /* ---- Tabs ---- */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      padding: 1.5rem 1rem 0;
    }
    .tab {
      padding: 0.65rem 2rem;
      border-radius: 0.5rem;
      cursor: pointer;
      border: 2px solid #1e293b;
      background: #1e293b;
      color: #64748b;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .tab:hover  { border-color: #7c3aed; color: #a78bfa; }
    .tab.active { border-color: #7c3aed; color: #a78bfa; background: #1e1b4b; }

    /* ---- Panels ---- */
    .panel {
      display: none;
      max-width: 780px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    .panel.active { display: block; }

    /* ---- Shared ---- */
    .section-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #475569;
      margin-bottom: 0.75rem;
    }

    /* ==============================
       QUIZ MODE
    ============================== */
    .score-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.75rem;
    }
    .score { font-size: 1.1rem; color: #a78bfa; font-weight: 600; }

    .btn-primary {
      padding: 0.55rem 1.4rem;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn-primary:hover    { background: #6d28d9; }
    .btn-primary:disabled { background: #334155; cursor: not-allowed; }

    .question-card {
      background: #1e293b;
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .analogy-text {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #e2e8f0;
    }
    .analogy-text .blank { color: #a78bfa; }
    .cat-label { color: #475569; font-size: 0.82rem; margin-top: 0.6rem; }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.9rem;
    }
    .choice-btn {
      padding: 1rem;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 0.75rem;
      color: #e2e8f0;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.15s;
    }
    .choice-btn:hover:not(:disabled) { border-color: #7c3aed; background: #1e1b4b; }
    .choice-btn.correct { border-color: #22c55e; background: #14532d; color: #86efac; }
    .choice-btn.wrong   { border-color: #ef4444; background: #7f1d1d; color: #fca5a5; }
    .choice-btn:disabled { cursor: not-allowed; }

    .feedback {
      margin-top: 1.5rem;
      padding: 0.9rem 1.1rem;
      border-radius: 0.75rem;
      background: #0f172a;
      border-left: 4px solid #7c3aed;
      color: #94a3b8;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    /* ==============================
       FREE MODE
    ============================== */
    .pool-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .shuffle-btn {
      padding: 0.35rem 0.9rem;
      background: transparent;
      border: 1px solid #334155;
      color: #64748b;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.82rem;
      transition: all 0.2s;
    }
    .shuffle-btn:hover { border-color: #7c3aed; color: #a78bfa; }

    .word-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      min-height: 72px;
      background: #1e293b;
      border-radius: 0.75rem;
      padding: 0.9rem;
      border: 2px dashed #334155;
      margin-bottom: 2rem;
      transition: border-color 0.2s;
    }
    .word-pool.drag-over { border-color: #7c3aed; }

    .word-chip {
      padding: 0.38rem 1rem;
      background: #2e1065;
      color: #ddd6fe;
      border-radius: 2rem;
      cursor: grab;
      font-size: 0.9rem;
      font-weight: 500;
      user-select: none;
      border: 2px solid transparent;
      transition: all 0.15s;
    }
    .word-chip:hover   { background: #4c1d95; border-color: #7c3aed; }
    .word-chip.dragging { opacity: 0.35; cursor: grabbing; }

    /* Analogy builder row */
    .builder-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.75rem;
    }
    .slot-group { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; }
    .slot-name  { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; color: #475569; }

    .drop-slot {
      width: 110px;
      height: 52px;
      border: 2px dashed #4c1d95;
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e1b4b;
      transition: all 0.2s;
      overflow: hidden;
    }
    .drop-slot.drag-over  { border-color: #a78bfa; background: #2e1065; }
    .drop-slot .placeholder { color: #4c1d95; font-size: 0.82rem; }
    .slot-chip {
      padding: 0.38rem 0.75rem;
      background: #7c3aed;
      color: white;
      border-radius: 2rem;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: grab;
      max-width: 98px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      letter-spacing: 0.04em;
    }
    .slot-chip:active { cursor: grabbing; }

    .sep  { font-size: 1.5rem; color: #334155; font-weight: 700; padding-bottom: 1.2rem; }
    .eq   { font-size: 1.1rem; color: #334155; padding-bottom: 1.2rem; }
    .qmark{ font-size: 2.2rem; color: #7c3aed; font-weight: 700; padding-bottom: 1.2rem; }

    .find-btn-wrap { text-align: center; margin-bottom: 1.75rem; }

    /* Results */
    .error-box {
      background: #450a0a;
      color: #fca5a5;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.88rem;
    }
    .results-card {
      background: #1e293b;
      border-radius: 0.75rem;
      padding: 1.5rem;
    }
    .results-title {
      font-size: 1.1rem;
      color: #a78bfa;
      font-weight: 700;
      margin-bottom: 1.25rem;
      letter-spacing: 0.04em;
    }
    .result-row {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin-bottom: 0.7rem;
    }
    .r-rank  { width: 22px; font-size: 1rem; text-align: center; }
    .r-word  { min-width: 120px; font-weight: 700; font-size: 1rem; letter-spacing: 0.04em; }
    .r-bar-wrap {
      flex: 1;
      height: 16px;
      background: #0f172a;
      border-radius: 1rem;
      overflow: hidden;
    }
    .r-bar {
      height: 100%;
      background: linear-gradient(90deg, #4c1d95, #a78bfa);
      border-radius: 1rem;
      transition: width 0.6s ease;
    }
    .r-score { color: #475569; font-size: 0.8rem; min-width: 46px; text-align: right; }
  </style>
</head>
<body>

<div class="header">
  <h1>Word Analogy Explorer</h1>
  <p>Powered by GloVe word embeddings</p>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('quiz')">Quiz Mode</div>
  <div class="tab"        onclick="switchTab('free')">Build Your Own</div>
  <div class="tab"        onclick="switchTab('nearest')">Nearest Words</div>
</div>


<!-- ===== QUIZ PANEL ===== -->
<div class="panel active" id="panel-quiz">
  <div class="score-bar">
    <div class="score">Score: <span id="score">0</span> / <span id="total">0</span></div>
    <button class="btn-primary" onclick="loadQuestion()">New Question</button>
  </div>

  <div class="question-card">
    <div class="analogy-text" id="question-text">Loading...</div>
    <div class="cat-label"    id="cat-label"></div>
  </div>

  <div class="choices" id="choices"></div>
  <div class="feedback" id="feedback" style="display:none"></div>
</div>


<!-- ===== FREE MODE PANEL ===== -->
<div class="panel" id="panel-free">

  <div class="pool-header">
    <div class="section-label">Word pool — drag words into the slots</div>
    <button class="shuffle-btn" onclick="loadWords()">Shuffle</button>
  </div>
  <div class="word-pool" id="word-pool"
       ondragover="poolDragOver(event)"
       ondrop="poolDrop(event)"
       ondragleave="poolDragLeave(event)">
  </div>

  <div class="section-label">Build your analogy</div>
  <div class="builder-row">
    <div class="slot-group">
      <div class="slot-name">A</div>
      <div class="drop-slot" id="slot-a"
           ondragover="slotDragOver(event)"
           ondrop="slotDrop(event,'a')"
           ondragleave="slotDragLeave(event)">
        <span class="placeholder">drop here</span>
      </div>
    </div>
    <div class="sep">:</div>
    <div class="slot-group">
      <div class="slot-name">B</div>
      <div class="drop-slot" id="slot-b"
           ondragover="slotDragOver(event)"
           ondrop="slotDrop(event,'b')"
           ondragleave="slotDragLeave(event)">
        <span class="placeholder">drop here</span>
      </div>
    </div>
    <div class="eq">=</div>
    <div class="slot-group">
      <div class="slot-name">C</div>
      <div class="drop-slot" id="slot-c"
           ondragover="slotDragOver(event)"
           ondrop="slotDrop(event,'c')"
           ondragleave="slotDragLeave(event)">
        <span class="placeholder">drop here</span>
      </div>
    </div>
    <div class="sep">:</div>
    <div class="qmark">?</div>
  </div>

  <div class="find-btn-wrap">
    <button class="btn-primary" id="find-btn" onclick="findAnswer()" disabled>
      Find Answer
    </button>
  </div>

  <div class="error-box"  id="free-error"  style="display:none"></div>
  <div class="results-card" id="results"   style="display:none"></div>
</div>


<!-- ===== NEAREST WORDS PANEL ===== -->
<div class="panel" id="panel-nearest">
  <div class="section-label">Enter a word to find its 7 nearest neighbors</div>

  <div style="display:flex; gap:0.75rem; margin-bottom:1.75rem;">
    <input
      type="text"
      id="nearest-input"
      placeholder="e.g. ocean"
      style="
        flex:1; padding:0.7rem 1rem;
        background:#1e293b; border:2px solid #334155;
        border-radius:0.5rem; color:#e2e8f0;
        font-size:1rem; outline:none;
      "
      onkeydown="if(event.key==='Enter') findNearest()"
    />
    <button class="btn-primary" onclick="findNearest()">Search</button>
  </div>

  <div class="error-box"    id="nearest-error"   style="display:none"></div>
  <div class="results-card" id="nearest-results" style="display:none"></div>
</div>

<script>
// ───────────────────────────────────────────
//  Tab switching
// ───────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  event.currentTarget.classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}

// ───────────────────────────────────────────
//  QUIZ MODE
// ───────────────────────────────────────────
let currentQ = null;
let score = 0, total = 0;

async function loadQuestion() {
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('choices').innerHTML = '';
  document.getElementById('question-text').textContent = 'Loading...';

  const res = await fetch('/api/quiz/question');
  currentQ = await res.json();
  const { a, b, c, choices, category } = currentQ;

  document.getElementById('question-text').innerHTML =
    `${a.toUpperCase()} : ${b.toUpperCase()} &nbsp;=&nbsp; ${c.toUpperCase()} : <span class="blank">?</span>`;
  document.getElementById('cat-label').textContent = category;

  const container = document.getElementById('choices');
  choices.forEach(word => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = word.toUpperCase();
    btn.onclick = () => pickAnswer(word, btn);
    container.appendChild(btn);
  });
}

function pickAnswer(selected, btn) {
  const { answer, a, b, c } = currentQ;
  const correct = selected.toLowerCase() === answer.toLowerCase();

  total++;
  if (correct) score++;
  document.getElementById('score').textContent = score;
  document.getElementById('total').textContent = total;

  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent.toLowerCase() === answer.toLowerCase()) b.classList.add('correct');
  });
  if (!correct) btn.classList.add('wrong');

  const fb = document.getElementById('feedback');
  fb.style.display = 'block';
  fb.textContent = (correct ? '✓ Correct! ' : `✗ The answer was "${answer.toUpperCase()}". `) +
    `The model computed: vector(${b}) + vector(${c}) − vector(${a}) ≈ vector(${answer})`;
}

// ───────────────────────────────────────────
//  FREE MODE — drag and drop
// ───────────────────────────────────────────
let dragWord   = null; // word being dragged
let dragFrom   = null; // 'pool' | 'a' | 'b' | 'c'
const slots    = { a: null, b: null, c: null };

async function loadWords() {
  const res  = await fetch('/api/free/words');
  const data = await res.json();

  const pool = document.getElementById('word-pool');
  pool.innerHTML = '';

  // Also return any slotted words back to pool display
  ['a','b','c'].forEach(s => {
    slots[s] = null;
    renderSlot(s, null);
  });
  updateFindBtn();
  document.getElementById('results').style.display   = 'none';
  document.getElementById('free-error').style.display = 'none';

  data.words.forEach(addChipToPool);
}

function addChipToPool(word) {
  const pool = document.getElementById('word-pool');
  const chip = document.createElement('div');
  chip.className   = 'word-chip';
  chip.textContent = word;
  chip.id          = 'chip-' + word;
  chip.draggable   = true;
  chip.ondragstart = e => startDrag(e, word, 'pool');
  chip.ondragend   = endDrag;
  pool.appendChild(chip);
}

function startDrag(e, word, from) {
  dragWord = word;
  dragFrom = from;
  e.dataTransfer.effectAllowed = 'move';
  if (from === 'pool') {
    setTimeout(() => {
      const c = document.getElementById('chip-' + word);
      if (c) c.classList.add('dragging');
    }, 0);
  }
}

function endDrag() {
  if (dragFrom === 'pool' && dragWord) {
    const c = document.getElementById('chip-' + dragWord);
    if (c) c.classList.remove('dragging');
  }
}

/* ---- slot events ---- */
function slotDragOver(e)  { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function slotDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }

function slotDrop(e, slotName) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!dragWord) return;

  const prevWord = slots[slotName];

  // If dragged from another slot, clear that slot
  if (dragFrom !== 'pool' && dragFrom !== slotName) {
    slots[dragFrom] = null;
    renderSlot(dragFrom, null);
  }

  // Return displaced word to pool (if any)
  if (prevWord && prevWord !== dragWord) {
    showChipInPool(prevWord);
  }

  // Fill the target slot
  slots[slotName] = dragWord;
  renderSlot(slotName, dragWord);

  // Hide from pool if coming from pool
  if (dragFrom === 'pool') {
    hideChipInPool(dragWord);
  }

  dragWord = null;
  dragFrom = null;
  updateFindBtn();
}

/* ---- pool as drop target (return chips) ---- */
function poolDragOver(e)  { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function poolDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }

function poolDrop(e) {
  e.preventDefault();
  document.getElementById('word-pool').classList.remove('drag-over');
  if (!dragWord || dragFrom === 'pool') return;

  slots[dragFrom] = null;
  renderSlot(dragFrom, null);
  showChipInPool(dragWord);

  dragWord = null;
  dragFrom = null;
  updateFindBtn();
}

/* ---- helpers ---- */
function hideChipInPool(word) {
  const c = document.getElementById('chip-' + word);
  if (c) c.style.display = 'none';
}

function showChipInPool(word) {
  const c = document.getElementById('chip-' + word);
  if (c) {
    c.style.display = '';
    c.classList.remove('dragging');
  }
}

function renderSlot(slotName, word) {
  const el = document.getElementById('slot-' + slotName);
  el.innerHTML = '';
  if (!word) {
    const ph = document.createElement('span');
    ph.className   = 'placeholder';
    ph.textContent = 'drop here';
    el.appendChild(ph);
  } else {
    const chip = document.createElement('div');
    chip.className   = 'slot-chip';
    chip.textContent = word.toUpperCase();
    chip.draggable   = true;
    chip.ondragstart = e => startDrag(e, word, slotName);
    chip.ondragend   = endDrag;
    // double-click to return to pool
    chip.ondblclick  = () => {
      slots[slotName] = null;
      renderSlot(slotName, null);
      showChipInPool(word);
      updateFindBtn();
    };
    el.appendChild(chip);
  }
}

function updateFindBtn() {
  document.getElementById('find-btn').disabled = !(slots.a && slots.b && slots.c);
}

/* ---- find answer ---- */
async function findAnswer() {
  document.getElementById('free-error').style.display  = 'none';
  document.getElementById('results').style.display     = 'none';

  const btn = document.getElementById('find-btn');
  btn.textContent = 'Searching...';
  btn.disabled    = true;

  const res  = await fetch('/api/free/ask', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ a: slots.a, b: slots.b, c: slots.c }),
  });
  const data = await res.json();

  btn.textContent = 'Find Answer';
  btn.disabled    = !(slots.a && slots.b && slots.c);

  if (data.error) {
    const err = document.getElementById('free-error');
    err.textContent    = data.error;
    err.style.display  = 'block';
    return;
  }

  const maxScore = data.results[0]?.score ?? 1;
  const ranks    = ['', '', '', '4.', '5.'];
  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML =
    `<div class="results-title">
       ${slots.a.toUpperCase()} : ${slots.b.toUpperCase()}
       &nbsp;=&nbsp;
       ${slots.c.toUpperCase()} : ?
     </div>` +
    data.results.map((r, i) => {
      const pct = Math.round(((r.score + 1) / 2) * 100);
      return `
        <div class="result-row">
          <div class="r-rank">${ranks[i]}</div>
          <div class="r-word">${r.word.toUpperCase()}</div>
          <div class="r-bar-wrap">
            <div class="r-bar" style="width:${pct}%"></div>
          </div>
          <div class="r-score">${r.score.toFixed(3)}</div>
        </div>`;
    }).join('');

  resultsEl.style.display = 'block';
}

// ───────────────────────────────────────────
//  NEAREST WORDS
// ───────────────────────────────────────────
async function findNearest() {
  const word = document.getElementById('nearest-input').value.trim();
  document.getElementById('nearest-error').style.display   = 'none';
  document.getElementById('nearest-results').style.display = 'none';
  if (!word) return;

  const res  = await fetch('/api/nearest', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ word }),
  });
  const data = await res.json();

  if (data.error) {
    const err = document.getElementById('nearest-error');
    err.textContent   = data.error;
    err.style.display = 'block';
    return;
  }

  const resultsEl = document.getElementById('nearest-results');
  resultsEl.innerHTML =
    `<div class="results-title">Words nearest to "${word.toUpperCase()}"</div>` +
    data.results.map((r, i) => {
      const pct = Math.round(((r.score + 1) / 2) * 100);
      return `
        <div class="result-row">
          <div class="r-rank">${i + 1}.</div>
          <div class="r-word">${r.word.toUpperCase()}</div>
          <div class="r-bar-wrap">
            <div class="r-bar" style="width:${pct}%"></div>
          </div>
          <div class="r-score">${r.score.toFixed(3)}</div>
        </div>`;
    }).join('');
  resultsEl.style.display = 'block';
}

// ── init ──
loadQuestion();
loadWords();
</script>
</body>
</html>
