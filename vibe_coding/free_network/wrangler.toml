name = "free-network"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "free-network"
# Replaced with the real id when the Cloudflare database is created.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
