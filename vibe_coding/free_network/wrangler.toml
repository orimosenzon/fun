name = "free-network"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/why", "/why.html"]

[[d1_databases]]
binding = "DB"
database_name = "free-network"
# Replaced with the real id when the Cloudflare database is created.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "free-network-images"

# The real network, open only to people the admin invites. Everything above is the copy that
# runs on the developer's machine. The database kept its first name, from the trial days.
[env.live]
name = "free-network"

[env.live.vars]
INVITE_ONLY = "1"
ADMIN_EMAIL = "admin@invite.invalid"
GOOGLE_CLIENT_ID = "499440299994-1jorad0ruokmg0hdlkrv60dmm314jqt2.apps.googleusercontent.com"

[env.live.assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/why", "/why.html"]

[[env.live.d1_databases]]
binding = "DB"
database_name = "free-network-pilot"
database_id = "38b23e87-9b69-49fb-81c9-d6bcc7ddaea7"
migrations_dir = "migrations"

[[env.live.r2_buckets]]
binding = "IMAGES"
bucket_name = "free-network-images"
