<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Coding — פרויקטי AI</title>
    <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="%23818cf8"/><stop offset=".5" stop-color="%23c084fc"/><stop offset="1" stop-color="%23f472b6"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="%230f172a"/><path d="M22 20 10 32l12 12M42 20l12 12-12 12" fill="none" stroke="url(%23g)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 18l2.6 7.4L42 28l-7.4 2.6L32 38l-2.6-7.4L22 28l7.4-2.6z" fill="url(%23g)"/></svg>'>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Heebo', 'Inter', sans-serif;
            background: #09111f;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 28px 20px 60px;
            /* the stage's prism swings wider than the screen mid-roll */
            overflow-x: clip;
        }

        /* Subtle grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(129,140,248,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(129,140,248,0.03) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ── Header ── */
        header {
            text-align: center;
            margin-bottom: 28px;
            padding: 12px 24px 0;
            position: relative;
        }

        header::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: min(500px, 100%); height: 250px;
            background: radial-gradient(ellipse, rgba(129,140,248,0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        header h1 {
            font-size: clamp(1.9rem, 6vw, 3rem);
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .header-sub {
            color: #94a3b8;
            font-size: 1.05rem;
            margin-bottom: 6px;
        }

        .header-meta {
            color: #475569;
            font-size: 0.82rem;
        }

        .header-stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
        }

        .stat-num {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 2px;
        }

        html { scroll-behavior: smooth; }

        /* ── Table of contents ── */
        .toc {
            background: #0c1726;
            border: 1px solid #1a2840;
            border-radius: 16px;
            padding: 18px 20px 20px;
            scroll-margin-top: 16px;
        }

        .toc-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .toc-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #cbd5e1;
            letter-spacing: 1.5px;
        }

        .toc-sort, .toc-sort-all {
            font: inherit;
            font-size: 0.7rem;
            font-weight: 600;
            color: #94a3b8;
            background: #131e2e;
            border: 1px solid #1e2e42;
            border-radius: 20px;
            padding: 2px 10px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.18s;
        }
        .toc-sort:hover, .toc-sort-all:hover { background: #1a2840; color: #e2e8f0; }
        .toc-sort.sorted { color: #c084fc; border-color: rgba(192,132,252,0.4); }
        .toc-sort-all { margin-inline-start: auto; }

        .toc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 18px 16px;
        }

        .toc-head {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 1px solid #1e293b;
        }

        .toc-cat {
            font-size: 0.8rem;
            font-weight: 700;
            color: #e2e8f0;
            text-decoration: none;
        }
        .toc-cat:hover { color: #c084fc; }

        .toc-list { list-style: none; }

        .toc-list a {
            display: flex;
            gap: 6px;
            align-items: baseline;
            padding: 3px 4px;
            border-radius: 6px;
            text-decoration: none;
            line-height: 1.3;
        }
        .toc-list a:hover { background: #131e2e; }
        .toc-list a:hover .toc-name { color: #c084fc; }

        .toc-icon { font-size: 0.8rem; flex-shrink: 0; }
        .toc-name { font-size: 0.82rem; font-weight: 600; color: #cbd5e1; }
        .toc-sub { display: block; font-size: 0.68rem; color: #64748b; }

        .toc-try {
            font-size: 0.72rem;
            font-weight: 600;
            color: #4ade80;
            text-decoration: none;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(74,222,128,0.1);
            border: 1px solid rgba(74,222,128,0.25);
        }
        .toc-try:hover { background: rgba(74,222,128,0.18); }

        /* ── Stage: the rotating showcase at the top ──
           One live project at a time on the faces of a three-sided prism that
           rolls a third of a turn per step, the same mechanism as the haskala
           landing page. There are many projects and only three faces: the
           script writes the next project onto the face about to swing in.
           --sw is the face width: about 70% of what fits in one screen, so
           the page around it stays in view. */
        .stage {
            --sw: min(1000px, calc(100vw - 40px), calc((100vh - 150px) * 1.6 * 0.7));
            width: var(--sw);
            margin: 0 calc((100% - var(--sw)) / 2) 56px;
            position: relative;
            outline: none;
        }
        .stage:focus-visible .stage-face { outline: 3px solid #818cf8; outline-offset: 3px; }
        .stage-flip {
            perspective: calc(var(--sw) * 3.2);
            touch-action: pan-y;
        }
        .stage-inner {
            /* the true inradius of an equilateral prism, so the faces meet at
               the edges and the roll never shows a gap */
            --r: calc(var(--sw) * 0.2887);
            display: grid;
            transform-style: preserve-3d;
            transform: translateZ(calc(-1 * var(--r))) rotateY(var(--rot, 0deg));
            /* symmetric easing: a front-loaded curve leaves a frame where no
               face looks at the reader */
            transition: transform 0.9s cubic-bezier(.65, 0, .35, 1);
        }
        .stage-face {
            grid-area: 1 / 1;
            display: flex;
            flex-direction: column;
            transform: rotateY(calc(var(--k) * 120deg)) translateZ(var(--r));
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            background: #0e1a2b;
            border: 1px solid #1a2840;
            border-radius: 18px;
            overflow: hidden;
            text-decoration: none;
            box-shadow: 0 30px 80px rgba(0,0,0,0.55);
        }
        .stage-face-0 { --k: 0; }
        .stage-face-1 { --k: 1; }
        .stage-face-2 { --k: 2; }
        .stage-shot {
            display: block;
            aspect-ratio: 16 / 10;
            background: #0b1424;
        }
        .stage-shot img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            -webkit-user-drag: none;
            user-select: none;
        }
        .stage-cap {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 20px;
            border-top: 2px solid var(--accent, #818cf8);
        }
        .stage-icon { font-size: 1.7rem; flex-shrink: 0; }
        .stage-text { flex: 1; min-width: 0; line-height: 1.35; }
        .stage-name { display: block; font-size: 1.12rem; font-weight: 700; color: #f1f5f9; }
        .stage-name small { font-size: 0.85rem; font-weight: 500; color: var(--accent, #94a3b8); }
        .stage-lead {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .stage-open {
            flex-shrink: 0;
            padding: 9px 20px;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #059669, #10b981);
            box-shadow: 0 0 16px rgba(16,185,129,0.3);
            transition: box-shadow 0.2s;
        }
        .stage-face:hover .stage-open { box-shadow: 0 0 24px rgba(16,185,129,0.6); }

        .stage-nav {
            /* above the face that swings out towards the reader mid-roll */
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
        }
        /* The arrows sit beside the picture, level with its middle: big, wide
           and short, so no one misses that there is more to see. They stand
           outside the face when the screen has room, and over its edges when
           it does not. Next is on the right, so one press to the right brings
           the second slide. */
        .stage-arrow {
            --aw: 92px;
            --gap: max(calc(-1 * (var(--aw) + 28px)), calc((var(--sw) - 100vw) / 2 + 8px));
            position: absolute;
            z-index: 3;
            top: calc(var(--sw) * 0.3125);
            transform: translateY(-50%);
            width: var(--aw);
            height: 64px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 18px;
            border: 1.5px solid rgba(129,140,248,0.55);
            background: rgba(20,30,52,0.88);
            color: #e0e7ff;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(0,0,0,0.45), 0 0 22px rgba(129,140,248,0.25);
            backdrop-filter: blur(6px);
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.2s;
            animation: stage-arrow-call 1.6s ease-in-out 1s 2;
        }
        .stage-next { right: var(--gap); }
        .stage-prev { left: var(--gap); }
        .stage-arrow:hover {
            background: #4f46e5;
            border-color: #a5b4fc;
            color: #fff;
            box-shadow: 0 10px 32px rgba(0,0,0,0.5), 0 0 34px rgba(129,140,248,0.6);
            transform: translateY(-50%) scale(1.06);
        }
        .stage-arrow:active { transform: translateY(-50%) scale(0.96); }
        .stage-arrow:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 3px; }
        /* two soft calls for attention after the page loads, then still */
        @keyframes stage-arrow-call {
            50% { box-shadow: 0 8px 28px rgba(0,0,0,0.45), 0 0 40px rgba(129,140,248,0.75); border-color: #a5b4fc; }
        }
        /* Autoplay row: a big play/pause button, the speed slider, the count */
        .stage-auto {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px 22px;
            margin-top: 16px;
        }
        .stage-play {
            display: inline-flex; align-items: center; gap: 10px;
            height: 52px;
            padding: 0 26px 0 22px;
            border-radius: 999px;
            border: 1.5px solid #a5b4fc;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff;
            font: inherit;
            font-size: 1.02rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 22px rgba(79,70,229,0.45);
            transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
        }
        .stage-play:hover { transform: scale(1.04); box-shadow: 0 8px 30px rgba(124,58,237,0.6); }
        .stage-play:active { transform: scale(0.97); }
        .stage-play:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 3px; }
        .stage-play-icon { font-size: 0.85rem; letter-spacing: -1px; width: 1.1em; text-align: center; }
        /* paused: green, an invitation to start again */
        .stage-play[aria-pressed="false"] {
            border-color: #6ee7b7;
            background: linear-gradient(135deg, #059669, #10b981);
            box-shadow: 0 6px 22px rgba(16,185,129,0.4);
        }
        .stage-speed {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 16px;
            border-radius: 999px;
            background: #0e1a2b;
            border: 1px solid #1a2840;
            cursor: pointer;
        }
        .stage-speed-end { font-size: 1.15rem; }
        .stage-speed input {
            width: 170px;
            accent-color: #818cf8;
            cursor: pointer;
        }
        .stage-speed-out {
            min-width: 7.5em;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
        }
        .stage-speed.off { opacity: 0.55; }
        .stage-pills {
            flex: 1;
            min-width: 0;
            display: flex;
            gap: 4px;
            padding: 4px;
            overflow-x: auto;
            scrollbar-width: none;
            background: #0e1a2b;
            border: 1px solid #1a2840;
            border-radius: 999px;
        }
        .stage-pills::-webkit-scrollbar { display: none; }
        .stage-pill {
            flex-shrink: 0;
            white-space: nowrap;
            border: none;
            border-radius: 999px;
            padding: 7px 14px;
            background: transparent;
            color: #94a3b8;
            font: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.18s, color 0.18s;
        }
        .stage-pill:hover { color: #f1f5f9; }
        .stage-pill[aria-current="true"] {
            background: #1e2b45;
            color: #fff;
            box-shadow: 0 1px 6px rgba(0,0,0,0.4);
        }
        .stage-count {
            font-size: 0.85rem;
            color: #64748b;
        }
        .stage-count b { color: #cbd5e1; }

        @media (prefers-reduced-motion: reduce) {
            .stage-inner { transition: none; }
            .stage-arrow { animation: none; }
        }
        @media (max-width: 520px) {
            .stage { --sw: calc(100vw - 24px); margin-bottom: 40px; }
            .stage-face { border-radius: 12px; }
            .stage-cap { padding: 9px 12px; gap: 9px; }
            .stage-icon { font-size: 1.3rem; }
            .stage-name { font-size: 0.95rem; }
            .stage-lead { display: none; }
            .stage-open { padding: 7px 13px; font-size: 0.8rem; }
            .stage-arrow { --aw: 46px; height: 56px; border-radius: 14px; }
            .stage-arrow svg { width: 26px; height: 26px; }
            .stage-play { height: 46px; padding: 0 20px 0 16px; }
            .stage-speed input { width: 110px; }
        }

        /* ── Live projects gallery ── */
        .try-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 14px;
        }

        .try-card {
            display: flex;
            flex-direction: column;
            background: #0e1a2b;
            border: 1px solid #1a2840;
            border-radius: 14px;
            overflow: hidden;
            text-decoration: none;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .try-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent, #818cf8);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .try-shot {
            display: block;
            aspect-ratio: 16 / 10;
            background: var(--icon-bg, #131e2e);
            border-bottom: 1px solid #1a2840;
            overflow: hidden;
        }
        .try-shot img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .try-card:hover .try-shot img { transform: scale(1.04); }
        .try-noshot {
            display: flex; align-items: center; justify-content: center;
            height: 100%;
            font-size: 2.4rem;
        }

        .try-info {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
        }
        .try-icon { font-size: 1rem; flex-shrink: 0; }
        .try-text { flex: 1; min-width: 0; line-height: 1.3; }
        .try-name { display: block; font-size: 0.86rem; font-weight: 700; color: #f1f5f9; }
        .try-sub { display: block; font-size: 0.7rem; color: #64748b; }
        .try-go {
            flex-shrink: 0;
            width: 26px; height: 26px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem;
            color: #fff;
            background: linear-gradient(135deg, #059669, #10b981);
            box-shadow: 0 0 12px rgba(16,185,129,0.3);
        }

        /* Phones: two small cards per row instead of one tall column */
        @media (max-width: 520px) {
            .try-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
            .try-info { padding: 8px 9px; gap: 6px; }
            .try-name { font-size: 0.78rem; }
            .try-sub { font-size: 0.64rem; }
            .try-go { display: none; }
        }

        /* Floating "back to contents" button */
        .to-toc {
            position: fixed;
            bottom: 20px;
            inset-inline-start: 20px;
            z-index: 5;
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: #131e2e;
            border: 1px solid #1e2e42;
            color: #c084fc;
            font-size: 1.1rem;
            text-decoration: none;
            box-shadow: 0 4px 18px rgba(0,0,0,0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .to-toc.show { opacity: 1; pointer-events: auto; }

        /* Card reached from the table of contents */
        .project-card, .section-header { scroll-margin-top: 16px; }
        .project-card:target {
            border-color: var(--accent, #818cf8);
            animation: target-glow 2s ease-out;
        }
        @keyframes target-glow {
            0%, 40% { box-shadow: 0 0 0 3px var(--accent, #818cf8), 0 8px 32px rgba(0,0,0,0.4); }
            100% { box-shadow: 0 0 0 0 transparent; }
        }

        /* ── Section headers ── */
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 44px 0 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid #1e293b;
        }

        .section-emoji { font-size: 1.3rem; }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .section-count {
            font-size: 0.72rem;
            color: #475569;
            background: #131e2e;
            padding: 2px 10px;
            border-radius: 20px;
            margin-inline-start: auto;
        }

        /* ── Project grid ── */
        .projects { display: grid; gap: 14px; }

        .projects-mini {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }

        /* ── Project card ── */
        .project-card {
            background: #0e1a2b;
            border: 1px solid #1a2840;
            border-radius: 16px;
            padding: 20px 22px;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            align-items: start;
        }

        .project-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent, #818cf8);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        /* Small cards (3D section) have no illustration column */
        .card-small {
            grid-template-columns: 1fr;
        }

        /* ── Card internals ── */
        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        .card-icon {
            width: 42px; height: 42px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem;
            flex-shrink: 0;
            background: var(--icon-bg, rgba(30,50,90,0.6));
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
            line-height: 1.3;
            margin-bottom: 5px;
        }

        /* Badges */
        .live-badge {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 0.62rem; font-weight: 700;
            padding: 2px 8px; border-radius: 20px;
            background: rgba(74,222,128,0.12);
            color: #4ade80;
            border: 1px solid rgba(74,222,128,0.3);
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .live-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: #4ade80;
            animation: blink 1.5s ease-in-out infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

        .wip-badge {
            display: inline-flex; align-items: center; gap: 3px;
            font-size: 0.62rem; font-weight: 600;
            padding: 2px 8px; border-radius: 20px;
            background: rgba(251,191,36,0.1);
            color: #fbbf24;
            border: 1px solid rgba(251,191,36,0.2);
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        .card-tags {
            display: flex; flex-wrap: wrap; gap: 5px;
        }

        .tag {
            font-size: 0.65rem; font-weight: 500;

<script>
// Stage: roll the prism one face per step. Three faces, many projects, so the
// face about to swing in gets the target project's screenshot first. Next
// arrives from the left, which is "forward" on a right-to-left page.
// stats.json (visits per project, written at deploy time by analytics.py) is
// fetched once here and shared: the stage orders by it, the stats section shows it.
window.vcStats = window.fetch ? fetch('projects_page/stats.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw r; return r.json(); }) : null;
(function () {
    var stage = document.getElementById('stage');
    if (!stage) return;
    var slides = JSON.parse(document.getElementById('stage-data').textContent);
    var inner = stage.querySelector('.stage-inner');
    var faces = Array.prototype.slice.call(stage.querySelectorAll('.stage-face'));
    var pills = Array.prototype.slice.call(stage.querySelectorAll('.stage-pill'));
    var strip = stage.querySelector('.stage-pills');
    var count = stage.querySelector('.stage-count b');
    var playBtn = stage.querySelector('.stage-play');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var SPEEDS = [15, 12, 10, 8, 6.5, 5, 4, 3, 2.5];  // seconds per project, slow to fast
    var DWELL = 6500, ROLL = reduce ? 0 : 900;
    var slider = stage.querySelector('.stage-speed input');
    var speedOut = stage.querySelector('.stage-speed-out');
    var n = slides.length, idx = 0, front = 0, rot = 0, busy = false;
    var playing = !reduce, hold = false, visible = true, timer = null;

    function fill(k, s) {
        var face = faces[k];
        face.className = 'stage-face stage-face-' + k + ' ' + s.theme;
        face.href = s.href;
        if (s.ext) { face.target = '_blank'; face.rel = 'noopener'; }
        else { face.removeAttribute('target'); face.removeAttribute('rel'); }
        var img = face.querySelector('img');
        img.src = s.img;
        img.alt = 'צילום מסך של ' + s.name;
        face.querySelector('.stage-icon').textContent = s.icon;
        var name = face.querySelector('.stage-name');
        name.textContent = s.name + ' ';
        if (s.sub) {
            var small = document.createElement('small');
            small.textContent = s.sub;
            name.appendChild(small);
        }
        face.querySelector('.stage-lead').textContent = s.lead;
        return img;
    }

    function preload(i) { new Image().src = slides[(i + n) % n].img; }

    function mark(scroll) {
        pills.forEach(function (p, i) {
            if (i === idx) p.setAttribute('aria-current', 'true');
            else p.removeAttribute('aria-current');
        });
        faces.forEach(function (f, k) {
            f.tabIndex = k === front ? 0 : -1;
            if (k === front) f.removeAttribute('aria-hidden');
            else f.setAttribute('aria-hidden', 'true');
        });
        count.textContent = idx + 1;
        if (!scroll) return;
        // scroll only the strip, never the page: autoplay runs while the
        // reader may be further down
        var pr = pills[idx].getBoundingClientRect(), sr = strip.getBoundingClientRect();
        strip.scrollBy({ left: pr.left + pr.width / 2 - (sr.left + sr.width / 2), behavior: reduce ? 'auto' : 'smooth' });
    }

    function go(j, dir) {
        j = (j + n) % n;
        if (j === idx || busy) return;
        if (!dir) dir = j > idx ? 1 : -1;
        var k = (front + dir + 3) % 3;
        var img = fill(k, slides[j]);
        busy = true;
        // wait (briefly) for the picture, so the face does not roll in empty
        var ready = img.decode ? img.decode() : Promise.resolve();
        Promise.race([ready, new Promise(function (r) { setTimeout(r, 600); })])
            .catch(function () {})
            .then(function () {
                rot -= dir * 120;
                inner.style.setProperty('--rot', rot + 'deg');
                front = k; idx = j;
                mark(true);
                preload(j + 1); preload(j - 1);
                setTimeout(function () { busy = false; }, ROLL);
            });
    }

    function schedule() {
        clearTimeout(timer);
        if (playing && !hold && visible && !document.hidden)
            timer = setTimeout(function () { go(idx + 1, 1); schedule(); }, DWELL);
    }
    function step(dir) { go(idx + dir, dir); schedule(); }

    function setPlaying(on) {
        playing = on;
        playBtn.querySelector('.stage-play-icon').textContent = on ? '❚❚' : '▶';
        playBtn.querySelector('.stage-play-text').textContent = on ? 'עצור' : 'הפעל';
        playBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
        playBtn.setAttribute('aria-label', on ? 'עצור החלפה אוטומטית' : 'הפעל החלפה אוטומטית');
        slider.parentNode.classList.toggle('off', !on);
        schedule();
    }

    stage.querySelector('.stage-next').addEventListener('click', function () { step(1); });
    stage.querySelector('.stage-prev').addEventListener('click', function () { step(-1); });
    playBtn.addEventListener('click', function () { setPlaying(!playing); });

    // speed: remembered per browser; failing storage just means the default
    function setSpeed(i, save) {
        i = Math.max(0, Math.min(SPEEDS.length - 1, i | 0));
        slider.value = i;
        DWELL = SPEEDS[i] * 1000;
        speedOut.textContent = 'כל ' + SPEEDS[i] + ' שניות';
        slider.setAttribute('aria-valuetext', speedOut.textContent);
        if (save) { try { localStorage.setItem('stage-speed', i); } catch (e) {} }
    }
    try { var saved = localStorage.getItem('stage-speed'); } catch (e) {}
    setSpeed(saved === null || saved === undefined ? 4 : +saved, false);
    slider.addEventListener('input', function () {
        setSpeed(+slider.value, true);
        if (!playing) setPlaying(true); else schedule();
    });
    pills.forEach(function (p) {
        p.addEventListener('click', function () { go(pills.indexOf(p)); schedule(); });
    });

    // Pinned projects ("pin", from stage_first/stage_second) stay in front;
    // the rest follow by views in the last 30 days, ties keeping build order.
    // The build already sorted by its own copy of the stats; this catches up
    // with the deploy's fresher one without moving the slide on screen.
    function resort(apps) {
        var cur = slides[idx];
        var views = function (s) { var a = apps[s.anchor]; return a ? a[1] || 0 : 0; };
        var rest = slides.filter(function (s) { return !s.pin; })
            .map(function (s, i) { return [s, i]; })
            .sort(function (a, b) { return views(b[0]) - views(a[0]) || a[1] - b[1]; })
            .map(function (x) { return x[0]; });
        var order = slides.filter(function (s) { return s.pin; }).concat(rest);
        pills = order.map(function (s) { return pills[slides.indexOf(s)]; });
        pills.forEach(function (p, i) { p.dataset.i = i; strip.appendChild(p); });
        slides = order;
        idx = slides.indexOf(cur);
        mark(false);
        preload(idx + 1); preload(idx - 1);
    }
    if (window.vcStats) window.vcStats.then(function (s) { resort(s.apps || {}); }).catch(function () {});
    stage.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') { step(1); e.preventDefault(); }
        else if (e.key === 'ArrowLeft') { step(-1); e.preventDefault(); }
    });

    // swipe: dragging the picture to the left brings in the next one from
    // the right, the way the roll goes
    var flip = stage.querySelector('.stage-flip'), x0 = null, y0 = 0, dragged = false;
    flip.addEventListener('pointerdown', function (e) { x0 = e.clientX; y0 = e.clientY; dragged = false; });
    flip.addEventListener('pointerup', function (e) {
        if (x0 === null) return;
        var dx = e.clientX - x0, dy = e.clientY - y0;
        x0 = null;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { dragged = true; step(dx < 0 ? 1 : -1); }
    });
    flip.addEventListener('dragstart', function (e) { e.preventDefault(); });
    faces.forEach(function (f) {
        f.addEventListener('click', function (e) { if (dragged) { e.preventDefault(); dragged = false; } });
    });

    // hold still while the reader works the controls. Not on hovering the
    // picture: it fills most of the screen, so the mouse is nearly always on it
    var nav = stage.querySelector('.stage-nav');
    nav.addEventListener('mouseenter', function () { hold = true; schedule(); });
    nav.addEventListener('mouseleave', function () { hold = false; schedule(); });
    // keyboard focus holds it too, but not a mouse click (the clicked button
    // keeps focus) and not the autoplay controls, which would pause it the
    // moment someone presses play
    stage.addEventListener('focusin', function (e) {
        var t = e.target;
        hold = !t.closest('.stage-auto') && (!t.matches || t.matches(':focus-visible'));
        schedule();
    });
    stage.addEventListener('focusout', function (e) {
        if (!stage.contains(e.relatedTarget)) { hold = false; schedule(); }
    });
    document.addEventListener('visibilitychange', schedule);
    if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (es) {
            visible = es[0].isIntersecting; schedule();
        }, { threshold: 0.4 }).observe(stage);
    }

    mark(false);
    preload(1); preload(-1);
    setPlaying(playing);
})();
</script>
<script>
// Table of contents: each column cycles page order → א–ת → ת–א.
// The chosen order is remembered per browser; failing storage is harmless.
(function () {
    var MODES = ['page', 'az', 'za'];
    var LABELS = { page: 'סדר הדף', az: 'א–ת ↓', za: 'ת–א ↑' };
    var collator = new Intl.Collator(['he', 'en'], { numeric: true, sensitivity: 'base' });
    var cols = Array.prototype.slice.call(document.querySelectorAll('.toc-col'));
    var allBtn = document.querySelector('.toc-sort-all');

    function nameOf(li) { return li.querySelector('.toc-name').textContent.trim(); }

    function apply(col, mode) {
        var list = col.querySelector('.toc-list');
        var items = Array.prototype.slice.call(list.children);
        items.sort(function (a, b) {
            if (mode === 'page') return a.dataset.i - b.dataset.i;
            var c = collator.compare(nameOf(a), nameOf(b));
            return mode === 'az' ? c : -c;
        });
        items.forEach(function (li) { list.appendChild(li); });
        col.dataset.mode = mode;
        var btn = col.querySelector('.toc-sort');
        btn.textContent = LABELS[mode];
        btn.classList.toggle('sorted', mode !== 'page');
    }

    function save() {
        try {
            localStorage.setItem('toc-sort', JSON.stringify(cols.map(function (c) { return c.dataset.mode; })));
        } catch (e) {}
    }

    function syncAllBtn() {
        var allAz = cols.every(function (c) { return c.dataset.mode === 'az'; });
        allBtn.textContent = allAz ? 'חזרה לסדר הדף' : 'מיין הכל א–ת';
    }

    var saved = [];
    try { saved = JSON.parse(localStorage.getItem('toc-sort')) || []; } catch (e) {}
    cols.forEach(function (col, i) {
        apply(col, MODES.indexOf(saved[i]) >= 0 ? saved[i] : 'page');
        col.querySelector('.toc-sort').addEventListener('click', function () {
            apply(col, MODES[(MODES.indexOf(col.dataset.mode) + 1) % MODES.length]);
            syncAllBtn();
            save();
        });
    });
    syncAllBtn();

    allBtn.addEventListener('click', function () {
        var allAz = cols.every(function (c) { return c.dataset.mode === 'az'; });
        cols.forEach(function (c) { apply(c, allAz ? 'page' : 'az'); });
        syncAllBtn();
        save();
    });

    // Show the "back to contents" button once the table has scrolled away
    var toc = document.getElementById('toc');
    var back = document.querySelector('.to-toc');
    if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (entries) {
            back.classList.toggle('show', !entries[0].isIntersecting);
        }).observe(toc);
    }
})();
</script>
<script>
// Views explorer. stats.json is written at deploy time by analytics.py, with a
// "daily" block: one array per project, a value per day since tracking began.
// The reader picks projects (rows of the table double as the legend), a range
// (presets or the brush on the navigator) and how to show it; everything is
// recomputed from the daily arrays. Without the file the section stays hidden.
(function () {
    var box = document.getElementById('stats');
    if (!box || !window.vcStats) return;
    var meta = JSON.parse(document.getElementById('stats-meta').textContent);
    var SVGNS = 'http://www.w3.org/2000/svg';
    // categorical slots, dark steps; a project keeps its slot while selected
    var COLORS = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#0ca30c', '#9085e9', '#e66767'];
    var MAXSEL = COLORS.length, TOP = 10;
    var fmt = new Intl.NumberFormat('he-IL');
    var DAYS = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
    var $ = function (s) { return box.querySelector(s); };
    var chartEl = $('.stats-chart'), navEl = $('.stats-nav'), tip = $('.stats-tip');
    var rowsEl = $('.stats-rows'), moreBtn = $('.stats-more'), toast = $('.stats-toast');

    var D, N, ANCH, SITE, USERS;   // dates, day count, projects with data, all views per day, visitors per day
    var st = { sel: null, slot: {}, i0: 0, i1: 0, preset: '30', gran: 'd', mode: 'v', log: false };
    var open = false, hover = null, geo = null;

    function load() {
        try {
            var s = JSON.parse(localStorage.getItem('stats-view') || '{}');
            ['sel', 'slot', 'preset', 'gran', 'mode', 'log'].forEach(function (k) { if (k in s) st[k] = s[k]; });
        } catch (e) {}
    }
    function save() {
        try {
            localStorage.setItem('stats-view', JSON.stringify({
                sel: st.sel, slot: st.slot, preset: st.preset, gran: st.gran, mode: st.mode, log: st.log }));
        } catch (e) {}
    }
    function el(tag, attrs, parent) {
        var e = document.createElementNS(SVGNS, tag);
        for (var k in attrs) e.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(e);
        return e;
    }
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
    function day(i) { var p = D[i].split('-'); return new Date(+p[0], p[1] - 1, +p[2]); }
    function dm(i) { var d = day(i); return d.getDate() + '.' + (d.getMonth() + 1); }
    function sum(a, i0, i1) { var t = 0; for (var i = i0; i <= i1; i++) t += a[i] || 0; return t; }
    function color(a) { return COLORS[st.slot[a]]; }

    // ── range ──
    function applyPreset(p) {
        st.preset = p;
        st.i1 = N - 1;
        st.i0 = p === 'all' ? 0 : Math.max(0, N - +p);
    }

    // buckets of day indices inside the window: one per day, or per week
    // (Sunday to Saturday, the Israeli week), clipped to the window
    function buckets() {
        var out = [];
        for (var i = st.i0; i <= st.i1; i++) {
            if (st.gran === 'w' && out.length && day(i).getDay() !== 0) out[out.length - 1].b = i;
            else out.push({ a: i, b: i });
        }
        return out;
    }
    function series(arr, bs) {
        var acc = 0;
        return bs.map(function (k) {
            var v = sum(arr, k.a, k.b);
            if (st.mode === 'c') { acc += v; return acc; }
            return v;
        });
    }

    // ── y scale ──
    function niceStep(max, n) {
        var raw = max / n, p = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / p;
        return (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * p;
    }
    function yscale(max, h) {
        if (st.log) {
            var top = Math.log10(1 + Math.max(max, 9));
            var ticks = [0];
            for (var t = 1; t <= max * 1.0001 || ticks.length < 2; t *= 10) ticks.push(t);
            top = Math.max(top, Math.log10(1 + ticks[ticks.length - 1]));
            return { f: function (v) { return h - Math.log10(1 + v) / top * h; }, ticks: ticks };
        }
        var step = niceStep(Math.max(max, 4), 4), top2 = Math.ceil(Math.max(max, 1) / step) * step, tk = [];
        for (var v = 0; v <= top2 + 1e-9; v += step) tk.push(Math.round(v * 100) / 100);
        return { f: function (v) { return h - v / top2 * h; }, ticks: tk };
    }
    function short(v) { return v >= 10000 ? Math.round(v / 1000) + 'K' : v >= 1000 ? (v / 1000).toFixed(1).replace('.0', '') + 'K' : String(v); }

    // ── main chart ──
    function drawChart() {
        var W = chartEl.clientWidth || 600, narrow = W < 560;
        var H = narrow ? 230 : 300;
        var sel = st.sel.filter(function (a) { return SERIES[a]; });
        var labels = sel.length && sel.length <= 4 && !narrow;
        var m = { l: 40, r: labels ? 104 : 14, t: 12, b: 26 }, w = W - m.l - m.r, h = H - m.t - m.b;
        var bs = buckets(), n = bs.length;
        var data = sel.map(function (a) { return { a: a, v: series(SERIES[a], bs) }; });
        var max = 0;
        data.forEach(function (d) { d.v.forEach(function (v) { if (v > max) max = v; }); });
        var y = yscale(max, h);
        var x = function (k) { return n === 1 ? w / 2 : k / (n - 1) * w; };
        var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, height: H, role: 'img',
            'aria-label': 'צפיות לאורך זמן בפרויקטים שנבחרו' });
        var g = el('g', { transform: 'translate(' + m.l + ',' + m.t + ')' }, svg);
        y.ticks.forEach(function (t) {
            var yy = y.f(t);
            el('line', { x1: 0, x2: w, y1: yy, y2: yy, stroke: t === 0 ? '#2a3b5c' : '#15233a', 'stroke-width': 1 }, g);
            el('text', { x: -8, y: yy + 4, 'text-anchor': 'end' }, g).textContent = short(t);
        });
        // x labels: as many as fit, always the last
        var every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(w / 58))));
        for (var k = 0; k < n; k++) {
            if ((n - 1 - k) % every) continue;
            el('text', { x: x(k), y: h + 18, 'text-anchor': n === 1 ? 'middle' : k === 0 ? 'start' : k === n - 1 ? 'end' : 'middle' }, g)
                .textContent = st.gran === 'w' ? dm(bs[k].a) + '–' + dm(bs[k].b) : dm(bs[k].a);
        }
        // today is still running: its point is drawn dashed
        var partial = bs[n - 1].b === N - 1;
        data.forEach(function (d) {
            var c = color(d.a), pts = d.v.map(function (v, k) { return [x(k), y.f(v)]; });
            var line = function (p) { return 'M' + p.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join('L'); };
            if (n === 1) {
                el('circle', { cx: pts[0][0], cy: pts[0][1], r: 4.5, fill: c, stroke: '#0c1726', 'stroke-width': 2 }, g);
                return;
            }
            if (sel.length === 1) {
                var area = line(pts) + 'L' + x(n - 1) + ',' + h + 'L0,' + h + 'Z';
                var gid = 'sg-' + d.a.replace(/[^a-z0-9]/gi, '');
                var grad = el('linearGradient', { id: gid, x1: 0, y1: 0, x2: 0, y2: 1 }, el('defs', {}, svg));
                el('stop', { offset: 0, 'stop-color': c, 'stop-opacity': 0.32 }, grad);
                el('stop', { offset: 1, 'stop-color': c, 'stop-opacity': 0 }, grad);
                el('path', { d: area, fill: 'url(#' + gid + ')' }, g);
            }
            var solid = partial ? pts.slice(0, n - 1) : pts;
            if (solid.length > 1) el('path', { d: line(solid), fill: 'none', stroke: c, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g);
            if (partial) el('path', { d: line(pts.slice(n - 2)), fill: 'none', stroke: c, 'stroke-width': 2, 'stroke-dasharray': '3 4', 'stroke-linecap': 'round' }, g);
        });
        // direct labels at the line ends, nudged apart so they never overlap
        if (labels && n > 1) {
            var ends = data.map(function (d) { return { d: d, y: y.f(d.v[n - 1]) }; }).sort(function (a, b) { return a.y - b.y; });
            for (var i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
            var over = ends.length ? ends[ends.length - 1].y - h : 0;
            if (over > 0) ends.forEach(function (e) { e.y -= over; });
            ends.forEach(function (e) {
                var mt = meta[e.d.a];
                el('circle', { cx: w + 8, cy: e.y, r: 3.5, fill: color(e.d.a) }, g);
                var t = el('text', { x: w + 15, y: e.y + 4, class: 'end-label' }, g);
                t.textContent = mt.name.length > 12 ? mt.name.slice(0, 11) + '…' : mt.name;
            });
        }
        var cross = el('g', { class: 'cross', visibility: 'hidden' }, g);
        el('line', { y1: 0, y2: h, stroke: '#64748b', 'stroke-width': 1, 'stroke-dasharray': '2 3' }, cross);
        data.forEach(function (d) { el('circle', { r: 4.5, fill: color(d.a), stroke: '#0c1726', 'stroke-width': 2, 'data-a': d.a }, cross); });
        el('rect', { x: -m.l, y: -m.t, width: W, height: H, fill: 'transparent', class: 'hit' }, g);
        chartEl.querySelector('svg') ? chartEl.replaceChild(svg, chartEl.querySelector('svg')) : chartEl.insertBefore(svg, tip);
        geo = { svg: svg, m: m, w: w, n: n, x: x, y: y, bs: bs, data: data, cross: cross, W: W };
        var empty = chartEl.querySelector('.stats-empty-chart');
        empty.hidden = sel.length > 0;
        if (hover !== null) showTip(Math.min(hover, n - 1)); else tip.hidden = true;
    }

    function showTip(k) {
        if (!geo || !geo.data.length) { tip.hidden = true; return; }
        hover = k;
        var px = geo.x(k);
        geo.cross.setAttribute('visibility', 'visible');
        geo.cross.querySelector('line').setAttribute('x1', px);
        geo.cross.querySelector('line').setAttribute('x2', px);
        geo.data.forEach(function (d) {
            var c = geo.cross.querySelector('circle[data-a="' + d.a + '"]');
            c.setAttribute('cx', px); c.setAttribute('cy', geo.y.f(d.v[k]));
        });
        var b = geo.bs[k], d0 = day(b.a);
        var head = st.gran === 'w' ? 'שבוע ' + dm(b.a) + '–' + dm(b.b) : 'יום ' + DAYS[d0.getDay()] + ', ' + dm(b.a);
        if (b.b === N - 1) head += ' (עד עכשיו)';
        if (st.mode === 'c') head += ' · מצטבר';
        var rows = geo.data.slice().sort(function (p, q) { return q.v[k] - p.v[k]; });
        tip.innerHTML = '<div class="stats-tip-date">' + head + '</div>' + rows.map(function (d) {
            return '<div class="stats-tip-row"><span class="stats-sw" style="--c:' + color(d.a) + '"></span>' +
                '<span>' + meta[d.a].icon + ' ' + esc(meta[d.a].name) + '</span><b>' + fmt.format(d.v[k]) + '</b></div>';
        }).join('');
        tip.hidden = false;
        var sx = geo.svg.getBoundingClientRect().width / geo.W, left = (geo.m.l + px) * sx;
        var tw = tip.offsetWidth, cw = chartEl.clientWidth;
        tip.style.left = Math.max(0, Math.min(cw - tw, left > cw / 2 ? left - tw - 14 : left + 14)) + 'px';
    }
    function hideTip() {
        hover = null;
        tip.hidden = true;
        if (geo) geo.cross.setAttribute('visibility', 'hidden');
    }
    function pointK(e) {
        var r = geo.svg.getBoundingClientRect(), sx = geo.W / r.width;
        var px = (e.clientX - r.left) * sx - geo.m.l;
        return geo.n === 1 ? 0 : Math.max(0, Math.min(geo.n - 1, Math.round(px / geo.w * (geo.n - 1))));
    }
    chartEl.addEventListener('pointermove', function (e) { if (geo) showTip(pointK(e)); });
    chartEl.addEventListener('pointerdown', function (e) { if (geo) showTip(pointK(e)); });
    chartEl.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') hideTip(); });
    chartEl.addEventListener('keydown', function (e) {
        if (!geo) return;
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
            var k = hover === null ? geo.n - 1 : hover + (e.key === 'ArrowRight' ? 1 : -1);
            showTip(Math.max(0, Math.min(geo.n - 1, k)));
            e.preventDefault();
        } else if (e.key === 'Escape') hideTip();
    });
    chartEl.addEventListener('blur', hideTip);

    // ── navigator: all site views per day, with a brush for the window ──
    var nav = null, drag = null;
    function drawNav() {
        var W = navEl.clientWidth || 600, H = 46, m = { l: 40, r: 14 }, w = W - m.l - m.r;
        var max = Math.max.apply(null, SITE.concat([1]));
        var x = function (i) { return N === 1 ? w / 2 : i / (N - 1) * w; };
        var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + (H + 14), height: H + 14 });
        var g = el('g', { transform: 'translate(' + m.l + ',0)' }, svg);
        var pts = SITE.map(function (v, i) { return x(i).toFixed(1) + ',' + (H - v / max * (H - 4)).toFixed(1); });
        el('path', { d: 'M0,' + H + 'L' + pts.join('L') + 'L' + x(N - 1) + ',' + H + 'Z', fill: 'rgba(129,140,248,0.16)' }, g);
        el('path', { d: 'M' + pts.join('L'), fill: 'none', stroke: '#6366f1', 'stroke-width': 1.25 }, g);
        el('line', { x1: 0, x2: w, y1: H, y2: H, stroke: '#2a3b5c' }, g);
        el('text', { x: 0, y: H + 12, 'text-anchor': 'start' }, g).textContent = dm(0);
        el('text', { x: w, y: H + 12, 'text-anchor': 'end' }, g).textContent = dm(N - 1);
        // the window spans whole days: from the start of i0 to the end of i1
        var half = N > 1 ? w / (N - 1) / 2 : w / 2;
        var bx0 = Math.max(0, x(st.i0) - half), bx1 = Math.min(w, x(st.i1) + half);
        el('rect', { x: -m.l, y: 0, width: m.l, height: H, fill: 'transparent' }, g);
        el('rect', { x: 0, y: 0, width: bx0, height: H, fill: 'rgba(9,17,31,0.55)' }, g);
        el('rect', { x: bx1, y: 0, width: w - bx1, height: H, fill: 'rgba(9,17,31,0.55)' }, g);
        el('rect', { x: bx0, y: 0, width: bx1 - bx0, height: H, rx: 4, class: 'brush', 'data-h': 'move' }, g);
        [bx0, bx1].forEach(function (hx, j) {
            el('rect', { x: hx - 5, y: H / 2 - 13, width: 10, height: 26, rx: 4, class: 'handle', 'data-h': j ? 'b' : 'a' }, g);
        });
        navEl.innerHTML = '';
        navEl.appendChild(svg);
        nav = { svg: svg, m: m, w: w, W: W };
    }
    function navDay(e) {
        var r = nav.svg.getBoundingClientRect(), px = (e.clientX - r.left) * nav.W / r.width - nav.m.l;
        return Math.max(0, Math.min(N - 1, Math.round(px / nav.w * (N - 1))));
    }
    navEl.addEventListener('pointerdown', function (e) {
        if (!nav || N < 2) return;
        var h = e.target.getAttribute && e.target.getAttribute('data-h'), d = navDay(e);
        drag = { h: h || 'new', d0: d, i0: st.i0, i1: st.i1 };
        navEl.setPointerCapture(e.pointerId);
        if (!h) setWindow(d, d);
        e.preventDefault();
    });
    navEl.addEventListener('pointermove', function (e) {
        if (!drag) return;
        var d = navDay(e), dd = d - drag.d0;
        if (drag.h === 'move') {
            dd = Math.max(-drag.i0, Math.min(N - 1 - drag.i1, dd));
            setWindow(drag.i0 + dd, drag.i1 + dd);
        } else if (drag.h === 'a') setWindow(Math.min(d, drag.i1 - 1), drag.i1);
        else if (drag.h === 'b') setWindow(drag.i0, Math.max(d, drag.i0 + 1));
        else setWindow(Math.min(drag.d0, d), Math.max(drag.d0, d));
    });
    function endDrag() {
        if (!drag) return;
        drag = null;
        if (st.i1 - st.i0 < 1) setWindow(Math.max(0, st.i1 - 1), Math.max(st.i1, 1));
    }
    navEl.addEventListener('pointerup', endDrag);
    navEl.addEventListener('pointercancel', endDrag);
    function setWindow(a, b) {
        if (a === st.i0 && b === st.i1) return;
        st.i0 = a; st.i1 = b;
        // a window that still matches a preset keeps its button lit
        st.preset = b === N - 1 ? (a === 0 ? 'all' : ['7', '14', '30'].filter(function (p) { return N - +p === a; })[0] || null) : null;
        render();
    }

    // ── KPIs ──
    function kpis() {
        var len = st.i1 - st.i0 + 1, views = sum(SITE, st.i0, st.i1);
        var users = sum(USERS, st.i0, st.i1) / len;
        var peak = st.i0;
        for (var i = st.i0; i <= st.i1; i++) if (SITE[i] > SITE[peak]) peak = i;
        $('[data-k="views"]').textContent = fmt.format(views);
        $('[data-k="views-sub"]').textContent = fmt.format(Math.round(views / len)) + ' ביום בממוצע';
        $('[data-k="users"]').textContent = fmt.format(Math.round(users));
        $('[data-k="users-sub"]').textContent = 'מבקרים שונים ביום, בממוצע';
        $('[data-k="peak"]').textContent = fmt.format(SITE[peak]);
        var top = ANCH.slice().sort(function (a, b) { return SERIES[b][peak] - SERIES[a][peak]; })[0];
        $('[data-k="peak-sub"]').textContent = 'ב-' + dm(peak) + (top && SERIES[top][peak] ? ', בעיקר ' + meta[top].name : '');
        var c = $('[data-k="chg"]'), cs = $('[data-k="chg-sub"]');
        if (st.i0 - len >= 0) {
            var prev = sum(SITE, st.i0 - len, st.i0 - 1);
            c.innerHTML = change(views, prev);
            cs.textContent = 'מול ' + len + ' הימים שלפני (' + fmt.format(prev) + ')';
        } else {
            c.innerHTML = '<span>—</span>';
            cs.textContent = 'אין עוד תקופה קודמת להשוואה';
        }
    }
    function change(now, prev) {
        if (!prev) return now ? '<span class="stats-up">חדש</span>' : '<span>—</span>';
        var p = Math.round((now - prev) / prev * 100);
        return '<span class="' + (p > 0 ? 'stats-up' : p < 0 ? 'stats-down' : '') + '">' +
            (p > 0 ? '▲ ' : p < 0 ? '▼ ' : '') + fmt.format(Math.abs(p)) + '%</span>';
    }

    // ── table: ranking for the window, and the picker for the chart ──
    function spark(arr) {
        var a = arr.slice(st.i0, st.i1 + 1), mx = Math.max.apply(null, a.concat([1])), n = a.length;
        var pts = a.map(function (v, i) {
            return (n === 1 ? 48 : i / (n - 1) * 94 + 1).toFixed(1) + ',' + (22 - v / mx * 20).toFixed(1);
        });
        return pts.join(' ');
    }
    function drawTable() {
        var len = st.i1 - st.i0 + 1;
        var rows = ANCH.map(function (a) {
            return { a: a, v: sum(SERIES[a], st.i0, st.i1), p: st.i0 - len >= 0 ? sum(SERIES[a], st.i0 - len, st.i0 - 1) : null };
        }).sort(function (p, q) { return q.v - p.v || q.p - p.p; });
        var active = rows.filter(function (r) { return r.v > 0 || st.sel.indexOf(r.a) >= 0; });
        var shown = open ? rows : active.slice(0, TOP);
        st.sel.forEach(function (a) {   // a selected project is always visible in the table
            if (!shown.some(function (r) { return r.a === a; })) shown.push(rows.filter(function (r) { return r.a === a; })[0]);
        });
        rowsEl.innerHTML = shown.map(function (r, i) {
            var mt = meta[r.a], on = st.sel.indexOf(r.a) >= 0, c = on ? color(r.a) : '#475569';
            return '<li class="stats-row" role="button" tabindex="0" aria-pressed="' + on + '" data-a="' + esc(r.a) + '" style="--c:' + c + '">' +
                '<span class="stats-check">' + (on ? '✓' : '') + '</span>' +
                '<span class="stats-icon">' + mt.icon + '</span>' +
                '<span class="stats-name"><span>' + esc(mt.name) + (mt.sub ? ' <small>' + esc(mt.sub) + '</small>' : '') + '</span>' +
                '<a href="#' + esc(r.a) + '" title="לכרטיס של הפרויקט" aria-label="לכרטיס של ' + esc(mt.name) + '">↗</a></span>' +
                '<svg class="stats-spark" viewBox="0 0 96 24" aria-hidden="true"><polyline points="' + spark(SERIES[r.a]) +
                '" fill="none" stroke="' + c + '" stroke-width="1.5" stroke-linejoin="round"/></svg>' +
                '<span class="stats-num">' + fmt.format(r.v) + '</span>' +
                '<span class="stats-chg">' + (r.p === null ? '—' : change(r.v, r.p)) + '</span></li>';
        }).join('');
        var rest = rows.length - shown.length;
        moreBtn.hidden = !open && rest <= 0;
        moreBtn.textContent = open ? 'הצג רק את הפעילים' : 'עוד ' + rest + ' פרויקטים';
        $('.stats-table-sum').textContent = 'צפיות ב-' + len + (len === 1 ? ' יום' : ' ימים') + ' · לחיצה על שורה מוסיפה או מורידה מהגרף';
    }
    function toggle(a) {
        var i = st.sel.indexOf(a);
        if (i >= 0) { st.sel.splice(i, 1); delete st.slot[a]; }
        else {
            if (st.sel.length >= MAXSEL) {
                toast.textContent = 'עד ' + MAXSEL + ' פרויקטים בגרף בבת אחת. הורד אחד כדי להוסיף.';
                clearTimeout(toggle.t); toggle.t = setTimeout(function () { toast.textContent = ''; }, 3500);
                return;
            }
            st.sel.push(a);
            assign(a);
        }
        save(); render();
    }
    function assign(a) {
        var used = st.sel.map(function (s) { return st.slot[s]; });
        if (st.slot[a] === undefined || used.filter(function (u) { return u === st.slot[a]; }).length > 1)
            for (var k = 0; k < MAXSEL; k++) if (used.indexOf(k) < 0) { st.slot[a] = k; break; }
    }
    rowsEl.addEventListener('click', function (e) {
        if (e.target.closest('a')) return;
        var r = e.target.closest('.stats-row');
        if (r) toggle(r.dataset.a);
    });
    rowsEl.addEventListener('keydown', function (e) {
        var r = e.target.closest('.stats-row');
        if (r && (e.key === 'Enter' || e.key === ' ')) {
            e.preventDefault();
            var a = r.dataset.a;
            toggle(a);
            var again = rowsEl.querySelector('.stats-row[data-a="' + a + '"]');
            if (again) again.focus();
        }
    });
    moreBtn.addEventListener('click', function () { open = !open; drawTable(); });
    function pickTop(k) {
        var len = st.i1 - st.i0 + 1;
        st.sel = ANCH.slice().sort(function (a, b) { return sum(SERIES[b], st.i0, st.i1) - sum(SERIES[a], st.i0, st.i1); })
            .filter(function (a) { return sum(SERIES[a], st.i0, st.i1) > 0; }).slice(0, k);
        st.slot = {};
        st.sel.forEach(function (a, i) { st.slot[a] = i; });
        save(); render();
    }
    $('[data-act="top"]').addEventListener('click', function () { pickTop(5); });
    $('[data-act="clear"]').addEventListener('click', function () { st.sel = []; st.slot = {}; save(); render(); });

    // ── toolbar ──
    box.querySelectorAll('.stats-seg').forEach(function (seg) {
        seg.addEventListener('click', function (e) {
            var b = e.target.closest('button');
            if (!b) return;
            var k = seg.dataset.k, v = b.dataset.v;
            if (k === 'preset') applyPreset(v);
            else if (k === 'log') st.log = v === '1';
            else st[k] = v;
            save(); render();
        });
    });
    function syncTools() {
        box.querySelectorAll('.stats-seg').forEach(function (seg) {
            var k = seg.dataset.k, cur = k === 'log' ? (st.log ? '1' : '0') : st[k];
            seg.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === cur); });
        });
        var len = st.i1 - st.i0 + 1;
        $('.stats-range-label').textContent = dm(st.i0) + ' – ' + dm(st.i1) + ' · ' + len + (len === 1 ? ' יום' : ' ימים');
    }

    var SERIES;
    function render() { syncTools(); kpis(); drawChart(); drawNav(); drawTable(); }

    window.vcStats.then(function (s) {
        if (!s.daily || !s.daily.dates || !s.daily.dates.length) return;
        D = s.daily.dates; N = D.length;
        SERIES = {};
        Object.keys(s.daily.apps).forEach(function (a) { if (meta[a]) SERIES[a] = s.daily.apps[a]; });
        ANCH = Object.keys(SERIES);
        USERS = s.daily.users || D.map(function () { return 0; });
        SITE = D.map(function (_, i) {
            var t = (s.daily.home[i] || 0) + (s.daily.other[i] || 0);
            for (var a in s.daily.apps) t += s.daily.apps[a][i] || 0;
            return t;
        });
        load();
        if (st.preset) applyPreset(st.preset); else applyPreset('30');
        if (st.sel) {
            st.sel = st.sel.filter(function (a) { return SERIES[a]; }).slice(0, MAXSEL);
            st.sel.forEach(assign);
        }
        var up = new Date(s.updated);
        $('.stats-updated').textContent = 'עודכן ' +
            up.toLocaleString('he-IL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
        box.hidden = false;
        if (!st.sel) pickTop(5); else render();
        var link = document.querySelector('.toc-stats');
        if (link) link.hidden = false;
        var w = box.clientWidth;
        if ('ResizeObserver' in window) new ResizeObserver(function () {
            if (box.clientWidth !== w) { w = box.clientWidth; drawChart(); drawNav(); }
        }).observe(box);
    }).catch(function () {});
})();
</script>
</body>
</html>
