<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Coding — פרויקטי AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Heebo', 'Inter', sans-serif;
            background: #09111f;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 28px 20px 60px;
            /* the stage's prism swings wider than the screen mid-roll */
            overflow-x: clip;
        }

        /* Subtle grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(129,140,248,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(129,140,248,0.03) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ── Header ── */
        header {
            text-align: center;
            margin-bottom: 28px;
            padding: 12px 24px 0;
            position: relative;
        }

        header::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: min(500px, 100%); height: 250px;
            background: radial-gradient(ellipse, rgba(129,140,248,0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .header-sub {
            color: #94a3b8;
            font-size: 1.05rem;
            margin-bottom: 6px;
        }

        .header-meta {
            color: #475569;
            font-size: 0.82rem;
        }

        .header-stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
        }

        .stat-num {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 2px;
        }

        html { scroll-behavior: smooth; }

        /* ── Table of contents ── */
        .toc {
            background: #0c1726;
            border: 1px solid #1a2840;
            border-radius: 16px;
            padding: 18px 20px 20px;
            scroll-margin-top: 16px;
        }

        .toc-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .toc-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #cbd5e1;
            letter-spacing: 1.5px;
        }

        .toc-sort, .toc-sort-all {
            font: inherit;
            font-size: 0.7rem;
            font-weight: 600;
            color: #94a3b8;
            background: #131e2e;
            border: 1px solid #1e2e42;
            border-radius: 20px;
            padding: 2px 10px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.18s;
        }
        .toc-sort:hover, .toc-sort-all:hover { background: #1a2840; color: #e2e8f0; }
        .toc-sort.sorted { color: #c084fc; border-color: rgba(192,132,252,0.4); }
        .toc-sort-all { margin-inline-start: auto; }

        .toc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 18px 16px;
        }

        .toc-head {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 1px solid #1e293b;
        }

        .toc-cat {
            font-size: 0.8rem;
            font-weight: 700;
            color: #e2e8f0;
            text-decoration: none;
        }
        .toc-cat:hover { color: #c084fc; }

        .toc-list { list-style: none; }

        .toc-list a {
            display: flex;
            gap: 6px;
            align-items: baseline;
            padding: 3px 4px;
            border-radius: 6px;
            text-decoration: none;
            line-height: 1.3;
        }
        .toc-list a:hover { background: #131e2e; }
        .toc-list a:hover .toc-name { color: #c084fc; }

        .toc-icon { font-size: 0.8rem; flex-shrink: 0; }
        .toc-name { font-size: 0.82rem; font-weight: 600; color: #cbd5e1; }
        .toc-sub { display: block; font-size: 0.68rem; color: #64748b; }

        .toc-try {
            font-size: 0.72rem;
            font-weight: 600;
            color: #4ade80;
            text-decoration: none;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(74,222,128,0.1);
            border: 1px solid rgba(74,222,128,0.25);
        }
        .toc-try:hover { background: rgba(74,222,128,0.18); }

        /* ── Stage: the rotating showcase at the top ──
           One live project at a time on the faces of a three-sided prism that
           rolls a third of a turn per step, the same mechanism as the haskala
           landing page. There are many projects and only three faces: the
           script writes the next project onto the face about to swing in.
           --sw is the face width: about 70% of what fits in one screen, so
           the page around it stays in view. */
        .stage {
            --sw: min(1000px, calc(100vw - 40px), calc((100vh - 150px) * 1.6 * 0.7));
            width: var(--sw);
            margin: 0 calc((100% - var(--sw)) / 2) 56px;
            position: relative;
            outline: none;
        }
        .stage:focus-visible .stage-face { outline: 3px solid #818cf8; outline-offset: 3px; }
        .stage-flip {
            perspective: calc(var(--sw) * 3.2);
            touch-action: pan-y;
        }
        .stage-inner {
            /* the true inradius of an equilateral prism, so the faces meet at
               the edges and the roll never shows a gap */
            --r: calc(var(--sw) * 0.2887);
            display: grid;
            transform-style: preserve-3d;
            transform: translateZ(calc(-1 * var(--r))) rotateY(var(--rot, 0deg));
            /* symmetric easing: a front-loaded curve leaves a frame where no
               face looks at the reader */
            transition: transform 0.9s cubic-bezier(.65, 0, .35, 1);
        }
        .stage-face {
            grid-area: 1 / 1;
            display: flex;
            flex-direction: column;
            transform: rotateY(calc(var(--k) * 120deg)) translateZ(var(--r));
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            background: #0e1a2b;
            border: 1px solid #1a2840;
            border-radius: 18px;
            overflow: hidden;
            text-decoration: none;
            box-shadow: 0 30px 80px rgba(0,0,0,0.55);
        }
        .stage-face-0 { --k: 0; }
        .stage-face-1 { --k: 1; }
        .stage-face-2 { --k: 2; }
        .stage-shot {
            display: block;
            aspect-ratio: 16 / 10;
            background: #0b1424;
        }
        .stage-shot img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            -webkit-user-drag: none;
            user-select: none;
        }
        .stage-cap {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 20px;
            border-top: 2px solid var(--accent, #818cf8);
        }
        .stage-icon { font-size: 1.7rem; flex-shrink: 0; }
        .stage-text { flex: 1; min-width: 0; line-height: 1.35; }
        .stage-name { display: block; font-size: 1.12rem; font-weight: 700; color: #f1f5f9; }
        .stage-name small { font-size: 0.85rem; font-weight: 500; color: var(--accent, #94a3b8); }
        .stage-lead {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .stage-open {
            flex-shrink: 0;
            padding: 9px 20px;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #059669, #10b981);
            box-shadow: 0 0 16px rgba(16,185,129,0.3);
            transition: box-shadow 0.2s;
        }
        .stage-face:hover .stage-open { box-shadow: 0 0 24px rgba(16,185,129,0.6); }

        .stage-nav {
            /* above the face that swings out towards the reader mid-roll */
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
        }
        /* The arrows sit beside the picture, level with its middle: big, wide
           and short, so no one misses that there is more to see. They stand
           outside the face when the screen has room, and over its edges when
           it does not. Prev is on the right: on a right-to-left page that is
           back. */
        .stage-arrow {
            --aw: 92px;
            --gap: max(calc(-1 * (var(--aw) + 28px)), calc((var(--sw) - 100vw) / 2 + 8px));
            position: absolute;
            z-index: 3;
            top: calc(var(--sw) * 0.3125);
            transform: translateY(-50%);
            width: var(--aw);
            height: 64px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 18px;
            border: 1.5px solid rgba(129,140,248,0.55);
            background: rgba(20,30,52,0.88);
            color: #e0e7ff;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(0,0,0,0.45), 0 0 22px rgba(129,140,248,0.25);
            backdrop-filter: blur(6px);
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.2s;
            animation: stage-arrow-call 1.6s ease-in-out 1s 2;
        }
        .stage-prev { right: var(--gap); }
        .stage-next { left: var(--gap); }
        .stage-arrow:hover {
            background: #4f46e5;
            border-color: #a5b4fc;
            color: #fff;
            box-shadow: 0 10px 32px rgba(0,0,0,0.5), 0 0 34px rgba(129,140,248,0.6);
            transform: translateY(-50%) scale(1.06);
        }
        .stage-arrow:active { transform: translateY(-50%) scale(0.96); }
        .stage-arrow:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 3px; }
        /* two soft calls for attention after the page loads, then still */
        @keyframes stage-arrow-call {
            50% { box-shadow: 0 8px 28px rgba(0,0,0,0.45), 0 0 40px rgba(129,140,248,0.75); border-color: #a5b4fc; }
        }
        /* Autoplay row: a big play/pause button, the speed slider, the count */
        .stage-auto {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px 22px;
            margin-top: 16px;
        }
        .stage-play {
            display: inline-flex; align-items: center; gap: 10px;
            height: 52px;
            padding: 0 26px 0 22px;
            border-radius: 999px;
            border: 1.5px solid #a5b4fc;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff;
            font: inherit;
            font-size: 1.02rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 22px rgba(79,70,229,0.45);
            transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
        }
        .stage-play:hover { transform: scale(1.04); box-shadow: 0 8px 30px rgba(124,58,237,0.6); }
        .stage-play:active { transform: scale(0.97); }
        .stage-play:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 3px; }
        .stage-play-icon { font-size: 0.85rem; letter-spacing: -1px; width: 1.1em; text-align: center; }
        /* paused: green, an invitation to start again */
        .stage-play[aria-pressed="false"] {
            border-color: #6ee7b7;
            background: linear-gradient(135deg, #059669, #10b981);
            box-shadow: 0 6px 22px rgba(16,185,129,0.4);
        }
        .stage-speed {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 16px;
            border-radius: 999px;
            background: #0e1a2b;
            border: 1px solid #1a2840;
            cursor: pointer;
        }
        .stage-speed-end { font-size: 1.15rem; }
        .stage-speed input {
            width: 170px;
            accent-color: #818cf8;
            cursor: pointer;
        }
        .stage-speed-out {
            min-width: 7.5em;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
        }
        .stage-speed.off { opacity: 0.55; }
        .stage-pills {
            flex: 1;
            min-width: 0;
            display: flex;
            gap: 4px;
            padding: 4px;
            overflow-x: auto;
            scrollbar-width: none;
            background: #0e1a2b;
            border: 1px solid #1a2840;
            border-radius: 999px;
        }
        .stage-pills::-webkit-scrollbar { display: none; }
        .stage-pill {
            flex-shrink: 0;
            white-space: nowrap;
            border: none;
            border-radius: 999px;
            padding: 7px 14px;
            background: transparent;
            color: #94a3b8;
            font: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.18s, color 0.18s;
        }
        .stage-pill:hover { color: #f1f5f9; }
        .stage-pill[aria-current="true"] {
            background: #1e2b45;
            color: #fff;
            box-shadow: 0 1px 6px rgba(0,0,0,0.4);
        }
        .stage-count {
            font-size: 0.85rem;
            color: #64748b;
        }
        .stage-count b { color: #cbd5e1; }

        @media (prefers-reduced-motion: reduce) {
            .stage-inner { transition: none; }
            .stage-arrow { animation: none; }
        }
        @media (max-width: 520px) {
            .stage { --sw: calc(100vw - 24px); margin-bottom: 40px; }
            .stage-face { border-radius: 12px; }
            .stage-cap { padding: 9px 12px; gap: 9px; }
            .stage-icon { font-size: 1.3rem; }
            .stage-name { font-size: 0.95rem; }
            .stage-lead { display: none; }
            .stage-open { padding: 7px 13px; font-size: 0.8rem; }
            .stage-arrow { --aw: 46px; height: 56px; border-radius: 14px; }
            .stage-arrow svg { width: 26px; height: 26px; }
            .stage-play { height: 46px; padding: 0 20px 0 16px; }
            .stage-speed input { width: 110px; }
        }

        /* ── Live projects gallery ── */
        .try-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 14px;
        }

        .try-card {
            display: flex;
            flex-direction: column;
            background: #0e1a2b;
            border: 1px solid #1a2840;
            border-radius: 14px;
            overflow: hidden;
            text-decoration: none;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .try-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent, #818cf8);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .try-shot {
            display: block;
            aspect-ratio: 16 / 10;
            background: var(--icon-bg, #131e2e);
            border-bottom: 1px solid #1a2840;
            overflow: hidden;
        }
        .try-shot img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .try-card:hover .try-shot img { transform: scale(1.04); }
        .try-noshot {
            display: flex; align-items: center; justify-content: center;
            height: 100%;
            font-size: 2.4rem;
        }

        .try-info {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
        }
        .try-icon { font-size: 1rem; flex-shrink: 0; }
        .try-text { flex: 1; min-width: 0; line-height: 1.3; }
        .try-name { display: block; font-size: 0.86rem; font-weight: 700; color: #f1f5f9; }
        .try-sub { display: block; font-size: 0.7rem; color: #64748b; }
        .try-go {
            flex-shrink: 0;
            width: 26px; height: 26px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem;
            color: #fff;
            background: linear-gradient(135deg, #059669, #10b981);
            box-shadow: 0 0 12px rgba(16,185,129,0.3);
        }

        /* Phones: two small cards per row instead of one tall column */
        @media (max-width: 520px) {
            .try-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
            .try-info { padding: 8px 9px; gap: 6px; }
            .try-name { font-size: 0.78rem; }
            .try-sub { font-size: 0.64rem; }
            .try-go { display: none; }
        }

        /* Floating "back to contents" button */
        .to-toc {
            position: fixed;
            bottom: 20px;
            inset-inline-start: 20px;
            z-index: 5;
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: #131e2e;
            border: 1px solid #1e2e42;
            color: #c084fc;
            font-size: 1.1rem;
            text-decoration: none;
            box-shadow: 0 4px 18px rgba(0,0,0,0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .to-toc.show { opacity: 1; pointer-events: auto; }

        /* Card reached from the table of contents */
        .project-card, .section-header { scroll-margin-top: 16px; }
        .project-card:target {
            border-color: var(--accent, #818cf8);
            animation: target-glow 2s ease-out;
        }
        @keyframes target-glow {
            0%, 40% { box-shadow: 0 0 0 3px var(--accent, #818cf8), 0 8px 32px rgba(0,0,0,0.4); }
            100% { box-shadow: 0 0 0 0 transparent; }
        }

        /* ── Section headers ── */
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 44px 0 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid #1e293b;
        }

        .section-emoji { font-size: 1.3rem; }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .section-count {
            font-size: 0.72rem;
            color: #475569;
            background: #131e2e;
            padding: 2px 10px;
            border-radius: 20px;
            margin-inline-start: auto;
        }

        /* ── Project grid ── */
        .projects { display: grid; gap: 14px; }

        .projects-mini {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }

        /* ── Project card ── */
        .project-card {
            background: #0e1a2b;
            border: 1px solid #1a2840;
            border-radius: 16px;
            padding: 20px 22px;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            align-items: start;
        }

        .project-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent, #818cf8);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        /* Small cards (3D section) have no illustration column */
        .card-small {
            grid-template-columns: 1fr;
        }

        /* ── Card internals ── */
        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        .card-icon {
            width: 42px; height: 42px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem;
            flex-shrink: 0;
            background: var(--icon-bg, rgba(30,50,90,0.6));
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
            line-height: 1.3;
            margin-bottom: 5px;
        }

        /* Badges */
        .live-badge {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 0.62rem; font-weight: 700;
            padding: 2px 8px; border-radius: 20px;
            background: rgba(74,222,128,0.12);
            color: #4ade80;
            border: 1px solid rgba(74,222,128,0.3);
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .live-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: #4ade80;
            animation: blink 1.5s ease-in-out infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

        .wip-badge {
            display: inline-flex; align-items: center; gap: 3px;
            font-size: 0.62rem; font-weight: 600;
            padding: 2px 8px; border-radius: 20px;
            background: rgba(251,191,36,0.1);
            color: #fbbf24;
            border: 1px solid rgba(251,191,36,0.2);
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        .card-tags {
            display: flex; flex-wrap: wrap; gap: 5px;
        }

        .tag {
            font-size: 0.65rem; font-weight: 500;
            padding: 2px 8px; border-radius: 6px;
            background: var(--tag-bg, rgba(30,50,90,0.7));
            color: var(--accent, #818cf8);
        }

        .card-desc {
            color: #94a3b8;
            font-size: 0.87rem;
            line-height: 1.7;
            margin: 10px 0 14px;
        }

        /* ── Buttons ── */
        .card-links { display: flex; gap: 8px; flex-wrap: wrap; }

        .card-links a {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 7px 15px; border-radius: 8px;
            font-size: 0.8rem; font-weight: 600;
            text-decoration: none;
            transition: all 0.18s;
        }

        .btn-live {
            background: linear-gradient(135deg, #059669, #10b981);
            color: #fff;

<div class="container">

{{HEADER}}

</div>
<script>
// Stage: roll the prism one face per step. Three faces, many projects, so the
// face about to swing in gets the target project's screenshot first. Next
// arrives from the left, which is "forward" on a right-to-left page.
(function () {
    var stage = document.getElementById('stage');
    if (!stage) return;
    var slides = JSON.parse(document.getElementById('stage-data').textContent);
    var inner = stage.querySelector('.stage-inner');
    var faces = Array.prototype.slice.call(stage.querySelectorAll('.stage-face'));
    var pills = Array.prototype.slice.call(stage.querySelectorAll('.stage-pill'));
    var strip = stage.querySelector('.stage-pills');
    var count = stage.querySelector('.stage-count b');
    var playBtn = stage.querySelector('.stage-play');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var SPEEDS = [15, 12, 10, 8, 6.5, 5, 4, 3, 2.5];  // seconds per project, slow to fast
    var DWELL = 6500, ROLL = reduce ? 0 : 900;
    var slider = stage.querySelector('.stage-speed input');
    var speedOut = stage.querySelector('.stage-speed-out');
    var n = slides.length, idx = 0, front = 0, rot = 0, busy = false;
    var playing = !reduce, hold = false, visible = true, timer = null;

    function fill(k, s) {
        var face = faces[k];
        face.className = 'stage-face stage-face-' + k + ' ' + s.theme;
        face.href = s.href;
        if (s.ext) { face.target = '_blank'; face.rel = 'noopener'; }
        else { face.removeAttribute('target'); face.removeAttribute('rel'); }
        var img = face.querySelector('img');
        img.src = s.img;
        img.alt = 'צילום מסך של ' + s.name;
        face.querySelector('.stage-icon').textContent = s.icon;
        var name = face.querySelector('.stage-name');
        name.textContent = s.name + ' ';
        if (s.sub) {
            var small = document.createElement('small');
            small.textContent = s.sub;
            name.appendChild(small);
        }
        face.querySelector('.stage-lead').textContent = s.lead;
        return img;
    }

    function preload(i) { new Image().src = slides[(i + n) % n].img; }

    function mark(scroll) {
        pills.forEach(function (p, i) {
            if (i === idx) p.setAttribute('aria-current', 'true');
            else p.removeAttribute('aria-current');
        });
        faces.forEach(function (f, k) {
            f.tabIndex = k === front ? 0 : -1;
            if (k === front) f.removeAttribute('aria-hidden');
            else f.setAttribute('aria-hidden', 'true');
        });
        count.textContent = idx + 1;
        if (!scroll) return;
        // scroll only the strip, never the page: autoplay runs while the
        // reader may be further down
        var pr = pills[idx].getBoundingClientRect(), sr = strip.getBoundingClientRect();
        strip.scrollBy({ left: pr.left + pr.width / 2 - (sr.left + sr.width / 2), behavior: reduce ? 'auto' : 'smooth' });
    }

    function go(j, dir) {
        j = (j + n) % n;
        if (j === idx || busy) return;
        if (!dir) dir = j > idx ? 1 : -1;
        var k = (front - dir + 3) % 3;
        var img = fill(k, slides[j]);
        busy = true;
        // wait (briefly) for the picture, so the face does not roll in empty
        var ready = img.decode ? img.decode() : Promise.resolve();
        Promise.race([ready, new Promise(function (r) { setTimeout(r, 600); })])
            .catch(function () {})
            .then(function () {
                rot += dir * 120;
                inner.style.setProperty('--rot', rot + 'deg');
                front = k; idx = j;
                mark(true);
                preload(j + 1); preload(j - 1);
                setTimeout(function () { busy = false; }, ROLL);
            });
    }

    function schedule() {
        clearTimeout(timer);
        if (playing && !hold && visible && !document.hidden)
            timer = setTimeout(function () { go(idx + 1, 1); schedule(); }, DWELL);
    }
    function step(dir) { go(idx + dir, dir); schedule(); }

    function setPlaying(on) {
        playing = on;
        playBtn.querySelector('.stage-play-icon').textContent = on ? '❚❚' : '▶';
        playBtn.querySelector('.stage-play-text').textContent = on ? 'עצור' : 'הפעל';
        playBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
        playBtn.setAttribute('aria-label', on ? 'עצור החלפה אוטומטית' : 'הפעל החלפה אוטומטית');
        slider.parentNode.classList.toggle('off', !on);
        schedule();
    }

    stage.querySelector('.stage-next').addEventListener('click', function () { step(1); });
    stage.querySelector('.stage-prev').addEventListener('click', function () { step(-1); });
    playBtn.addEventListener('click', function () { setPlaying(!playing); });

    // speed: remembered per browser; failing storage just means the default
    function setSpeed(i, save) {
        i = Math.max(0, Math.min(SPEEDS.length - 1, i | 0));
        slider.value = i;
        DWELL = SPEEDS[i] * 1000;
        speedOut.textContent = 'כל ' + SPEEDS[i] + ' שניות';
        slider.setAttribute('aria-valuetext', speedOut.textContent);
        if (save) { try { localStorage.setItem('stage-speed', i); } catch (e) {} }
    }
    try { var saved = localStorage.getItem('stage-speed'); } catch (e) {}
    setSpeed(saved === null || saved === undefined ? 4 : +saved, false);
    slider.addEventListener('input', function () {
        setSpeed(+slider.value, true);
        if (!playing) setPlaying(true); else schedule();
    });
    pills.forEach(function (p, i) {
        p.addEventListener('click', function () { go(i); schedule(); });
    });
    stage.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') { step(1); e.preventDefault(); }
        else if (e.key === 'ArrowRight') { step(-1); e.preventDefault(); }
    });

    // swipe: dragging the picture to the right brings in the next one from
    // the left, the way the roll goes
    var flip = stage.querySelector('.stage-flip'), x0 = null, y0 = 0, dragged = false;
    flip.addEventListener('pointerdown', function (e) { x0 = e.clientX; y0 = e.clientY; dragged = false; });
    flip.addEventListener('pointerup', function (e) {
        if (x0 === null) return;
        var dx = e.clientX - x0, dy = e.clientY - y0;
        x0 = null;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { dragged = true; step(dx > 0 ? 1 : -1); }
    });
    flip.addEventListener('dragstart', function (e) { e.preventDefault(); });
    faces.forEach(function (f) {
        f.addEventListener('click', function (e) { if (dragged) { e.preventDefault(); dragged = false; } });
    });

    // hold still while the reader works the controls. Not on hovering the
    // picture: it fills most of the screen, so the mouse is nearly always on it
    var nav = stage.querySelector('.stage-nav');
    nav.addEventListener('mouseenter', function () { hold = true; schedule(); });
    nav.addEventListener('mouseleave', function () { hold = false; schedule(); });
    // keyboard focus holds it too, but not a mouse click (the clicked button
    // keeps focus) and not the autoplay controls, which would pause it the
    // moment someone presses play
    stage.addEventListener('focusin', function (e) {
        var t = e.target;
        hold = !t.closest('.stage-auto') && (!t.matches || t.matches(':focus-visible'));
        schedule();
    });
    stage.addEventListener('focusout', function (e) {
        if (!stage.contains(e.relatedTarget)) { hold = false; schedule(); }
    });
    document.addEventListener('visibilitychange', schedule);
    if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (es) {
            visible = es[0].isIntersecting; schedule();
        }, { threshold: 0.4 }).observe(stage);
    }

    mark(false);
    preload(1); preload(-1);
    setPlaying(playing);
})();
</script>
<script>
// Table of contents: each column cycles page order → א–ת → ת–א.
// The chosen order is remembered per browser; failing storage is harmless.
(function () {
    var MODES = ['page', 'az', 'za'];
    var LABELS = { page: 'סדר הדף', az: 'א–ת ↓', za: 'ת–א ↑' };
    var collator = new Intl.Collator(['he', 'en'], { numeric: true, sensitivity: 'base' });
    var cols = Array.prototype.slice.call(document.querySelectorAll('.toc-col'));
    var allBtn = document.querySelector('.toc-sort-all');

    function nameOf(li) { return li.querySelector('.toc-name').textContent.trim(); }

    function apply(col, mode) {
        var list = col.querySelector('.toc-list');
        var items = Array.prototype.slice.call(list.children);
        items.sort(function (a, b) {
            if (mode === 'page') return a.dataset.i - b.dataset.i;
            var c = collator.compare(nameOf(a), nameOf(b));
            return mode === 'az' ? c : -c;
        });
        items.forEach(function (li) { list.appendChild(li); });
        col.dataset.mode = mode;
        var btn = col.querySelector('.toc-sort');
        btn.textContent = LABELS[mode];
        btn.classList.toggle('sorted', mode !== 'page');
    }

    function save() {
        try {
            localStorage.setItem('toc-sort', JSON.stringify(cols.map(function (c) { return c.dataset.mode; })));
        } catch (e) {}
    }

    function syncAllBtn() {
        var allAz = cols.every(function (c) { return c.dataset.mode === 'az'; });
        allBtn.textContent = allAz ? 'חזרה לסדר הדף' : 'מיין הכל א–ת';
    }

    var saved = [];
    try { saved = JSON.parse(localStorage.getItem('toc-sort')) || []; } catch (e) {}
    cols.forEach(function (col, i) {
        apply(col, MODES.indexOf(saved[i]) >= 0 ? saved[i] : 'page');
        col.querySelector('.toc-sort').addEventListener('click', function () {
            apply(col, MODES[(MODES.indexOf(col.dataset.mode) + 1) % MODES.length]);
            syncAllBtn();
            save();
        });
    });
    syncAllBtn();

    allBtn.addEventListener('click', function () {
        var allAz = cols.every(function (c) { return c.dataset.mode === 'az'; });
        cols.forEach(function (c) { apply(c, allAz ? 'page' : 'az'); });
        syncAllBtn();
        save();
    });

    // Show the "back to contents" button once the table has scrolled away
    var toc = document.getElementById('toc');
    var back = document.querySelector('.to-toc');
    if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (entries) {
            back.classList.toggle('show', !entries[0].isIntersecting);
        }).observe(toc);
    }
})();
</script>
