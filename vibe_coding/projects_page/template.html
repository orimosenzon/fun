<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Coding — פרויקטי AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Heebo', 'Inter', sans-serif;
            background: #09111f;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 40px 20px 60px;
        }

        /* Subtle grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(129,140,248,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(129,140,248,0.03) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ── Header ── */
        header {
            text-align: center;
            margin-bottom: 56px;
            padding: 48px 24px;
            position: relative;
        }

        header::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: min(500px, 100%); height: 250px;
            background: radial-gradient(ellipse, rgba(129,140,248,0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .header-sub {
            color: #94a3b8;
            font-size: 1.05rem;
            margin-bottom: 6px;
        }

        .header-meta {
            color: #475569;
            font-size: 0.82rem;
        }

        .header-stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
        }

        .stat-num {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 2px;
        }

        html { scroll-behavior: smooth; }

        /* ── Table of contents ── */
        .toc {
            background: #0c1726;
            border: 1px solid #1a2840;
            border-radius: 16px;
            padding: 18px 20px 20px;
            scroll-margin-top: 16px;
        }

        .toc-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .toc-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #cbd5e1;
            letter-spacing: 1.5px;
        }

        .toc-sort, .toc-sort-all {
            font: inherit;
            font-size: 0.7rem;
            font-weight: 600;
            color: #94a3b8;
            background: #131e2e;
            border: 1px solid #1e2e42;
            border-radius: 20px;
            padding: 2px 10px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.18s;
        }
        .toc-sort:hover, .toc-sort-all:hover { background: #1a2840; color: #e2e8f0; }
        .toc-sort.sorted { color: #c084fc; border-color: rgba(192,132,252,0.4); }
        .toc-sort-all { margin-inline-start: auto; }

        .toc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 18px 16px;
        }

        .toc-head {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 1px solid #1e293b;
        }

        .toc-cat {
            font-size: 0.8rem;
            font-weight: 700;
            color: #e2e8f0;
            text-decoration: none;
        }
        .toc-cat:hover { color: #c084fc; }

        .toc-list { list-style: none; }

        .toc-list a {
            display: flex;
            gap: 6px;
            align-items: baseline;
            padding: 3px 4px;
            border-radius: 6px;
            text-decoration: none;
            line-height: 1.3;
        }
        .toc-list a:hover { background: #131e2e; }
        .toc-list a:hover .toc-name { color: #c084fc; }

        .toc-icon { font-size: 0.8rem; flex-shrink: 0; }
        .toc-name { font-size: 0.82rem; font-weight: 600; color: #cbd5e1; }
        .toc-sub { display: block; font-size: 0.68rem; color: #64748b; }

        /* Floating "back to contents" button */
        .to-toc {
            position: fixed;
            bottom: 20px;
            inset-inline-start: 20px;
            z-index: 5;
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: #131e2e;
            border: 1px solid #1e2e42;
            color: #c084fc;
            font-size: 1.1rem;
            text-decoration: none;
            box-shadow: 0 4px 18px rgba(0,0,0,0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .to-toc.show { opacity: 1; pointer-events: auto; }

        /* Card reached from the table of contents */
        .project-card, .section-header { scroll-margin-top: 16px; }
        .project-card:target {
            border-color: var(--accent, #818cf8);
            animation: target-glow 2s ease-out;
        }
        @keyframes target-glow {
            0%, 40% { box-shadow: 0 0 0 3px var(--accent, #818cf8), 0 8px 32px rgba(0,0,0,0.4); }
            100% { box-shadow: 0 0 0 0 transparent; }
        }

        /* ── Section headers ── */
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 44px 0 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid #1e293b;
        }

        .section-emoji { font-size: 1.3rem; }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .section-count {
            font-size: 0.72rem;
            color: #475569;
            background: #131e2e;
            padding: 2px 10px;
            border-radius: 20px;
            margin-inline-start: auto;
        }

        /* ── Project grid ── */
        .projects { display: grid; gap: 14px; }

        .projects-mini {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }

        /* ── Project card ── */
        .project-card {
            background: #0e1a2b;
            border: 1px solid #1a2840;
            border-radius: 16px;
            padding: 20px 22px;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            align-items: start;
        }

        .project-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent, #818cf8);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        /* Small cards (3D section) have no illustration column */
        .card-small {
            grid-template-columns: 1fr;
        }

        /* ── Card internals ── */
        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        .card-icon {
            width: 42px; height: 42px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem;
            flex-shrink: 0;
            background: var(--icon-bg, rgba(30,50,90,0.6));
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
            line-height: 1.3;
            margin-bottom: 5px;
        }

        /* Badges */
        .live-badge {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 0.62rem; font-weight: 700;
            padding: 2px 8px; border-radius: 20px;
            background: rgba(74,222,128,0.12);
            color: #4ade80;
            border: 1px solid rgba(74,222,128,0.3);
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .live-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: #4ade80;
            animation: blink 1.5s ease-in-out infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

        .wip-badge {
            display: inline-flex; align-items: center; gap: 3px;
            font-size: 0.62rem; font-weight: 600;
            padding: 2px 8px; border-radius: 20px;
            background: rgba(251,191,36,0.1);
            color: #fbbf24;
            border: 1px solid rgba(251,191,36,0.2);
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        .card-tags {
            display: flex; flex-wrap: wrap; gap: 5px;
        }

        .tag {
            font-size: 0.65rem; font-weight: 500;
            padding: 2px 8px; border-radius: 6px;
            background: var(--tag-bg, rgba(30,50,90,0.7));
            color: var(--accent, #818cf8);
        }

        .card-desc {
            color: #94a3b8;
            font-size: 0.87rem;
            line-height: 1.7;
            margin: 10px 0 14px;
        }

        /* ── Buttons ── */
        .card-links { display: flex; gap: 8px; flex-wrap: wrap; }

        .card-links a {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 7px 15px; border-radius: 8px;
            font-size: 0.8rem; font-weight: 600;
            text-decoration: none;
            transition: all 0.18s;
        }

        .btn-live {
            background: linear-gradient(135deg, #059669, #10b981);
            color: #fff;
            box-shadow: 0 0 18px rgba(16,185,129,0.3);
        }
        .btn-live:hover {
            box-shadow: 0 0 28px rgba(16,185,129,0.5);
            filter: brightness(1.1);
        }

        .btn-primary {
            background: var(--accent, #818cf8);
            color: #fff;
        }
        .btn-primary:hover { filter: brightness(1.12); }

        .btn-secondary {
            background: #131e2e;
            color: #94a3b8;
            border: 1px solid #1e2e42;
        }
        .btn-secondary:hover { background: #1a2840; color: #cbd5e1; }

        /* ── Illustration box ── */
        .card-illus {
            width: 78px; height: 78px;
            border-radius: 12px;
            background: var(--icon-bg, rgba(30,50,90,0.4));
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        /* ── Color themes ── */
        .t-purple  { --accent:#c084fc; --icon-bg:rgba(59,20,90,0.5);  --tag-bg:rgba(59,20,90,0.7); }
        .t-cyan    { --accent:#22d3ee; --icon-bg:rgba(14,60,80,0.5);  --tag-bg:rgba(14,60,80,0.7); }
        .t-indigo  { --accent:#818cf8; --icon-bg:rgba(25,25,90,0.5);  --tag-bg:rgba(25,25,90,0.7); }
        .t-blue    { --accent:#60a5fa; --icon-bg:rgba(20,50,90,0.5);  --tag-bg:rgba(20,50,90,0.7); }
        .t-teal    { --accent:#2dd4bf; --icon-bg:rgba(10,70,65,0.5);  --tag-bg:rgba(10,70,65,0.7); }
        .t-amber   { --accent:#fbbf24; --icon-bg:rgba(80,55,10,0.5);  --tag-bg:rgba(80,55,10,0.7); }
        .t-pink    { --accent:#f472b6; --icon-bg:rgba(90,20,55,0.5);  --tag-bg:rgba(90,20,55,0.7); }
        .t-green   { --accent:#4ade80; --icon-bg:rgba(20,80,45,0.5);  --tag-bg:rgba(20,80,45,0.7); }
        .t-red     { --accent:#f87171; --icon-bg:rgba(90,20,20,0.5);  --tag-bg:rgba(90,20,20,0.7); }
        .t-orange  { --accent:#fb923c; --icon-bg:rgba(90,40,10,0.5);  --tag-bg:rgba(90,40,10,0.7); }

        /* ── Footer ── */
        footer {
            text-align: center;
            margin-top: 56px;
            padding-top: 24px;
            border-top: 1px solid #1a2840;
            color: #374151;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
<div class="container">

{{HEADER}}
{{TOC}}
{{SECTIONS}}
    <footer>
        ✦ Built with Claude Code &nbsp;&bull;&nbsp; Vibe Coding &nbsp;&bull;&nbsp; אורי מוסנזון
    </footer>

</div>
<script>
// Table of contents: each column cycles page order → א–ת → ת–א.
// The chosen order is remembered per browser; failing storage is harmless.
(function () {
    var MODES = ['page', 'az', 'za'];
    var LABELS = { page: 'סדר הדף', az: 'א–ת ↓', za: 'ת–א ↑' };
    var collator = new Intl.Collator(['he', 'en'], { numeric: true, sensitivity: 'base' });
    var cols = Array.prototype.slice.call(document.querySelectorAll('.toc-col'));
    var allBtn = document.querySelector('.toc-sort-all');

    function nameOf(li) { return li.querySelector('.toc-name').textContent.trim(); }

    function apply(col, mode) {
        var list = col.querySelector('.toc-list');
        var items = Array.prototype.slice.call(list.children);
        items.sort(function (a, b) {
            if (mode === 'page') return a.dataset.i - b.dataset.i;
            var c = collator.compare(nameOf(a), nameOf(b));
            return mode === 'az' ? c : -c;
        });
        items.forEach(function (li) { list.appendChild(li); });
        col.dataset.mode = mode;
        var btn = col.querySelector('.toc-sort');
        btn.textContent = LABELS[mode];
        btn.classList.toggle('sorted', mode !== 'page');
    }

    function save() {
        try {
            localStorage.setItem('toc-sort', JSON.stringify(cols.map(function (c) { return c.dataset.mode; })));
        } catch (e) {}
    }

    function syncAllBtn() {
        var allAz = cols.every(function (c) { return c.dataset.mode === 'az'; });
        allBtn.textContent = allAz ? 'חזרה לסדר הדף' : 'מיין הכל א–ת';
    }

    var saved = [];
    try { saved = JSON.parse(localStorage.getItem('toc-sort')) || []; } catch (e) {}
    cols.forEach(function (col, i) {
        apply(col, MODES.indexOf(saved[i]) >= 0 ? saved[i] : 'page');
        col.querySelector('.toc-sort').addEventListener('click', function () {
            apply(col, MODES[(MODES.indexOf(col.dataset.mode) + 1) % MODES.length]);
            syncAllBtn();
            save();
        });
    });
    syncAllBtn();

    allBtn.addEventListener('click', function () {
        var allAz = cols.every(function (c) { return c.dataset.mode === 'az'; });
        cols.forEach(function (c) { apply(c, allAz ? 'page' : 'az'); });
        syncAllBtn();
        save();
    });

    // Show the "back to contents" button once the table has scrolled away
    var toc = document.getElementById('toc');
    var back = document.querySelector('.to-toc');
    if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (entries) {
            back.classList.toggle('show', !entries[0].isIntersecting);
        }).observe(toc);
    }
})();
</script>
</body>
</html>
