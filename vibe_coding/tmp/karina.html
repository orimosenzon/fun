<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karina, Mind, Heart, Body, Spirit in Space - Animated</title>
    <!-- Tailwind CSS for basic styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Prevent scrollbars */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Ensure body takes full viewport height */
            background-color: #000; /* Black background for space */
            font-family: 'Inter', sans-serif; /* Using Inter font as per instructions */
        }
        canvas {
            display: block;
            width: 100vw; /* Full viewport width */
            height: 100vh; /* Full viewport height */
        }
    </style>
</head>
<body class="bg-black">
    <!-- The canvas element will be appended here by Three.js -->

    <!-- Three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for camera interaction -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- FontLoader for loading 3D fonts -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <!-- TextGeometry for creating 3D text -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>


    <script>
        // Global variables for Three.js scene, camera, and renderer
        let scene, camera, renderer, sphere;
        let controls; // For OrbitControls
        let font; // To store the loaded font globally once
        let textGroup; // A group to hold all the 3D text elements for easier animation
        let startRotation = false; // Flag to control when the rotation starts

        // Function to initialize the 3D scene
        function init() {
            // 1. Scene setup
            scene = new THREE.Scene();
            // Set a black background for the scene to simulate space
            scene.background = new THREE.Color(0x000000);

            // 2. Camera setup
            // PerspectiveCamera(FOV, Aspect Ratio, Near, Far)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5; // Initial camera position

            // 3. Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true }); // antialias for smoother edges
            renderer.setSize(window.innerWidth, window.innerHeight); // Set renderer size to full window
            document.body.appendChild(renderer.domElement); // Add the renderer's output (canvas) to the body

            // 4. Lighting
            // Ambient light: Lights all objects in the scene equally from all directions
            const ambientLight = new THREE.AmbientLight(0x404040); // Soft white light
            scene.add(ambientLight);

            // Directional light: Simulates light from a distant source (like the sun)
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1); // White light, intensity 1
            directionalLight.position.set(1, 1, 1).normalize(); // Position the light
            scene.add(directionalLight);

            // 5. Create the sphere with text "Karina"
            createKarinaSphere();

            // 6. Initialize the text group
            textGroup = new THREE.Group();
            scene.add(textGroup); // Add the group to the scene

            // 7. Load the font and then create all 3D text elements
            loadFontAndCreateText();

            // 8. OrbitControls for camera interaction
            // This library inherently supports touch gestures for rotation, pan, and zoom.
            // One-finger drag for rotation, two-finger drag for pan, pinch for zoom.
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; // Enable damping (inertia) for smoother camera movement
            controls.dampingFactor = 0.05; // Damping factor
            controls.screenSpacePanning = false; // Disable panning in screen space
            controls.minDistance = 2; // Minimum zoom distance
            controls.maxDistance = 10; // Maximum zoom distance
            controls.maxPolarAngle = Math.PI / 2; // Limit vertical rotation to prevent flipping upside down

            // Handle window resizing
            window.addEventListener('resize', onWindowResize, false);

            // Set a timeout to start the rotation after 5 seconds (5000 milliseconds)
            setTimeout(() => {
                startRotation = true;
            }, 5000);
        }

        // Function to create the sphere with "Karina" text
        function createKarinaSphere() {
            // Create a canvas for the text texture
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const text = "Karina";

            // Set canvas dimensions
            canvas.width = 512; // Power of 2 for better texture performance
            canvas.height = 256;

            // Fill background of the canvas with a slightly darker light blue for the sphere's color
            context.fillStyle = '#6495ED'; // Cornflower Blue (Darker Light Blue)
            context.fillRect(0, 0, canvas.width, canvas.height);

            // Set font properties
            context.font = 'bold 80px Arial'; // Large, bold font
            context.fillStyle = '#FFFFFF'; // White color for Karina text
            context.textAlign = 'center'; // Center align text
            context.textBaseline = 'middle'; // Middle align text vertically

            // Draw the text "Karina" on the canvas
            context.fillText(text, canvas.width / 2, canvas.height / 2);

            // Create a texture from the canvas
            const texture = new THREE.CanvasTexture(canvas);

            // Create sphere geometry
            const geometry = new THREE.SphereGeometry(1, 64, 64); // Radius 1, high segments for smoothness

            // Create material with the texture. No need to set material.color here, as the texture provides it.
            const material = new THREE.MeshPhongMaterial({
                map: texture, // Apply the text texture
                side: THREE.DoubleSide // Render both sides of the material
            });

            // Create the mesh (combination of geometry and material)
            sphere = new THREE.Mesh(geometry, material);
            scene.add(sphere); // Add sphere to the scene
        }

        // Function to load the font once and then create all 3D text elements
        function loadFontAndCreateText() {
            const loader = new THREE.FontLoader();
            loader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/fonts/helvetiker_regular.typeface.json', function (loadedFont) {
                font = loadedFont; // Store the loaded font

                // Define text elements with their positions and colors
                const textElements = [
                    { text: "Mind", position: new THREE.Vector3(0, 1.5, 0), color: 0xFFFF00 },    // Yellow
                    { text: "Heart", position: new THREE.Vector3(0, -1.5, 0), color: 0xFF0000 }, // Red
                    { text: "Body", position: new THREE.Vector3(-2, 0, 0), color: 0xFFA500 },   // Orange
                    { text: "Spirit", position: new THREE.Vector3(2, 0, 0), color: 0xADD8E6 }   // Light Blue
                ];

                textElements.forEach(element => {
                    create3DText(element.text, element.position, element.color);
                });
            },
            // Optional: Progress callback
            function (xhr) {
                console.log((xhr.loaded / xhr.total * 100) + '% loaded');
            },
            // Optional: Error callback
            function (err) {
                console.error('An error happened while loading the font:', err);
            });
        }

        // Generic function to create 3D text with specified text, position, and color
        function create3DText(text, position, color) {
            if (!font) {
                console.error("Font not loaded yet!");
                return;
            }

            const textGeometry = new THREE.TextGeometry(text, {
                font: font,
                size: 0.4, // Size of the text (slightly smaller for multiple words)
                height: 0.08, // Depth of the text
                curveSegments: 12, // How many points on the curves
                bevelEnabled: true, // Enable bevel for rounded edges
                bevelThickness: 0.01, // How deep the bevel is
                bevelSize: 0.01, // How far the bevel extends from the text
                bevelOffset: 0,
                bevelSegments: 5 // How many segments in the bevel
            });

            // Center the text geometry
            textGeometry.computeBoundingBox();
            const centerOffset = -0.5 * (textGeometry.boundingBox.max.x - textGeometry.boundingBox.min.x);
            textGeometry.translate(centerOffset, 0, 0);

            const textMaterial = new THREE.MeshPhongMaterial({ color: color }); // Set the specific color for the text
            const textMesh = new THREE.Mesh(textGeometry, textMaterial);

            // Set the position of the text mesh relative to its parent group
            textMesh.position.copy(position);
            textGroup.add(textMesh); // Add the text mesh to the group
        }

        // Function to handle window resizing
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight; // Update aspect ratio
            camera.updateProjectionMatrix(); // Update projection matrix
            renderer.setSize(window.innerWidth, window.innerHeight); // Resize renderer
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate); // Request the next frame

            controls.update(); // Only required if controls.enableDamping or controls.autoRotate are set to true

            // If startRotation flag is true, rotate the text group
            if (startRotation) {
                textGroup.rotation.y += 0.005; // Rotate around the Y-axis
                textGroup.rotation.x += 0.003; // Rotate around the X-axis for more complex movement
            }

            renderer.render(scene, camera); // Render the scene with the camera
        }

        // Start the application when the window loads
        window.onload = function() {
            init(); // Initialize the scene
            animate(); // Start the animation loop
        };
    </script>
</body>
</html>
