<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ורד ולב 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Prevent scrollbars */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000000; /* Black background for HTML body */
            font-family: sans-serif; /* Fallback font */
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="three-canvas"></canvas>

    <!-- Three.js Library CDN - classic build (exposes THREE globally) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <!-- FontLoader and TextGeometry from 'examples/js' (not 'jsm') to work with global THREE -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
    <!-- OrbitControls for camera interaction (from 'examples/js' for global THREE compatibility) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>


    <script>
        console.log("Script started: Displaying 'Rose' text orbiting heart.");

        // 1. Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); // Set Three.js scene background to black
        console.log("Scene created.");

        // 2. Camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 120; // Position camera further back to make the scene appear more distant
        console.log("Camera created and positioned.");

        // 3. Renderer
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        console.log("Renderer created and sized.");

        // Initialize OrbitControls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // For smoother camera movement
        controls.dampingFactor = 0.05;
        // OrbitControls handles touch events (pan and zoom) automatically
        console.log("OrbitControls initialized.");


        // 4. Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2); // General illumination
        scene.add(ambientLight);
        console.log("Ambient Light added.");

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0); // Strong intensity
        directionalLight.position.set(10, 10, 10);
        scene.add(directionalLight);
        console.log("Directional Light added.");

        const pointLight = new THREE.PointLight(0xffffff, 0.8, 100);
        pointLight.position.set(0, 0, 50);
        scene.add(pointLight);
        console.log("Point Light added.");

        // --- Global Variables ---
        let roseTextBox; // Our 3D box with the Hebrew text texture
        let heartMesh;
        const clock = new THREE.Clock();

        // Orbit specific variables for 'ורד'
        const orbitRadius = 80; // Significantly increased radius for 'ורד' around the center (heart)
        const orbitSpeed = 0.5; // Radians per second for orbit speed

        // --- Helper function to create a 3D Box with 2D Canvas Text Texture on one face ---
        function createHebrewTextBox(text, fontSize, textColor, boxColor, boxWidth, boxHeight, boxDepth) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            
            // Set canvas dimensions
            canvas.width = 512; // Standard texture size for power of 2
            canvas.height = 256; // Standard texture size for power of 2

            // Fill background (this is for the text plane's background, not the scene)
            context.fillStyle = boxColor;
            context.fillRect(0, 0, canvas.width, canvas.height);

            // Set text properties
            context.font = `${fontSize}px Arial, sans-serif`; // Use a common font that supports Hebrew
            context.fillStyle = textColor;
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.direction = 'rtl'; // Ensure right-to-left for Hebrew text on canvas

            // Draw text
            context.fillText(text, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            
            // Create materials for all 6 faces of the box
            const materials = [
                new THREE.MeshPhongMaterial({ color: boxColor }), // Right face
                new THREE.MeshPhongMaterial({ color: boxColor }), // Left face
                new THREE.MeshPhongMaterial({ color: boxColor }), // Top face
                new THREE.MeshPhongMaterial({ color: boxColor }), // Bottom face
                new THREE.MeshPhongMaterial({ map: texture }),    // Front face (where text is)
                new THREE.MeshPhongMaterial({ color: boxColor })  // Back face
            ];

            const geometry = new THREE.BoxGeometry(boxWidth, boxHeight, boxDepth);
            const mesh = new THREE.Mesh(geometry, materials);

            console.log(`Created text box for: ${text}`);
            return mesh;
        }

        // --- Create 3D Text Box ("ורד") ---
        roseTextBox = createHebrewTextBox('ורד', 120, '#d12c6a', '#a0c0ff', 40, 20, 5); // Adjusted font size, and made text plane background bluish
        scene.add(roseTextBox);
        console.log("Rose text box created and added to scene.");

        // --- Create 3D Heart ---
        function createHeartShape() {
            const shape = new THREE.Shape();

            const x = 0, y = 0; // Center the heart shape's drawing coordinates
            shape.moveTo( x + 2.5, y + 2.5 );
            shape.bezierCurveTo( x + 2.5, y + 2.5, x + 2, y, x, y );
            shape.bezierCurveTo( x - 3, y, x - 3, y + 3.5, x - 3, y + 3.5 );
            shape.bezierCurveTo( x - 3, y + 5.5, x - 1.5, y + 7.7, x + 2.5, y + 9.5 );
            shape.bezierCurveTo( x + 6.5, y + 7.7, x + 8, y + 5.5, x + 8, y + 3.5 );
            shape.bezierCurveTo( x + 8, y + 3.5, x + 8, y, x + 5, y );
            shape.bezierCurveTo( x + 3.5, y, x + 2.5, y + 2.5, x + 2.5, y + 2.5 );

            return shape;
        }

        const extrudeSettings = {
            steps: 2,
            depth: 2,
            bevelEnabled: true,
            bevelThickness: 0.5,
            bevelSize: 0.5,
            bevelSegments: 4
        };
        const heartShape = createHeartShape();
        const heartGeometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
        heartGeometry.center(); // Center the geometry's origin

        const heartMaterial = new THREE.MeshPhongMaterial({ color: 0xef4444 });
        heartMesh = new THREE.Mesh(heartGeometry, heartMaterial);
        heartMesh.scale.set(8, 8, 8); // Set initial large size for the heart
        heartMesh.visible = true; // Heart is always visible
        heartMesh.rotation.x = Math.PI; // Rotate heart 180 degrees around X-axis to fix upside-down issue
        scene.add(heartMesh);
        console.log("Heart mesh created and added to scene (always visible and pulsing).");

        // 5. Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Update OrbitControls
            controls.update(); // This handles mouse and touch input for camera movement

            // Animate "ורד" (orbiting around the center - the heart)
            if (roseTextBox) {
                // Orbit in the XZ plane (like Earth around Sun, viewed from side)
                roseTextBox.position.x = Math.cos(elapsedTime * orbitSpeed) * orbitRadius;
                roseTextBox.position.z = Math.sin(elapsedTime * orbitSpeed) * orbitRadius;
                roseTextBox.position.y = 0; // Keep it on the XZ plane (height of orbit)

                // The box itself rotates around its own Y-axis (vertical)
                roseTextBox.rotation.y = elapsedTime * orbitSpeed * 2; // Adjust speed as desired
                roseTextBox.rotation.x = Math.sin(elapsedTime * orbitSpeed * 2) * 0.1; // Still add a slight tilt
            }

            // Animate Heart (pulsing)
            const pulseTime = elapsedTime * 3; // Adjust speed of pulse
            const scaleFactor = 1 + (Math.sin(pulseTime) * 0.1); // Pulse from 0.9 to 1.1
            heartMesh.scale.set(8 * scaleFactor, 8 * scaleFactor, 8 * scaleFactor); // Apply pulse relative to initial large size

            renderer.render(scene, camera);
        }

        // Start the animation loop
        animate();

        // 6. Handle Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            console.log("Window resized.");
        });

        console.log("Script finished initialization part.");
    </script>
</body>
</html>
