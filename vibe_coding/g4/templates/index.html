<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>g4 — Gemma 4 Local</title>

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <!-- marked (Markdown) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@13/marked.min.js"></script>

  <!-- highlight.js (code blocks) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/highlight.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 14px 20px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      font-size: 15px;
      color: #888;
    }
    header span { color: #4ade80; font-weight: 600; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.7;
      font-size: 15px;
      word-break: break-word;
    }

    /* Markdown inside .msg */
    .msg h1, .msg h2, .msg h3 {
      margin: 12px 0 6px;
      color: #f0f0f0;
    }
    .msg h1 { font-size: 1.3em; }
    .msg h2 { font-size: 1.15em; }
    .msg h3 { font-size: 1.05em; }
    .msg p { margin: 6px 0; }
    .msg ul, .msg ol { padding-right: 20px; margin: 6px 0; }
    .msg li { margin: 3px 0; }
    .msg strong { color: #fff; }
    .msg em { color: #ccc; }
    .msg a { color: #4ade80; }
    .msg hr { border-color: #333; margin: 10px 0; }
    .msg blockquote {
      border-right: 3px solid #4ade80;
      padding-right: 12px;
      color: #aaa;
      margin: 8px 0;
    }
    .msg code {
      background: #2a2a2a;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: "Fira Code", monospace;
      font-size: 13px;
      direction: ltr;
      display: inline-block;
    }
    .msg pre {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 14px;
      overflow-x: auto;
      margin: 10px 0;
      direction: ltr;
      text-align: left;
    }
    .msg pre code {
      background: none;
      padding: 0;
      font-size: 13px;
    }

    /* KaTeX block */
    .msg .katex-display {
      overflow-x: auto;
      margin: 10px 0;
      direction: ltr;
    }

    .msg.user {
      align-self: flex-start;
      background: #1e3a5f;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }

    .msg.gemma {
      align-self: flex-end;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-bottom-left-radius: 4px;
    }

    .msg.gemma.streaming {
      white-space: pre-wrap;
    }

    .msg.gemma.streaming::after {
      content: "▋";
      animation: blink 0.7s step-end infinite;
      color: #4ade80;
    }

    @keyframes blink { 50% { opacity: 0; } }

    #input-area {
      display: flex;
      gap: 10px;
      padding: 16px 20px;
      background: #1a1a1a;
      border-top: 1px solid #2a2a2a;
    }

    #user-input {
      flex: 1;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 12px;
      padding: 12px 16px;
      color: #e0e0e0;
      font-size: 15px;
      resize: none;
      outline: none;
      font-family: inherit;
      direction: auto;
      min-height: 48px;
      max-height: 160px;
      overflow-y: auto;
    }

    #user-input:focus { border-color: #4ade80; }

    #send-btn {
      background: #4ade80;
      color: #0f0f0f;
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      font-size: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
      align-self: flex-end;
      height: 48px;
    }

    #send-btn:hover { background: #22c55e; }
    #send-btn:disabled { background: #3a3a3a; color: #666; cursor: default; }

    .label {
      font-size: 11px;
      color: #555;
      margin-bottom: 4px;
    }

    .msg-wrap { display: flex; flex-direction: column; }
    .msg-wrap.user-wrap { align-items: flex-start; }
    .msg-wrap.user-wrap .label { text-align: right; }
    .msg-wrap.gemma-wrap { align-items: flex-end; }
    .msg-wrap.gemma-wrap .label { text-align: left; }
  </style>
</head>
<body>

<header>g4 &mdash; <span>Gemma 4 E2B</span> &nbsp;·&nbsp; מקומי לחלוטין</header>

<div id="messages"></div>

<div id="input-area">
  <textarea id="user-input" placeholder="כתוב הודעה..." rows="1"></textarea>
  <button id="send-btn">&#9650;</button>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("user-input");
  const sendBtn    = document.getElementById("send-btn");
  const history    = [];

  // Configure marked
  marked.use({ breaks: true, gfm: true });

  const KATEX_OPTS = {
    delimiters: [
      { left: "$$", right: "$$", display: true },
      { left: "$",  right: "$",  display: false },
      { left: "\\[", right: "\\]", display: true },
      { left: "\\(", right: "\\)", display: false },
    ],
    throwOnError: false,
  };

  function renderContent(el, text) {
    el.innerHTML = marked.parse(text);
    renderMathInElement(el, KATEX_OPTS);
  }

  function addMessage(role, text, streaming = false) {
    const wrap = document.createElement("div");
    wrap.className = `msg-wrap ${role === "user" ? "user-wrap" : "gemma-wrap"}`;

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = role === "user" ? "אתה" : "Gemma";

    const msg = document.createElement("div");
    msg.className = `msg ${role}`;
    if (streaming) {
      msg.classList.add("streaming");
      msg.textContent = "";  // plain text during stream
    } else if (role === "user") {
      msg.textContent = text;
    } else {
      renderContent(msg, text);
    }

    wrap.appendChild(label);
    wrap.appendChild(msg);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return msg;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;

    addMessage("user", text);
    history.push({ role: "user", content: text });

    const gemmaEl = addMessage("gemma", "", true);
    let fullReply = "";

    try {
      const resp = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });

      const reader  = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const raw = line.slice(6);
          if (raw === "[DONE]") break;
          try {
            const chunk = JSON.parse(raw);
            if (chunk.error) {
              gemmaEl.textContent = "שגיאה: " + chunk.error;
              gemmaEl.classList.remove("streaming");
              sendBtn.disabled = false;
              return;
            }
            if (chunk.text) {
              fullReply += chunk.text;
              // Show plain text while streaming
              gemmaEl.textContent = fullReply;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
          } catch {}
        }
      }
    } catch (e) {
      gemmaEl.textContent = "שגיאת חיבור";
    }

    // Streaming done — render markdown + latex
    gemmaEl.classList.remove("streaming");
    if (fullReply) {
      renderContent(gemmaEl, fullReply);
      history.push({ role: "assistant", content: fullReply });
    }

    messagesEl.scrollTop = messagesEl.scrollHeight;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  sendBtn.addEventListener("click", send);

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
  });

  inputEl.focus();
</script>
</body>
</html>
