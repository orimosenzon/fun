<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MJ-5 · אופנוע סילון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Heebo', sans-serif; color: #fff; }
  #stage canvas { display: block; }
  #overlay { position: fixed; inset: 0; pointer-events: none; }
  #status { position: fixed; top: 50%; left: 0; right: 0; text-align: center; font-size: 22px; opacity: 0.8; }
  .hud { position: absolute; left: 2.2vw; bottom: 3.2vh; width: 15.5vw; min-width: 190px; padding: 1.1vh 1.1vw 0.8vh;
    background: rgba(8, 10, 14, 0.38); border: 1px solid rgba(255,255,255,0.14); border-radius: 10px;
    backdrop-filter: blur(3px); font-size: clamp(11px, 0.95vw, 19px); transition: opacity 0.8s; opacity: 0; direction: rtl; }
  .hud .row { display: flex; justify-content: space-between; line-height: 1.55; }
  .hud .lab { opacity: 0.66; font-weight: 300; }
  .hud .val { font-weight: 600; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: plaintext; }
  .bars { display: flex; justify-content: space-between; margin-top: 1vh; direction: ltr; }
  .bar { position: relative; width: 17%; text-align: center; }
  .track { height: 7vh; background: rgba(255,255,255,0.1); border-radius: 3px; position: relative; overflow: hidden; }
  .fill { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(#ffb347, #e8590c); height: 0; }
  .vane { position: absolute; top: calc(3.5vh - 3px); left: calc(50% - 3px); width: 6px; height: 6px; border-radius: 50%; background: #7fd8ff; box-shadow: 0 0 4px #7fd8ff; }
  .bn { font-size: 0.72em; opacity: 0.7; margin-top: 2px; white-space: nowrap; direction: rtl; }
  .bcap { font-size: 0.7em; opacity: 0.5; text-align: center; margin-top: 0.3vh; }
  .title { position: absolute; top: 30vh; left: 0; right: 0; text-align: center; transition: opacity 1.2s; opacity: 0; text-shadow: 0 2px 18px rgba(0,0,0,0.55); }
  .t1 { font-size: 7.5vw; font-weight: 800; letter-spacing: 0.08em; direction: ltr; }
  .t2 { font-size: 2.3vw; font-weight: 300; margin-top: -1vh; }
  .t3 { font-size: 1.05vw; font-weight: 300; opacity: 0.85; margin: 2.2vh auto 0; max-width: 46vw; line-height: 1.6; }
  .caption { position: absolute; bottom: 5vh; right: 3vw; max-width: 40vw; font-size: clamp(13px, 1.35vw, 28px); font-weight: 400;
    text-shadow: 0 1px 10px rgba(0,0,0,0.8), 0 0 2px rgba(0,0,0,0.6); transition: opacity 0.7s; opacity: 0; }
  .endcard { position: absolute; top: 34vh; left: 0; right: 0; text-align: center; transition: opacity 1.2s; opacity: 0; text-shadow: 0 2px 18px rgba(0,0,0,0.6); }
  .endcard .t2 { font-size: 4vw; font-weight: 800; direction: ltr; }
  .endcard .t3 { font-size: 1.3vw; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; align-items: center; padding: 8px 14px;
    background: linear-gradient(transparent, rgba(0,0,0,0.6)); direction: ltr; font-size: 14px; }
  #ui input[type=range] { flex: 1; }
  #ui button, #ui select { background: #222; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 4px 10px; font: inherit; }
  #shot { min-width: 170px; opacity: 0.8; font-variant-numeric: tabular-nums; }
  body.render #ui { display: none; }
  body.render .hud, body.render .title, body.render .caption, body.render .endcard { transition: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="overlay"></div>
<div id="status"></div>
<div id="ui" hidden>
  <button id="play">▶</button>
  <input id="scrub" type="range" min="0" max="100" step="0.01" value="0">
  <span id="shot"></span>
  <select id="cam"><option value="film">מצלמות הסרט</option><option value="orbit">מצלמה חופשית</option></select>
</div>
<script>if (location.search.includes('render')) document.body.classList.add('render');</script>
<script type="module" src="js/render/app.js"></script>
</body>
</html>
